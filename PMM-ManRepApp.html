function dsFacilityAdd(){
  ensureClientDefaults();
  client.facilities.push({
    id:'fac_'+Date.now(),financer:'',accountNo:'',description:'',
    type:'amort',instalment:0,
    sageNCP:'',sageCP:'',sageInterest:'Interest on Instalment agreements'
  });
  renderDebtSchedule();

function dsFacilityDelete(i){
  if(!confirm('Remove this facility?'))return;
  client.facilities.splice(i,1);
  renderDebtSchedule();
}
function dsFacilitySet(i,field,val){
  if(!client.facilities[i])return;
  client.facilities[i][field]=val;
  // No re-render — input stays focused. mark() keeps state in sync.
  mark();
}

// ── TAB 2: Monthly Recon ─────────────────────────────────────────────────────
function dsBuildRecon(cur,rm){
  let facs=dsFacilities();
  if(!rm) return '<div class="ds-section active"><div class="warning">Set the Report Month in Settings first.</div></div>';
  if(!facs.length) return '<div class="ds-section active"><div class="warning">No facilities set up yet. Go to the Facilities tab first.</div></div>';

  let recon=dsRecon();
  let bs=client.raw.bs.accounts||{};
  let hasBSData=Object.keys(bs).length>0;

  let allReconciled=true;
  let rows=facs.map((f,i)=>{
    let e=dsEntry(f.id);
    let bsVal=bsBalForFacility(f);
    let stmtCap=e.stmtCapital;
    let inst=e.instalment!==null?e.instalment:f.instalment;
    let remInst=e.remainingInstalments;

    // Variance: statement capital vs BS combined NCP+CP
    let hasStmt=stmtCap!==null;
    let hasBS=hasBSData&&(f.sageNCP||f.sageCP);
    let variance=hasStmt&&hasBS?stmtCap-bsVal:null;
    let varAbs=variance!==null?Math.abs(variance):null;
    let tl='grey';
    if(hasStmt&&hasBS){
      if(varAbs<1) tl='green';
      else tl='red';
      if(tl!=='green') allReconciled=false;
    } else if(!hasStmt){ allReconciled=false; }

    let tlSpan='<span class="tl-'+(tl==='grey'?'grey':tl==='green'?'green':'red')+'">'+
      (tl==='grey'?'—':tl==='green'?'✓ OK':'✗ Variance')+'</span>';

    // Build row — using onchange (not oninput) so full value is captured on blur/tab
    return '<tr>'+
      '<td style="white-space:nowrap"><b>'+esc(f.financer||'—')+'</b><br><span class="muted" style="font-size:11px">'+esc(f.accountNo||'')+'</span></td>'+
      '<td>'+esc(f.description||'—')+'<br><span class="'+dsTypeClass(f.type)+' ds-facility-type">'+dsTypeLabel(f.type)+'</span></td>'+
      '<td class="right">'+
        '<input class="ds-input right" type="number" step="0.01" placeholder="Enter from statement"'+
        ' value="'+(stmtCap!==null?stmtCap:'')+'"'+
        ' onchange="dsSetEntry(\''+f.id+'\',\'stmtCapital\',this.value===\'\'?null:parseFloat(this.value))">'+
      '</td>'+
      '<td class="right">'+
        '<input class="ds-input right" type="number" step="0.01" placeholder="e.g. 1140.47"'+
        ' value="'+(e.stmtInterest!==null?e.stmtInterest:'')+'"'+
        ' onchange="dsSetEntry(\''+f.id+'\',\'stmtInterest\',this.value===\'\'?null:parseFloat(this.value))">'+
      '</td>'+
      '<td class="right">'+
        '<input class="ds-input right" type="number" step="0.01" placeholder="e.g. 120.00"'+
        ' value="'+(e.stmtAdminFee!==null?e.stmtAdminFee:'')+'"'+
        ' onchange="dsSetEntry(\''+f.id+'\',\'stmtAdminFee\',this.value===\'\'?null:parseFloat(this.value))">'+
      '</td>'+
      '<td class="right">'+
        '<input class="ds-input right" type="number" step="0.01"'+
        ' value="'+(inst||'')+'"'+
        ' onchange="dsSetEntry(\''+f.id+'\',\'instalment\',parseFloat(this.value)||null)">'+
      '</td>'+
      '<td class="right">'+
        '<input class="ds-input right" type="number" step="1" min="0" placeholder="From statement"'+
        ' value="'+(remInst!==null?remInst:'')+'"'+
        ' onchange="dsSetEntry(\''+f.id+'\',\'remainingInstalments\',this.value===\'\'?null:parseInt(this.value))">'+
      '</td>'+
      '<td class="right">'+(hasBSData&&(f.sageNCP||f.sageCP)?money(bsVal,cur):'<span class="muted">—</span>')+'</td>'+
      '<td class="right">'+(variance!==null?('<span style="color:'+(varAbs<1?'var(--ok)':'var(--bad)')+'">'+money(variance,cur)+'</span>'):'<span class="muted">—</span>')+'</td>'+
      '<td>'+tlSpan+'</td>'+
    '</tr>';
  }).join('');

  let summaryMsg=allReconciled&&facs.length?
    '<div class="ok-msg" style="margin-top:10px">✓ All facilities reconciled for '+monthLabel(rm)+' — ready to generate journal.</div>':
    (hasBSData?'<div class="warning" style="margin-top:10px">Enter statement figures for each facility and reconcile before generating the journal.</div>':'<div class="warning" style="margin-top:10px">Import the Balance Sheet first (Import Data) to enable recon comparison.</div>');

  return '<div class="ds-section active">'+
    '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">'+
      '<p class="muted" style="font-size:12px">Enter figures from each lender\'s statement for <b>'+monthLabel(rm)+'</b>. The BS column pulls from the latest imported Balance Sheet.</p>'+
      '<button class="btn" onclick="mark()">💾 Save</button>'+
    '</div>'+
    '<div class="ds-table-wrap">'+

// ── TAB 3: Journal ────────────────────────────────────────────────────────────
function dsBuildJournal(cur,rm){
  if(!rm) return '<div class="ds-section active"><div class="warning">Set the Report Month in Settings first.</div></div>';
  let facs=dsFacilities();
  if(!facs.length) return '<div class="ds-section active"><div class="warning">No facilities set up. Go to Facilities tab first.</div></div>';

  let recon=dsRecon();
  let bs=client.raw.bs.accounts||{};
  let lines=[];
  let warnings=[];
  let dateStr=dsJournalDate(rm);
  let ref='DebtRecon-'+rm;

  facs.forEach(f=>{
    let e=recon[f.id]||{};
    let stmtCap=e.stmtCapital;
    if(stmtCap===null||stmtCap===undefined){warnings.push(f.financer+' ('+f.accountNo+'): No statement balance entered.');return;}

    // 1. Correct NCP + CP split to match statement balance
    let bsNCP=num(bs[f.sageNCP]);
    let bsCP=num(bs[f.sageCP]);
    let bsTotal=bsNCP+bsCP;
    let varDiff=stmtCap-bsTotal;

    if(Math.abs(varDiff)>=1){
      // Adjust the NCP account to absorb the variance (CP is driven by current year journals)
      if(varDiff>0){
        // BS is understated — Credit NCP (increase liability), Debit adjustment
        if(f.sageNCP){
          lines.push({date:dateStr,dc:'Credit',account:f.sageNCP,ref,desc:'Debt recon adjustment '+f.description,vat:'No VAT',excl:Math.abs(varDiff).toFixed(2),tax:'0.00',total:Math.abs(varDiff).toFixed(2),affect:'',comment:''});
          lines.push({date:dateStr,dc:'Debit',account:f.sageNCP,ref,desc:'Debt recon contra '+f.description,vat:'No VAT',excl:Math.abs(varDiff).toFixed(2),tax:'0.00',total:Math.abs(varDiff).toFixed(2),affect:f.sageNCP,comment:'Recon: stmt '+stmtCap+' vs BS '+bsTotal});
        }
      } else {
        // BS is overstated — Debit NCP (reduce liability)
        if(f.sageNCP){
          lines.push({date:dateStr,dc:'Debit',account:f.sageNCP,ref,desc:'Debt recon adjustment '+f.description,vat:'No VAT',excl:Math.abs(varDiff).toFixed(2),tax:'0.00',total:Math.abs(varDiff).toFixed(2),affect:'',comment:''});
          lines.push({date:dateStr,dc:'Credit',account:f.sageNCP,ref,desc:'Debt recon contra '+f.description,vat:'No VAT',excl:Math.abs(varDiff).toFixed(2),tax:'0.00',total:Math.abs(varDiff).toFixed(2),affect:f.sageNCP,comment:'Recon: stmt '+stmtCap+' vs BS '+bsTotal});
        }
      }
    }

    // 2. Interest accrual for the month
    let interest=e.stmtInterest||0;
    let adminFee=e.stmtAdminFee||0;
    let totalInterest=interest+adminFee;
    if(totalInterest>=1&&f.sageInterest){
      let intAccount=f.sageInterest||'Interest on Instalment agreements';
      lines.push({date:dateStr,dc:'Debit',account:intAccount,ref,desc:'Interest '+f.description+' '+monthLabel(rm),vat:'No VAT',excl:totalInterest.toFixed(2),tax:'0.00',total:totalInterest.toFixed(2),affect:'',comment:'Interest: '+interest.toFixed(2)+' Admin: '+adminFee.toFixed(2)});
      // Credit an interest accrual liability or the NCP account
      let cpAcc=f.sageCP||f.sageNCP||'';
      if(cpAcc){
        lines.push({date:dateStr,dc:'Credit',account:cpAcc,ref,desc:'Interest accrual '+f.description+' '+monthLabel(rm),vat:'No VAT',excl:totalInterest.toFixed(2),tax:'0.00',total:totalInterest.toFixed(2),affect:intAccount,comment:''});
      }
    }
  });

  // Build preview table
  let previewRows=lines.length?lines.map(l=>
    '<tr>'+
      '<td>'+l.date+'</td>'+
      '<td><span style="color:'+(l.dc==='Debit'?'#1e40af':'#047857')+'">'+l.dc+'</span></td>'+
      '<td>'+esc(l.account)+'</td>'+
      '<td>'+esc(l.ref)+'</td>'+
      '<td>'+esc(l.desc)+'</td>'+
      '<td class="right">'+money(parseFloat(l.excl),cur)+'</td>'+
      '<td>'+esc(l.comment)+'</td>'+
    '</tr>'
  ).join(''):'<tr><td colspan="7" style="padding:14px;text-align:center;color:var(--muted)">No journal lines — ensure statement balances are entered in the Recon tab.</td></tr>';

  let warnBlock=warnings.length?
    '<div class="warning" style="margin-bottom:10px">'+warnings.map(w=>'⚠ '+esc(w)).join('<br>')+'</div>':'';

  return '<div class="ds-section active">'+
    warnBlock+
    '<div class="btns" style="margin-bottom:12px">'+
      '<button class="btn primary" onclick="dsDownloadJournal()" '+(lines.length?'':'disabled')+'>⬇ Download Sage CSV</button>'+
      '<button class="btn" onclick="dsShowTab(\'recon\')">← Back to Recon</button>'+
    '</div>'+
    '<div class="ds-table-wrap">'+
      '<table>'+
        '<thead><tr>'+
          '<th>Date</th><th>Dr/Cr</th><th style="min-width:200px">Account</th>'+
          '<th style="min-width:130px">Reference</th><th style="min-width:220px">Description</th>'+
          '<th style="min-width:100px;text-align:right">Amount</th><th style="min-width:180px">Comment</th>'+
        '</tr></thead>'+
        '<tbody>'+previewRows+'</tbody>'+
      '</table>'+
    '</div>'+
  '</div>';
}

function dsJournalDate(rm){
  if(!rm)return '';
  let parts=rm.split('-');
  if(parts.length<2)return rm;
  let yr=parseInt(parts[0]),mo=parseInt(parts[1]);
  // Last day of the month
  let lastDay=new Date(yr,mo,0).getDate();
  return lastDay+'/'+String(mo).padStart(2,'0')+'/'+yr;
}

function dsDownloadJournal(){
  ensureClientDefaults();
  let rm=client.settings.reportMonth;
  let facs=dsFacilities();
  let recon=dsRecon();
  let bs=client.raw.bs.accounts||{};
  let dateStr=dsJournalDate(rm);
  let ref='DebtRecon-'+rm;
  let csvLines=[
    'Date,Debit/Credit,Account,Reference,Description,VAT Type,Exclusive,VAT,Total,Affecting Account,Comment,Analysis Code 1,Analysis Code 2,Analysis Code 3'
  ];

  facs.forEach(f=>{
    let e=recon[f.id]||{};
    let stmtCap=e.stmtCapital;
    if(stmtCap===null||stmtCap===undefined)return;
    let bsNCP=num(bs[f.sageNCP]);
    let bsCP=num(bs[f.sageCP]);
    let bsTotal=bsNCP+bsCP;
    let varDiff=stmtCap-bsTotal;

    function csvRow(date,dc,acc,r,desc,excl,comment){
      return [date,dc,'"'+acc+'"',r,'"'+desc+'"','No VAT',excl,'0.00',excl,'',(comment?'"'+comment+'"':''),'','',''].join(',');
    }

    if(Math.abs(varDiff)>=1&&f.sageNCP){
      let adjDC=varDiff>0?'Credit':'Debit';
      let contraDC=varDiff>0?'Debit':'Credit';
      csvLines.push(csvRow(dateStr,adjDC,f.sageNCP,ref,'Debt recon adj '+f.description,Math.abs(varDiff).toFixed(2),''));
      csvLines.push(csvRow(dateStr,contraDC,f.sageNCP,ref,'Debt recon contra '+f.description,Math.abs(varDiff).toFixed(2),'stmt:'+stmtCap+' bs:'+bsTotal));
    }

    let interest=e.stmtInterest||0;
    let adminFee=e.stmtAdminFee||0;
    let totalInterest=interest+adminFee;
    if(totalInterest>=1&&f.sageInterest){
      let cpAcc=f.sageCP||f.sageNCP||'';
      csvLines.push(csvRow(dateStr,'Debit',f.sageInterest,ref,'Interest '+f.description+' '+monthLabel(rm),totalInterest.toFixed(2),'Intr:'+interest.toFixed(2)+' Admin:'+adminFee.toFixed(2)));
      if(cpAcc)csvLines.push(csvRow(dateStr,'Credit',cpAcc,ref,'Interest accrual '+f.description,totalInterest.toFixed(2),''));
    }
  });

  let blob=new Blob([csvLines.join('\n')],{type:'text/csv'});
  let a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='DebtRecon_'+rm+'.csv';
  a.click();
}

function dsQCCheck(){
  let facs=dsFacilities();
  if(!facs.length)return null;
  let recon=dsRecon();
  let bs=client.raw.bs.accounts||{};
  let hasBSData=Object.keys(bs).length>0;
  if(!hasBSData)return null;
  let unreconciled=facs.filter(f=>{
    let e=recon[f.id]||{};
    if(e.stmtCapital===null||e.stmtCapital===undefined)return true;
    if(!f.sageNCP&&!f.sageCP)return false;
    let bsVal=bsBalForFacility(f);
    return Math.abs(e.stmtCapital-bsVal)>=1;
  });
  return {pass:unreconciled.length===0,count:unreconciled.length,names:unreconciled.map(f=>f.financer+' '+f.accountNo)};
}

function renderStockRecon(){
  ensureClientDefaults();
  if(!client.stockRecon)client.stockRecon={};
  let cur=client.settings.currency||'R';
  let rm=client.settings.reportMonth;
  let kb=client.kpiBenchmarks;

  // Depts with stock recon (BM, IM, TD)
  const STOCK_DEPTS=[
    {id:'bm',label:'Blow Moulding',gpPctKey:'stock_gp_pct_bm'},
    {id:'im',label:'Injection Moulding',gpPctKey:'stock_gp_pct_im'},
    {id:'td',label:'Dispensing Tubes',gpPctKey:'stock_gp_pct_td'},
  ];

  let cards=STOCK_DEPTS.map(dept=>{
    let sr=client.stockRecon[dept.id]||{};
    let gpPct=kb[dept.gpPctKey]||0;
    // Get actual data from P&L
    let sales=getDeptValue(dept.id,'sales',rm)||0;
    let purchases=getDeptValue(dept.id,'purchases',rm)||0;
    let openingStock=num(sr.openingStock)||0;
    let actualStockTake=sr.actualStockTake!==undefined?num(sr.actualStockTake):null;
    // Theoretical: Opening + Purchases - (Sales × GP Cost%)
    let theoreticalClosing=openingStock+purchases-(sales*gpPct);
    let diff=actualStockTake!==null?actualStockTake-theoreticalClosing:null;
    let diffPct=theoreticalClosing?diff/theoreticalClosing:null;

    return `<div style="background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:12px">
      <div style="background:${dept.id==='bm'?'#1e40af':dept.id==='im'?'#065f46':'#7c3aed'};color:#fff;padding:10px 14px;font-weight:bold">${dept.label}</div>
      <div style="padding:14px;display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div>
          <label style="font-size:11px">Opening Stock (from last month's actual)</label>
          <input type="number" value="${openingStock||''}" placeholder="0" style="font-size:12px;padding:5px 8px"
            onchange="if(!client.stockRecon['${dept.id}'])client.stockRecon['${dept.id}']={};client.stockRecon['${dept.id}'].openingStock=+this.value;renderStockRecon()">
        </div>
        <div>
          <label style="font-size:11px">GP Cost % (from Settings: ${(gpPct*100).toFixed(0)}%)</label>
          <input type="number" value="${(gpPct*100).toFixed(1)}" step="0.5" style="font-size:12px;padding:5px 8px"
            onchange="client.kpiBenchmarks['${dept.gpPctKey}']=+this.value/100;renderStockRecon()">
        </div>
        <div>
          <label style="font-size:11px">Sales (from Sage P&L)</label>
          <div style="font-size:14px;font-weight:bold;padding:6px 0">${money(sales,cur)}</div>
        </div>
        <div>
          <label style="font-size:11px">Purchases (from Sage P&L)</label>
          <div style="font-size:14px;font-weight:bold;padding:6px 0">${money(purchases,cur)}</div>
        </div>
        <div>
          <label style="font-size:11px">Theoretical Closing Stock</label>
          <div style="font-size:14px;font-weight:bold;padding:6px 0;color:var(--muted)">${money(theoreticalClosing,cur)}</div>
        </div>
        <div>
          <label style="font-size:11px">Actual Stock Take</label>
          <input type="number" value="${actualStockTake!==null?actualStockTake:''}" placeholder="Enter stock take value" style="font-size:12px;padding:5px 8px"
            onchange="if(!client.stockRecon['${dept.id}'])client.stockRecon['${dept.id}']={};client.stockRecon['${dept.id}'].actualStockTake=this.value===''?null:+this.value;renderStockRecon()">
        </div>
      </div>
      ${actualStockTake!==null?`<div style="padding:10px 14px;background:${Math.abs(diffPct||0)<0.1?'#ecfdf5':'#fef2f2'};border-top:1px solid var(--line)">
        <b>Variance: ${money(diff,cur)} (${diffPct!==null?(diffPct*100).toFixed(1)+'%':'—'})</b>
        ${Math.abs(diffPct||0)<0.1?' ✓ Within 10%':' ⚠ Investigate'}
      </div>`:''}
    </div>`;
  }).join('');

  document.getElementById('stock_recon').innerHTML=`
  <div class="panel">
    <h2>Stock Reconciliation</h2>
    <p class="muted" style="margin-bottom:14px;font-size:12px">
      Formula: <b>Opening Stock + Purchases − (Sales × GP Cost %) = Theoretical Closing Stock</b><br>
      Compare to actual stock take to identify variances. Sales and Purchases pull from the imported Sage P&L.
    </p>
    ${cards}
    <p class="muted" style="font-size:11px;margin-top:8px">GP Cost % can be adjusted per department above or in Settings → KPI Benchmarks → Stock Reconciliation.</p>
  </div>`;
}

function renderEstitrackRecon(){
  ensureClientDefaults();
  if(!client.estitrackRecon)client.estitrackRecon={};
  let cur=client.settings.currency||'R';
  let rm=client.settings.reportMonth;

  const DEPTS=[
    {id:'bm',label:'Blow Moulding'},{id:'im',label:'Injection Moulding'},
    {id:'td',label:'Dispensing Tubes'},{id:'tda',label:'Extrusion'}
  ];

  // Get Pastel total from Sage P&L (total purchases across all depts)
  let pastelTotal=['bm','im','td','tda','pmm'].reduce((s,d)=>s+getDeptValue(d,'purchases',rm),0);

  let er=client.estitrackRecon[rm]||{};

  // Calculate Estitrack total and apportionment
  let estitrackTotal=DEPTS.reduce((s,d)=>s+num(er[d.id]||0),0);
  let diff=pastelTotal-estitrackTotal;

  let deptRows=DEPTS.map(d=>{
    let val=num(er[d.id]||0);
    let apportion=estitrackTotal?val/estitrackTotal:0;
    let distributed=pastelTotal*apportion;
    let adjustment=distributed-val;
    return `<tr>
      <td>${d.label}</td>
      <td><input type="number" value="${val||''}" placeholder="0" style="width:110px;border:1px solid #d1d5db;border-radius:4px;padding:4px 6px;font-size:12px;text-align:right"
        onchange="if(!client.estitrackRecon['${rm}'])client.estitrackRecon['${rm}']={};client.estitrackRecon['${rm}']['${d.id}']=+this.value;renderEstitrackRecon()"></td>
      <td class="right" style="font-size:12px">${(apportion*100).toFixed(1)}%</td>
      <td class="right" style="font-size:12px">${money(distributed,cur)}</td>
      <td class="right" style="font-size:12px;color:${Math.abs(adjustment)<100?'var(--ok)':'var(--bad)'}">${money(adjustment,cur)}</td>
    </tr>`;
  }).join('');

  document.getElementById('estitrack_recon').innerHTML=`
  <div class="panel">
    <h2>Estitrack Reconciliation — ${monthLabel(rm)}</h2>
    <p class="muted" style="margin-bottom:14px;font-size:12px">
      Enter Estitrack purchases per department. The app apportions the Pastel (Sage) total across departments based on Estitrack's proportional split.
    </p>
    <div style="background:#f9fafb;border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:14px;display:flex;gap:24px">
      <div><div style="font-size:11px;color:var(--muted)">Pastel Total (from Sage)</div><div style="font-size:18px;font-weight:bold">${money(pastelTotal,cur)}</div></div>
      <div><div style="font-size:11px;color:var(--muted)">Estitrack Total (entered)</div><div style="font-size:18px;font-weight:bold">${money(estitrackTotal,cur)}</div></div>
      <div><div style="font-size:11px;color:var(--muted)">Difference</div><div style="font-size:18px;font-weight:bold;color:${Math.abs(diff)<100?'var(--ok)':'var(--bad)'}">${money(diff,cur)}</div></div>
    </div>
    <table>
      <thead><tr>
        <th style="min-width:160px">Department</th>
        <th style="min-width:120px">Estitrack Purchases</th>
        <th class="right" style="width:80px">% Split</th>
        <th class="right" style="min-width:110px">Distributed (Pastel)</th>
        <th class="right" style="min-width:110px">Adjustment</th>
      </tr></thead>
      <tbody>${deptRows}</tbody>
      <tfoot><tr style="font-weight:bold;background:#f9fafb">
        <td>TOTAL</td>
        <td style="text-align:right;font-size:12px">${money(estitrackTotal,cur)}</td>
        <td class="right">100%</td>
        <td class="right;font-size:12px">${money(pastelTotal,cur)}</td>
        <td></td>
      </tfoot>
    </table>
    <p class="muted" style="font-size:11px;margin-top:10px">Each month's Estitrack figures are stored separately. Previous months' data is preserved when you roll forward.</p>
  </div>`;
}

      if(_fileHandle){
        let w=await _fileHandle.createWritable();
        await w.write(json);await w.close();
        document.getElementById('saveState').textContent='Saved: '+_fileHandle.name+' ✓';
        return;
      }
      _fileHandle=await window.showSaveFilePicker({suggestedName:_defaultFileName(),types:[{description:'JSON',accept:{'application/json':['.json']}}]});
      let w=await _fileHandle.createWritable();
      await w.write(json);await w.close();
      document.getElementById('saveState').textContent='Saved: '+_fileHandle.name+' ✓';
    }catch(err){if(err.name!=='AbortError')_legacyDownload(json);}
  }else{_legacyDownload(json);}
}

async function saveAsJSON(){
  saveSettings_silent();
  let json=JSON.stringify(client,null,2);
  if(_fsapiSupported){
    try{
      _fileHandle=await window.showSaveFilePicker({suggestedName:_defaultFileName(),types:[{description:'JSON',accept:{'application/json':['.json']}}]});
      let w=await _fileHandle.createWritable();
      await w.write(json);await w.close();
      document.getElementById('saveState').textContent='Saved: '+_fileHandle.name+' ✓';
    }catch(err){if(err.name!=='AbortError')_legacyDownload(json);}
  }else{_legacyDownload(json);}
}

function _legacyDownload(json){
  let blob=new Blob([json],{type:'application/json'});
  let a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=_defaultFileName();
  a.click();
}

async function openFileJSON(){
  if(_fsapiSupported){
    try{
      let [handle]=await window.showOpenFilePicker({types:[{description:'JSON',accept:{'application/json':['.json']}}],multiple:false});
      _fileHandle=handle;
      let file=await handle.getFile();
      let text=await file.text();
      client=JSON.parse(text);
      ensureClientDefaults();
      mark();
      show('dashboard');
      alert('Loaded: '+handle.name);
    }catch(err){if(err.name!=='AbortError')alert('Could not open: '+err.message);}
  }else{document.getElementById('legacyLoadInput').click();}
}

function loadJSONLegacy(e){
  let f=e.target.files[0];if(!f)return;
  let r=new FileReader();
  r.onload=ev=>{
    client=JSON.parse(ev.target.result);
    ensureClientDefaults();
    _fileHandle=null;
    mark();
    show('dashboard');
    alert('Loaded: '+f.name);
  };
  r.readAsText(f);
}

function rollForward(){
  if(!client.settings.clientName){alert('Load a client file first.');return;}
  let[y,m]=client.settings.reportMonth.split('-').map(Number);
  let ny=m===12?y+1:y,nm=m===12?1:m+1;
  let next=ny+'-'+String(nm).padStart(2,'0');
  let nextLabel=monthLabel(next);
  if(!confirm(`Roll forward from ${monthLabel(client.settings.reportMonth)} to ${nextLabel}?\n\nThis will:\n  • Set report month to ${nextLabel}\n  • Clear imported P&L, BS, A/R and A/P data\n  • Reset status to Draft\n\nBudgets, mappings and COA are carried forward.\n\nSave as a new JSON after rolling forward.`))return;
  client.settings.reportMonth=next;
  client.settings.status='Draft';
  client.raw.pl={periods:[],accounts:{}};
  client.raw.bs={asOf:null,accounts:{}};
  client.raw.ar={asOf:null,rows:[]};
  client.raw.ap={asOf:null,rows:[]};
  client.imports=[];
  mark();
  show('imports');
  alert(`Rolled forward to ${nextLabel}. Import the new Sage files to continue.`);
}

// Silent save (no UI update)
function saveSettings_silent(){
  let get=id=>{let el=document.getElementById(id);return el?el.value:null;};
  if(get('s_clientName'))client.settings.clientName=get('s_clientName');
  if(get('s_fyStart'))client.settings.fyStartMonth=+get('s_fyStart');
  if(get('s_currency'))client.settings.currency=get('s_currency');
  if(get('s_reportMonth'))client.settings.reportMonth=get('s_reportMonth');
  if(get('s_status'))client.settings.status=get('s_status');
  if(get('s_preparedBy'))client.settings.preparedBy=get('s_preparedBy');
  if(get('s_narrative'))client.narrative=get('s_narrative');
}

function jumpToNote(num){
  show('notes');
  setTimeout(()=>{
    let el=document.getElementById('note'+num);
    if(el){el.scrollIntoView({behavior:'smooth',block:'center'});
      el.style.outline='2px solid var(--brand)';
      setTimeout(()=>{el.style.outline='';},2000);}
  },250);
}
ensureClientDefaults();
mark();
show('dashboard');

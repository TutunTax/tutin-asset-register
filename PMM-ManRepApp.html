<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PMM Management Report Engine</title>
<link rel="manifest" href="manifest.json">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  --ink:#1f2937;--muted:#6b7280;--line:#e5e7eb;--paper:#fff;--bg:#f4f6f8;
  --brand:#1a56db;--soft:#eff6ff;--ok:#047857;--warn:#b45309;--bad:#b91c1c;
  --ok-bg:#ecfdf5;--warn-bg:#fffbeb;--bad-bg:#fef2f2;
  /* Department colours */
  --bm:#1e3a5f; --bm-soft:#eff6ff;
  --im:#2d5016; --im-soft:#f0fdf4;
  --tr:#4c2a00; --tr-soft:#fff7ed;
  --td:#7c2d12; --td-soft:#fef3c7;
  --tda:#312e81;--tda-soft:#eef2ff;
  --pmm:#374151;--pmm-soft:#f9fafb;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:var(--bg);font-size:13px}
header{background:var(--brand);color:#fff;padding:13px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;position:sticky;top:0;z-index:10}
header h1{font-size:17px;font-weight:bold}
header small{opacity:.85;font-weight:normal}
.hdr-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hdr-meta{font-size:11px;opacity:.85;text-align:right;line-height:1.6}
.hdr-btn{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.4);padding:6px 11px;border-radius:8px;cursor:pointer;font-size:12px;font-family:inherit}
.hdr-btn:hover{background:rgba(255,255,255,.28)}
.hdr-btn.accent{background:rgba(255,255,255,.25);border-color:rgba(255,255,255,.7);font-weight:bold}
.save-state{font-size:11px;opacity:.85}

.app{display:grid;grid-template-columns:240px 1fr;min-height:calc(100vh - 52px)}
nav{background:#fff;border-right:1px solid var(--line);padding:12px 10px;position:sticky;top:52px;height:calc(100vh - 52px);overflow:auto}
.nav-group{margin-bottom:4px}
.nav-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:8px 10px 4px;font-weight:bold}
.tab{display:block;width:100%;border:0;background:transparent;text-align:left;padding:9px 12px;border-radius:8px;margin-bottom:2px;color:var(--ink);cursor:pointer;font:inherit;font-size:13px}
.tab.active,.tab:hover{background:var(--soft);color:var(--brand);font-weight:bold}
.main{padding:18px;overflow:auto}
.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.hidden{display:none!important}
h2{margin:0 0 14px;font-size:20px}
h3{margin:16px 0 8px;font-size:15px;color:#111}
h3:first-child{margin-top:0}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid #d1d5db;border-radius:8px;background:#fff;font:inherit;font-size:13px}
textarea{min-height:70px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(140px,1fr));gap:12px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{border:1px solid var(--line);background:#fff;padding:8px 12px;border-radius:8px;cursor:pointer;font:inherit;font-size:13px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.danger{border-color:#fecaca;color:var(--bad)}
.btn.sm{padding:5px 9px;font-size:12px}
.btn:hover{filter:brightness(.96)}
table{width:100%;border-collapse:collapse}
th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;font-size:12px;vertical-align:middle}
th{background:#f9fafb;font-weight:bold;color:#374151}
.right{text-align:right}
.bold{font-weight:bold}
.muted{color:var(--muted)}
.import-card{border:1px dashed #cbd5e1;border-radius:10px;padding:12px;background:#fcfcfd;margin-bottom:8px}
.import-card h4{margin:0 0 6px;font-size:13px}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:bold}
.pill.draft{background:#f1f5f9;color:#475569}
.pill.review{background:#fffbeb;color:#b45309}
.pill.final{background:#ecfdf5;color:#047857}
.var{display:inline-flex;align-items:center;font-size:11px;font-weight:bold;padding:1px 6px;border-radius:4px}
.var.fav{background:#dcfce7;color:#15803d}
.var.adv{background:#fee2e2;color:#b91c1c}
.var.neu{background:#f3f4f6;color:#6b7280}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-left:4px;vertical-align:middle}
.dot-ok{background:#16a34a} .dot-warn{background:#ca8a04} .dot-bad{background:#dc2626}
.warning{background:#fffbeb;border:1px solid #fde68a;color:#92400e;padding:10px;border-radius:8px;margin-bottom:10px}
.ok-msg{background:#ecfdf5;border:1px solid #a7f3d0;color:#065f46;padding:10px;border-radius:8px;margin-bottom:10px}
.kpi-grid{display:grid;grid-template-columns:repeat(4,minmax(160px,1fr));gap:10px}
.kpi-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px}
.kpi-card .kv{font-size:20px;font-weight:bold;margin-top:4px}
.kpi-card .kl{font-size:11px;color:var(--muted)}

/* Budget builder */
.budget-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px;max-height:calc(100vh - 280px);background:#fff;cursor:grab}
.budget-wrap:active{cursor:grabbing}
.budget-tbl{min-width:1600px;border-collapse:separate;border-spacing:0}
.budget-tbl th{position:sticky;top:0;z-index:3;background:#f9fafb;border-bottom:1px solid var(--line);padding:6px 8px;font-size:11px;white-space:nowrap}
.budget-tbl .col-account{position:sticky;left:0;z-index:4;min-width:240px;width:240px;background:#fff;border-right:1px solid var(--line)}
.budget-tbl th.col-account{background:#f9fafb;z-index:6}
.budget-tbl td{border-bottom:1px solid var(--line);padding:5px 6px;font-size:12px;vertical-align:middle}
.budget-tbl .section-row td{background:var(--brand)!important;color:#fff!important;font-weight:bold;font-size:12px;padding:5px 8px}
.budget-tbl .subtotal-row td{background:#f0f4ff;font-weight:bold;font-size:12px}
.budget-tbl .total-row td{background:#eef2ff;font-weight:bold;border-top:2px solid #374151;font-size:12px}
.budget-input{width:90px;text-align:right;padding:4px 6px;border:1px solid #d1d5db;border-radius:6px;font:inherit;font-size:12px}
.budget-input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 2px rgba(26,86,219,.15)}
.budget-cell{display:flex;align-items:center;gap:3px}
.copy-fwd{border:1px solid #d1d5db;background:#f9fafb;border-radius:5px;padding:2px 5px;font-size:10px;cursor:pointer;color:var(--muted);white-space:nowrap;flex-shrink:0}
.copy-fwd:hover{background:var(--soft);border-color:var(--brand);color:var(--brand)}
.pct-mode-btn{border:1px solid #d1d5db;background:#f9fafb;border-radius:5px;padding:2px 6px;font-size:10px;cursor:pointer;color:var(--muted);white-space:nowrap}
.pct-mode-btn.active{background:var(--soft);border-color:var(--brand);color:var(--brand);font-weight:bold}
.pct-mode-btn:hover{background:var(--soft)}

/* Dept colours */
.dept-bm{color:var(--bm)} .dept-im{color:var(--im)} .dept-tr{color:var(--tr)} .dept-td{color:var(--td)} .dept-tda{color:var(--tda)} .dept-pmm{color:var(--pmm)}
.dept-hdr-bm{background:var(--bm);color:#fff} .dept-hdr-im{background:var(--im);color:#fff}
.dept-hdr-tr{background:var(--tr);color:#fff} .dept-hdr-td{background:var(--td);color:#fff}
.dept-hdr-tda{background:var(--tda);color:#fff} .dept-hdr-pmm{background:var(--pmm);color:#fff}

/* Report */
.report-wrap{max-width:1200px;margin:0 auto}
.report-cover{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;min-height:600px;border:1px solid #111;padding:48px;margin-bottom:24px;page-break-after:always}
.report-page{page-break-before:always;margin-top:32px;padding-top:20px;border-top:3px solid var(--brand)}
.report-title{font-size:19px;font-weight:bold;margin:0 0 14px}
.section-hdr{background:var(--brand);color:#fff;padding:7px 10px;font-weight:bold;font-size:13px;margin:20px 0 6px}
.stmt{width:100%;border-collapse:collapse}
.stmt th,.stmt td{border-bottom:1px solid var(--line);padding:5px 7px;font-size:12px;vertical-align:middle}
.stmt th{background:#f9fafb;font-weight:bold}
.stmt .total-row td{font-weight:bold;border-top:1px solid #111;border-bottom:2px solid #111}
.stmt .grand-row td{font-weight:bold;border-top:2px solid #111;border-bottom:3px double #111}
.report-scroll{overflow:auto;max-height:calc(100vh - 180px)}
.report-scroll thead th{position:sticky;top:0;background:#f9fafb;z-index:4;box-shadow:0 1px 0 var(--line)}
.stmt .section-row td{background:var(--brand);color:#fff;font-weight:bold}
.stmt .subtotal-row td{background:#fafafa;font-weight:bold;border-top:1px dashed #d1d5db}
.stmt .indent{padding-left:22px!important}

/* Dept P&L Report */
.dept-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px;margin-bottom:16px}
.dept-card{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.dept-card-hdr{padding:12px 14px;font-weight:bold;font-size:14px;color:#fff}
.dept-card-body{padding:14px}
.dept-card table{font-size:12px}
.dept-card th,.dept-card td{padding:5px 6px}

/* ── Debt Schedule Module ────────────────────────────────────── */
.ds-tabs{display:flex;gap:4px;margin-bottom:14px;border-bottom:2px solid var(--line);padding-bottom:0}
.ds-tab{background:none;border:none;padding:9px 16px;cursor:pointer;font:inherit;font-size:13px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-2px}
.ds-tab.active{color:var(--brand);font-weight:bold;border-bottom-color:var(--brand)}
.ds-tab:hover{color:var(--brand)}
.ds-section{display:none}.ds-section.active{display:block}
/* Sticky-header scrollable tables */
.ds-table-wrap{overflow:auto;max-height:calc(100vh - 320px);border:1px solid var(--line);border-radius:8px}
.ds-table-wrap table{width:100%;border-collapse:separate;border-spacing:0}
.ds-table-wrap thead th{position:sticky;top:0;z-index:3;background:#f9fafb;border-bottom:2px solid var(--line);padding:7px 8px;font-size:12px;white-space:nowrap;box-shadow:0 1px 0 var(--line)}
.ds-table-wrap td{border-bottom:1px solid var(--line);padding:6px 8px;font-size:12px;vertical-align:middle}
/* Traffic lights */
.tl-green{background:#ecfdf5;color:#047857;font-weight:bold;border-radius:6px;padding:2px 8px;font-size:11px}
.tl-red{background:#fef2f2;color:#b91c1c;font-weight:bold;border-radius:6px;padding:2px 8px;font-size:11px}
.tl-grey{background:#f3f4f6;color:#6b7280;font-weight:bold;border-radius:6px;padding:2px 8px;font-size:11px}
/* Inline inputs inside table cells - key fix for single-character bug */
.ds-input{width:100%;border:1px solid #d1d5db;border-radius:5px;padding:4px 6px;font:inherit;font-size:12px;background:#fff;box-sizing:border-box}
.ds-input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 2px rgba(26,86,219,.12)}
.ds-input.right{text-align:right}
.ds-sum-row td{background:#f0f4ff;font-weight:bold;border-top:2px solid #374151}
.ds-facility-type{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:bold}
.ds-type-amort{background:#dbeafe;color:#1e40af}
.ds-type-revolving{background:#fef3c7;color:#92400e}
.ds-type-overdraft{background:#fee2e2;color:#991b1b}
.ds-type-director{background:#f3e8ff;color:#6b21a8}
.ds-type-other{background:#f3f4f6;color:#374151}

@media print{
  header,nav,.no-print{display:none!important}
  .app{display:block}
  .main{padding:0}
  .panel:not(.printable){border:0;box-shadow:none}
  .budget-wrap{overflow:visible!important;max-height:none!important;border:0}
  .budget-tbl{min-width:0!important;width:100%!important}
  .budget-tbl th,.budget-tbl td{font-size:8.5px!important;padding:2px 3px!important}
  .budget-input{border:0!important;background:transparent!important;width:70px!important}
  .section-hdr{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .stmt .section-row td{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .dept-card-hdr{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .dot{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<header>
  <div>
    <h1>PMM Management Report Engine <small>v1.1</small></h1>
  </div>
  <div class="hdr-right">
    <span class="save-state" id="saveState">No file loaded</span>
    <button class="hdr-btn" onclick="openFileJSON()" title="Open JSON">📂 Open</button>
    <button class="hdr-btn" onclick="downloadJSON()" title="Save">💾 Save</button>
    <button class="hdr-btn" onclick="saveAsJSON()" title="Save As">Save As…</button>
    <button class="hdr-btn accent no-print" onclick="rollForward()" title="Roll to next month">⏩ Roll Forward</button>
  </div>
</header>

<div class="app">
<nav class="no-print" id="navTabs">
  <div class="nav-group">
    <div class="nav-label">Overview</div>
    <button class="tab active" onclick="show('dashboard')">🏠 Dashboard</button>
    <button class="tab" onclick="show('qc')">✅ QC &amp; Status</button>
  </div>
  <div class="nav-group">
    <div class="nav-label">Setup</div>
    <button class="tab" onclick="show('settings')">⚙️ Settings</button>
    <button class="tab" onclick="show('imports')">📥 Import Data</button>
    <button class="tab" onclick="show('mapping')">🔗 Account Mapping</button>
    <button class="tab" onclick="show('coa')">📋 Reporting COA</button>
  </div>
  <div class="nav-group">
    <div class="nav-label">Budgets</div>
    <button class="tab" onclick="show('budget')">💰 Budget Builder</button>
    <button class="tab" onclick="show('dept_budget')">🏭 Dept Budgets</button>
  </div>
  <div class="nav-group">
    <div class="nav-label">Data Entry</div>
    <button class="tab" onclick="show('debt_schedule')">🏦 Debt Schedule</button>
    <button class="tab" onclick="show('stock_recon')">📦 Stock Recon</button>
    <button class="tab" onclick="show('estitrack_recon')">🔄 Estitrack Recon</button>
  </div>
  <div class="nav-group">
    <div class="nav-label">Reports</div>
    <button class="tab" onclick="show('management_report')">📄 Management Report</button>
    <button class="tab" onclick="show('report')">📊 Profit &amp; Loss</button>
    <button class="tab" onclick="show('balance_sheet')">📋 Balance Sheet</button>
    <button class="tab" onclick="show('notes')">📝 Notes</button>
    <button class="tab" onclick="show('debtors')">👥 Debtors Age</button>
    <button class="tab" onclick="show('creditors')">👥 Creditors Age</button>
    <button class="tab" onclick="show('dept_report')">🏭 Dept P&amp;L Report</button>
  </div>
</nav>

<main class="main">
  <section id="dashboard" class="view"></section>
  <section id="qc" class="view hidden"></section>
  <section id="management_report" class="view hidden"></section>
  <section id="debt_schedule" class="view hidden"></section>
  <section id="stock_recon" class="view hidden"></section>
  <section id="estitrack_recon" class="view hidden"></section>
  <section id="settings" class="view hidden"></section>
  <section id="imports" class="view hidden"></section>
  <section id="mapping" class="view hidden"></section>
  <section id="coa" class="view hidden"></section>
  <section id="budget" class="view hidden"></section>
  <section id="dept_budget" class="view hidden"></section>
  <section id="notes" class="view hidden"></section>
  <section id="balance_sheet" class="view hidden"></section>
  <section id="debtors" class="view hidden"></section>
  <section id="creditors" class="view hidden"></section>
  <section id="report" class="view hidden printable"></section>
  <section id="dept_report" class="view hidden printable"></section>
</main>
</div>

<label style="display:none"><input type="file" accept=".json" onchange="loadJSONLegacy(event)" id="legacyLoadInput" hidden></label>

<script>
// ═══════════════════════════════════════════════════════
//  CONSTANTS
// ═══════════════════════════════════════════════════════
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

const DEPARTMENTS=[
  {id:'bm',  label:'Blow Moulding',     color:'var(--bm)',  hdrClass:'dept-hdr-bm'},
  {id:'im',  label:'Injection Moulding',color:'var(--im)',  hdrClass:'dept-hdr-im'},
  {id:'tr',  label:'Toolroom',          color:'var(--tr)',  hdrClass:'dept-hdr-tr'},
  {id:'td',  label:'Tube Department',   color:'var(--td)',  hdrClass:'dept-hdr-td'},
  {id:'tda', label:'TDA Extrusion',     color:'var(--tda)', hdrClass:'dept-hdr-tda'},
  {id:'pmm', label:'PMM (Shared)',      color:'var(--pmm)', hdrClass:'dept-hdr-pmm'},
];

// Sage account name → department assignment
// Accounts not listed here go into a general/consolidated bucket
const SAGE_DEPT_MAP={
  // Sales
  'Sales - Blow Moulding':        {dept:'bm',  role:'sales'},

  'Sales - Dispensing Tubes':     {dept:'td',  role:'sales'},
  'Sales - Extrusion':            {dept:'tda', role:'sales'},
  'Sales - PMM':                  {dept:'pmm', role:'sales'},
  'Sales':                        {dept:'pmm', role:'sales'},

  'Sales - Buy Out Items':        {dept:'pmm', role:'sales'},

  'Opening Stock - Blow Moulding':{dept:'bm',  role:'opening_stock'},

  'Opening Stock - TDA':          {dept:'tda', role:'opening_stock'},
  'Opening Stock (Shared)':       {dept:'pmm', role:'opening_stock'},
  // Purchases
  'Purchases - Blow Moulding':    {dept:'bm',  role:'purchases'},
  'Purchases - Injection Moulding':{dept:'im', role:'purchases'},
  'Purchases - Toolroom':         {dept:'tr',  role:'purchases'},
  'Purchases - Dispensing Tubes':{dept:'td',  role:'purchases'},

  'Purchases - Raw Material':     {dept:'pmm', role:'purchases'},
  'Purchases':                    {dept:'pmm', role:'purchases'},
  'Cost of Sales / Purchases':    {dept:'pmm', role:'purchases'},
  'Cost of Sales / Purchases - Services':{dept:'pmm',role:'purchases'},

  'Purchases corrections':        {dept:'pmm', role:'purchases'},

  // Closing Stock
  'Closing Stock - Blow Moulding':{dept:'bm',  role:'closing_stock'},
  'Closing Stock - Injection Moulding':{dept:'im',role:'closing_stock'},

  'Closing Stock TDA':            {dept:'tda', role:'closing_stock'},
  'Closing Stock (Shared)':       {dept:'pmm', role:'closing_stock'},
  // Wages & Labour
  'Wages - Blow Moulding':        {dept:'bm',  role:'wages'},
  'Overtime - Blow Moulding':     {dept:'bm',  role:'wages'},

  'Wages - Toolroom':             {dept:'tr',  role:'wages'},

  // Consumables
  'Consumables - Blow Moulding':  {dept:'bm',  role:'consumables'},
  'Consumables - Injection Moulding':{dept:'im',role:'consumables'},
  'Consumables - Tool Room':      {dept:'tr',  role:'consumables'},
  'Consumables - Tube Department':{dept:'td',  role:'consumables'},
  'Consumables':                  {dept:'pmm', role:'consumables'},
  'Consumables - PMM':            {dept:'pmm', role:'consumables'},
  // Repairs & Maintenance
  'Repair & Maintenance - Blow Moulding ':{dept:'bm',role:'r_and_m'},
  'Repair & Maintenance - Injection Moulding':{dept:'im',role:'r_and_m'},

function num(v){if(v===null||v===undefined||v==='')return 0;return Number(String(v).replace(/[^0-9.\-]/g,''))||0}
function esc(s){return String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function money(v,cur){cur=cur||client.settings.currency||'R';let n=Math.abs(v);let s=Math.round(n).toLocaleString('en-ZA');return (v<0?'(':'')+(cur?cur+'\u00a0':'')+s+(v<0?')':'')}
function moneyK(v){let n=Math.abs(v);let s=n>=1e6?(n/1e6).toFixed(2)+'M':n>=1e3?(n/1e3).toFixed(0)+'K':Math.round(n).toString();return (v<0?'(':'')+s+(v<0?')':'')}
function pct(v,decimals){decimals=decimals===undefined?1:decimals;return (v>=0?'':'')+((v||0)*100).toFixed(decimals)+'%'}
// favPositive=true → positive variance is good (income, profit lines)
// favPositive=false → negative variance is good (expense/cost lines: under budget = good)
function varBadge(v,favPositive){
  if(v===undefined||v===null||isNaN(v)||!isFinite(v))return '—';
  let isGood=(favPositive===false)?(v<=0):(v>=0);
  let cls=isGood?'fav':'adv';
  // Still cap display as a safety net for any remaining large variances
  let absV=Math.abs(v);
  let display=absV>9.99?((v>0?'>+999%':'>-999%')):(v>=0?'+':'')+pct(v,1);
  return `<span class="var ${cls}">${display}</span>`;
}
function trafficDot(v,favPositive,threshold){threshold=threshold||0.05;let good=(favPositive===false)?v<=0:v>=0;let abs=Math.abs(v);if(good&&abs<threshold/2)return '<span class="dot dot-warn"></span>';if(good)return '<span class="dot dot-ok"></span>';return '<span class="dot dot-bad"></span>';}
function monthLabel(k){if(!k)return '';let[y,m]=k.split('-').map(Number);return MONTHS[m-1]+' '+y}
function fyMonths(){let start=+client.settings.fyStartMonth||7;let[y,mo]=client.settings.reportMonth.split('-').map(Number);let fyStartYear=mo>=start?y:y-1;return Array.from({length:12},(_,i)=>{let mm=((start-1+i)%12)+1;let yy=fyStartYear+(start-1+i>=12?1:0);return yy+'-'+String(mm).padStart(2,'0')})}
function ytdMonths(){let all=fyMonths();let rm=client.settings.reportMonth;let idx=all.indexOf(rm);return idx<0?[rm]:all.slice(0,idx+1)}
function periodKey(v){if(!v)return null;if(v instanceof Date){let y=v.getFullYear(),m=v.getMonth()+1;if(y>2000&&y<2100)return y+'-'+String(m).padStart(2,'0');return null;}let s=String(v).trim();if(/^\d{4}-\d{2}$/.test(s))return s;let mn=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];let m=s.match(/([A-Za-z]{3,})\s*(\d{4})/);if(m){let i=mn.indexOf(m[1].slice(0,3).toLowerCase());if(i>=0)return m[2]+'-'+String(i+1).padStart(2,'0');}let d2=s.match(/^(\d{4})-(\d{2})-\d{2}$/);if(d2)return d2[1]+'-'+d2[2];return null;}
function isProbablyNonAccountName(s){if(!s)return true;s=s.toString().trim();if(!s)return true;if(/^-+$/.test(s))return true;if(/^page \d/i.test(s))return true;if(/^date:/i.test(s))return true;return false;}
function rowHasNumericValues(r,periods){return periods.some((_,i)=>{let v=r[i+1];return v!==null&&v!==undefined&&v!==''&&typeof v!=='string'&&!isNaN(Number(v))&&Number(v)!==0;})}

function guessMap(name,kind){
  let s=name.toLowerCase().trim();
  if(kind==='pl'){
    // ── COS: stock movement (must come before any 'sale' check) ──────────────
    if(/opening stock/.test(s))                              return'cogs.opening_stock';
    if(/closing stock/.test(s))                              return'cogs.closing_stock';

    // ── COS: direct cost lines (name starts with "Cost of Sale") ─────────────
    if(/^cost of sale[s]?\s*[-–]/.test(s)||/^cost of sale[s]?$/.test(s)) return'cogs.cos_direct';
    if(/^cos\s*[-–]/.test(s))                                return'cogs.wages';   // COS - Labour Contracted Out

    // ── COS: purchases / materials ───────────────────────────────────────────
    if(/^purchase[s]?\s*[-–]/.test(s)||/^purchase[s]?$/.test(s)) return'cogs.purchases';
    if(/^buy out|^buy-out/.test(s))                          return'cogs.purchases';
    if(/item adjustment/.test(s))                            return'cogs.purchases';
    if(/payment received/.test(s))                           return'cogs.cos_direct';
    if(/cost of sales\s*\/\s*purchase/.test(s))              return'cogs.purchases';
    if(/purchase.*correction/.test(s))                       return'cogs.purchases';

    // ── COS: wages & labour ──────────────────────────────────────────────────
    if(/^wage[s]?\s*[-–]|^overtime\s*[-–]|^casual wage/.test(s)) return'cogs.wages';
    if(/wages.*shared|shared.*production/.test(s))           return'cogs.wages';
    if(/^labour net$/.test(s))                               return'expense.salaries_wages';

    // ── COS: consumables ─────────────────────────────────────────────────────
    if(/^consumable[s]?\s*[-–]|^consumable[s]?$/.test(s))   return'cogs.consumables';

    // ── COS: repairs & maintenance ───────────────────────────────────────────
    if(/^repair[s]?\s*(&|and)\s*maintenance\s*[-–]|^repair[s]?\s*(&|and)\s*maintenance$/.test(s)) return'cogs.r_and_m';

    // ── Income: sales ────────────────────────────────────────────────────────
    if(/^sales?\s*[-–]/.test(s)||/^sales?$/.test(s)||/^other sales?$/.test(s)) return'income.sales';
    if(/^sales?\s*[-–].*time/.test(s))                       return'income.sales';
    if(/revenue/.test(s)&&!/interest|rental/.test(s))        return'income.sales';

    // ── Income: discounts allowed ─────────────────────────────────────────────
    if(/^discount$/.test(s)||/discount.*allow/.test(s))      return'income.discounts';

    // ── Other Income ─────────────────────────────────────────────────────────
    if(/interest.*received|interest income/.test(s))         return'other_income.interest_received';
    if(/discount received/.test(s))                          return'other_income.discounts_received';
    if(/\beti\b|employee.*tax.*incentive/.test(s))           return'other_income.etd_deduction';
    if(/early settlement discount/.test(s))                  return'other_income.recoveries';
    if(/rent.*recoup|recoupment/.test(s))                    return'other_income.recoveries';
    if(/profit.*disposal|disposal.*profit/.test(s))          return'other_income.recoveries';
    if(/insurance claim.*received|claim.*received/.test(s))  return'other_income.recoveries';
    if(/bad debt.*recover/.test(s))                          return'other_income.recoveries';
    if(/unallocated income/.test(s))                         return'other_income.recoveries';

    // ── PPE depreciation lines (specific, before generic 'depreciat' catch) ──
    if(/depreciat.*computer.*equip|depreciat.*computer$/.test(s)) return'ppe_dep.computer_equip';
    if(/depreciat.*computer.*soft|depreciat.*software/.test(s))   return'ppe_dep.computer_software';
    if(/depreciat.*motor|depreciat.*vehicle/.test(s))             return'ppe_dep.motor_vehicles';
    if(/depreciat.*plant|depreciat.*machin|depreciat.*equipment/.test(s)) return'ppe_dep.plant_machinery';
    if(/depreciat.*security/.test(s))                             return'ppe_dep.security_equip';
    if(/depreciat|amortis/.test(s))                               return'other_expense.depreciation';

    // ── Other Finance / Non-operating ────────────────────────────────────────
    if(/interest paid|investec.*finance.*fee|investec.*margin|trade finance|instalment|installment.*agreement|usplus/.test(s)&&/interest|fee/.test(s)) return'other_expense.interest_paid';
    if(/interest.*on.*instalment|interest.*on.*installment/.test(s)) return'other_expense.interest_paid';
    if(/sars.*interest|interest.*sars|interest.*provisional/.test(s)) return'other_expense.interest_paid';
    if(/bad debt/.test(s))                                         return'other_expense.bad_debts';
    if(/forex|foreign.*exchange|exchange.*gain|exchange.*loss|customer.*rounding/.test(s)) return'other_expense.forex';
    if(/fine[s]?|penalt/.test(s))                                  return'other_expense.fines';
    if(/income tax|tax expense|deferred tax/.test(s))              return'other_expense.income_tax';

    // ── Operating Expenses ───────────────────────────────────────────────────
    if(/director.*remun|remun.*director/.test(s))            return'expense.director_remuneration';
    if(/^salaries|salary|wages.*admin|admin.*wages/.test(s)) return'expense.salaries_wages';
    if(/staff placement|placement fee|weekly labour/.test(s))return'expense.salaries_wages';
    if(/^paye|uif.*deduct|payroll.*deduct/.test(s))          return'expense.salaries_wages';
    if(/accounting fee|bookkeeping/.test(s))                 return'expense.accounting_fees';
    if(/bank charge|transaction fee|service fee$/.test(s))   return'expense.bank_charges';
    if(/business partner.*admin|admin fee/.test(s))          return'expense.bank_charges';
    if(/commission.*referral/.test(s))                       return'expense.bank_charges';
    if(/cash withdraw/.test(s))                              return'expense.bank_charges';
    if(/cleaning/.test(s))                                   return'expense.cleaning';
    if(/computer expense|it expense|plastic analysis/.test(s)) return'expense.computer_expenses';
    if(/courier|shipping|deliver/.test(s))                   return'expense.courier';
    if(/electricity|solar/.test(s))                          return'expense.electricity';
    if(/entertainment|refreshment|donation/.test(s))         return'expense.entertainment';
    if(/^fuel/.test(s))                                      return'expense.fuel';
    if(/insurance|brightrock|echelon insurance|discovery.*plan|discovery.*cover|liberty.*debt|bright rock/.test(s)) return'expense.insurance';
    if(/legal|attorney/.test(s))                             return'expense.legal_fees';
    if(/motor vehicle|vehicle expense/.test(s))              return'expense.motor_vehicle';
    if(/printing|stationery/.test(s))                       return'expense.printing_stationery';
    if(/^rent paid|^rental\s*[-–]|^rent\s*[-–]|^levies|machine.*rental|rent.*machinery|rent.*parking|unit rent|rental.*asset/.test(s)) return'expense.rent';
    if(/security|guard/.test(s))                             return'expense.security';
    if(/staff.*welfare|welfare.*staff|staff medical|company clothing/.test(s)) return'expense.staff_welfare';
    if(/subscription|membership|cipc|clocking.*rental|unresolved|rounding adjustment/.test(s)) return'expense.subscription';
    if(/regulatory.*compliance.*coida|coida/.test(s))        return'expense.training';
    if(/regulatory.*compliance|compliance.*fee/.test(s))     return'expense.subscription';
    if(/telephone|internet/.test(s))                         return'expense.telephone_internet';
    if(/training|safety.*protect|ppe\b|polygraph|workman.*comp|coida|staff.*educat|replacement.*tool/.test(s)) return'expense.training';
    if(/travel|accommodat|public transport|uber/.test(s))    return'expense.travel';
    if(/^water|sanitat/.test(s))                             return'expense.water';
    if(/advertising/.test(s))                                return'expense.advertising';
    if(/staff transport/.test(s))                            return'expense.travel';
    if(/unallocated expense/.test(s))                        return'expense.subscription';
    if(/rent.*water dispenser|water dispenser/.test(s))      return'expense.rent';
    if(/fuel/.test(s))                                       return'expense.fuel';
  }
  // ── Balance Sheet ─────────────────────────────────────────────────────────
  if(kind==='bs'){
    // PPE — specific asset classes
    if(/@\s*cost|@ cost/.test(s)&&/computer equip/.test(s)) return'ppe_cost.computer_equip';
    if(/@\s*cost|@ cost/.test(s)&&/computer soft/.test(s)) return'ppe_cost.computer_software';
    if(/@\s*cost|@ cost/.test(s)&&/motor vehicle/.test(s)) return'ppe_cost.motor_vehicles';
    if(/@\s*cost|@ cost/.test(s)&&/plant|machiner/.test(s)) return'ppe_cost.plant_machinery';
    if(/@\s*cost|@ cost/.test(s)&&/security/.test(s))      return'ppe_cost.security_equip';
    if(/accum.*deprec.*computer equip|deprec.*computer equip/.test(s)) return'ppe_acc_dep.computer_equip';
    if(/accum.*deprec.*computer soft|deprec.*computer soft/.test(s))   return'ppe_acc_dep.computer_software';
    if(/accum.*deprec.*motor|deprec.*motor vehicle/.test(s))            return'ppe_acc_dep.motor_vehicles';
    if(/accum.*deprec.*plant|deprec.*plant|deprec.*equipment/.test(s))  return'ppe_acc_dep.plant_machinery';
    if(/accum.*deprec.*security|deprec.*security/.test(s))              return'ppe_acc_dep.security_equip';
    // Current assets
    if(/bank|current account|credit card|petty cash|money market|notice deposit|call account|debit card/.test(s)) return'asset_current.bank';
    if(/trade.*debtor|trade.*receiv|account.*receiv/.test(s)) return'asset_current.trade_debtors';
    if(/inventor|stock/.test(s))                             return'asset_current.inventory';
    if(/vat.*control|input.*vat|vat.*asset/.test(s))        return'asset_current.vat';
    if(/receiv|prepaid|staff.*loan|insurance.*pud|current.*tax.*asset|trade.*deposit/.test(s)) return'asset_current.other_receivables';
    // Non-current assets
    if(/investment/.test(s))                                 return'asset_noncurrent.investments';
    if(/loan.*receiv/.test(s))                              return'asset_noncurrent.loans';
    // Current liabilities
    if(/trade.*payable|trade.*creditor|account.*payable/.test(s)) return'liability_current.trade_creditors';
    if(/paye|uif|sdl|mibfa/.test(s))                        return'liability_current.paye_uif';
    if(/vat.*payable|output.*vat/.test(s))                   return'liability_current.vat_payable';
    if(/income.*tax.*payable/.test(s))                       return'liability_current.other';
    if(/staff.*saving.*payable|wages.*payable|salaries.*payable/.test(s)) return'liability_current.other';
    if(/sars.*tax.*debt|suspense|clearing/.test(s))          return'liability_current.other';
    if(/overdraft/.test(s))                                  return'liability_current.short_borrowings';
    if(/current portion/.test(s))                            return'liability_current.short_borrowings';
    // Non-current liabilities
    if(/non.current.*portion|long.term.*loan|director.*loan|loan.*payable|bond|mortgage/.test(s)) return'liability_noncurrent.borrowings';
    // Equity
    if(/share capital|member.*contrib|owner.*contrib/.test(s)) return'equity.share_capital';
    if(/retain|accumulat|opening balance/.test(s))           return'equity.retained_earnings';
    if(/current year|profit.*loss|system rounding/.test(s)) return'equity.current_year';
  }
  return '';
}

  let hasPPECOA=client.reportingCOA.some(c=>c.ppeRole==='cost');
  REPORTING_COA.forEach(m=>{
    if(m.id==='asset_noncurrent.ppe'&&hasPPECOA)return; // don't re-add flat PPE if already expanded
    if(!client.reportingCOA.find(x=>x.id===m.id))client.reportingCOA.push(JSON.parse(JSON.stringify(m)));
  });
  if(!client.mappings)client.mappings={};
  if(!client.mappingConfirmed)client.mappingConfirmed={};
  if(!client.raw)client.raw={};
  if(!client.raw.pl)client.raw.pl={periods:[],accounts:{}};
  if(!client.raw.bs)client.raw.bs={asOf:null,accounts:{}};
  if(!client.raw.ar)client.raw.ar={asOf:null,rows:[]};
  if(!client.raw.ap)client.raw.ap={asOf:null,rows:[]};
  if(!client.raw.pl_py)client.raw.pl_py={periods:[],accounts:{}};
  if(!client.raw.bs_py)client.raw.bs_py={asOf:null,accounts:{}};
  if(!client.raw.bs_history_cy)client.raw.bs_history_cy={};
  if(!client.raw.bs_history_py)client.raw.bs_history_py={};
  if(!client.budgets)client.budgets={};
  if(!client.deptBudgets)client.deptBudgets={};
  if(!client.budgetPctMode)client.budgetPctMode={};
  if(!client.imports)client.imports=[];
  if(!client.notes)client.notes=[];
  if(!client.reportNoteRefs)client.reportNoteRefs={};
  if(!client.debtors_notes)client.debtors_notes={};
  if(!client.creditors_notes)client.creditors_notes={};
  if(!client.debtors_terms)client.debtors_terms={};
  if(!client.creditors_terms)client.creditors_terms={};
  if(!client.ppeNotes)client.ppeNotes={};
  if(!client.kpiBenchmarks)client.kpiBenchmarks={};
  let kb=client.kpiBenchmarks;
  if(!kb.gp_pct)kb.gp_pct=0.40;
  if(!kb.np_pct)kb.np_pct=0.08;
  if(!kb.current_ratio)kb.current_ratio=1.5;
  if(!kb.debtor_days)kb.debtor_days=30;
  if(!kb.creditor_days)kb.creditor_days=45;
  if(kb.conv_rate_bm===undefined)kb.conv_rate_bm=2.5;
  if(kb.conv_rate_im===undefined)kb.conv_rate_im=2.0;
  if(kb.conv_rate_td===undefined)kb.conv_rate_td=2.0;
  if(kb.gplr_target===undefined)kb.gplr_target=2.0;
  if(kb.stock_gp_pct_bm===undefined)kb.stock_gp_pct_bm=0.36;
  if(kb.stock_gp_pct_im===undefined)kb.stock_gp_pct_im=0.24;
  if(kb.stock_gp_pct_td===undefined)kb.stock_gp_pct_td=0.30;
  if(kb.assessed_loss_cf===undefined)kb.assessed_loss_cf=0;
  if(kb.provisional_tax_paid===undefined)kb.provisional_tax_paid=0;
  if(kb.staff_savings_tolerance===undefined)kb.staff_savings_tolerance=50;
  if(kb.corp_tax_rate===undefined)kb.corp_tax_rate=0.27;
  if(!client.narrative)client.narrative='';
  if(!client.debtSchedule)client.debtSchedule=[];
  if(!client.facilities)client.facilities=[];
  if(!client.debtRecon)client.debtRecon={};
  // Migrate legacy debtSchedule rows into facilities (one-time, non-destructive)
  if(client.debtSchedule.length>0&&client.facilities.length===0){
    client.facilities=client.debtSchedule.map(function(r,i){return {
      id:'fac_'+Date.now()+'_'+i,
      financer:r.financer||'',accountNo:r.account||'',
      description:r.description||'',type:'amort',
      instalment:r.instalment||0,
      sageNCP:'',sageCP:'',sageInterest:'Interest on Instalment agreements'
    };});
  }
  if(!client.stockRecon)client.stockRecon={};
  if(!client.estitrackRecon)client.estitrackRecon={};
  // Ensure ppeNotes entries without calling getPPEClasses (avoids recursion)
  // Read directly from the already-set reportingCOA
  (client.reportingCOA||[]).filter(c=>c.ppeRole==='cost'&&c.ppeClass).forEach(c=>{
    let key='ppe_'+c.ppeClass;
    if(!client.ppeNotes[key])client.ppeNotes[key]={additions:0,disposals:0,note:''};
  });
  Object.keys(client.mappings||{}).forEach(k=>{if(client.mappingConfirmed[k]===undefined)client.mappingConfirmed[k]=true;});
}

function show(id){
  document.querySelectorAll('.view').forEach(v=>v.classList.add('hidden'));
  let el=document.getElementById(id);
  if(el)el.classList.remove('hidden');
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  let btn=document.querySelector(`.tab[onclick="show('${id}')"]`);
  if(btn)btn.classList.add('active');
  safeRender(id);
}

function safeRender(id){
  let renderMap={
    dashboard:renderDashboard,
    qc:renderQC,
    settings:renderSettings,
    imports:renderImports,
    mapping:renderMapping,
    coa:renderCOA,
    budget:renderBudget,
    dept_budget:renderDeptBudget,
    notes:renderNotes,
    management_report:renderManagementReport,
    balance_sheet:renderBalanceSheet,
    debt_schedule:renderDebtSchedule,
    stock_recon:renderStockRecon,
    estitrack_recon:renderEstitrackRecon,
    debtors:()=>renderAgeing('debtors'),
    creditors:()=>renderAgeing('creditors'),
    report:renderReport,
    dept_report:renderDeptReport,
  };
  if(!renderMap[id])return;
  try{renderMap[id]();}catch(e){
    let el=document.getElementById(id);
    if(el)el.innerHTML=`<div class="panel warning"><b>Render error [${esc(id)}]:</b> ${esc(e.message)}</div>`;
    console.error('Render error:',id,e);
  }
}

function lastImport(t){let x=[...client.imports].reverse().find(i=>i.type===t);return x?`Last: ${x.filename} (${x.period})`:'Not imported yet'}
function addImport(type,filename,period){client.imports.push({date:new Date().toLocaleString(),type,filename,period})}

// Import a BS file into the monthly history grid
function importBSHistoryFile(e, dest, expectedPeriod){
  let file = e.target.files[0]; if(!file) return;
  let ext = file.name.split('.').pop().toLowerCase();
  let rt = new FileReader();
  rt.onload = ev => {
    let text = ev.target.result;
    if(text.trim().startsWith('<') || text.includes('<table') || text.includes('<TABLE')){
      let rows = parseHTMLTable(text);
      // Parse BS Html but store into history slot
      parseSageBSHtmlIntoHistory(rows, file.name, dest, expectedPeriod);
    } else {
      // Binary XLS — process via XLSX
      let r2 = new FileReader();
      r2.onload = ev2 => {
        let wb = XLSX.read(ev2.target.result, {type:'array', cellDates:true});
        let rows2 = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, defval:null, raw:true});
        parseSageBSHtmlIntoHistory(rows2, file.name, dest, expectedPeriod);
      };
      r2.readAsArrayBuffer(file);
    }
    e.target.value = ''; // allow re-import of same file
  };
  rt.readAsText(file);
}

// Parse BS and store into history slot, also update current bs/bs_py if report month
function parseSageBSHtmlIntoHistory(rows, filename, dest, expectedPeriod){
  ensureClientDefaults();
  // Detect as-of date from 'Run At Date' row
  let dateRow = rows.find(r => String(r[0]||'').match(/run at date/i));
  let asOf = expectedPeriod; // default to the slot we're importing into
  if(dateRow && dateRow[1]){
    let m = String(dateRow[1]).trim().match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
    if(m) asOf = m[3]+'-'+String(m[2]).padStart(2,'0');
  }
  // If detected date differs from slot, warn but still store in the slot
  if(asOf !== expectedPeriod){
    if(!confirm(`File date is ${monthLabel(asOf)} but you clicked the ${monthLabel(expectedPeriod)} slot.
Store as ${monthLabel(expectedPeriod)}?`)){return;}
    asOf = expectedPeriod;
  }
  const SKIP = new Set(['assets','equity and liabilities','equity','liabilities','owners equity',
    'non-current assets','current assets','non-current liabilities','current liabilities',
    'owners contribution','clearing accounts','balance sheet report',
    'precision moulding & moulds (pty) ltd','']);
  let accounts = {};
  rows.forEach(r => {
    let name = String(r[0]||'').trim();
    let valStr = String(r[1]||'').trim();
    if(!name || SKIP.has(name.toLowerCase())) return;
    if(/^total/i.test(name) || /^run at date/i.test(name)) return;
    let n = parseFloat(valStr.replace(/,/g,''));
    if(isNaN(n)) return;
    accounts[name] = n;
    if(!client.mappings[name]){
      client.mappings[name] = guessMap(name,'bs');
      if(client.mappings[name]) client.mappingConfirmed[name] = false;
    }
  });
  // Store in history
  let histKey = dest==='bs_py' ? 'bs_history_py' : 'bs_history_cy';
  if(!client.raw[histKey]) client.raw[histKey] = {};
  client.raw[histKey][asOf] = {asOf, accounts};
  // Update current bs/bs_py if this is the report month (CY) or FY-end month (PY)
  let rm = client.settings.reportMonth;
  let fyStart = client.settings.fyStartMonth||3;
  let fyEndMonth = ((fyStart-1+11)%12)+1;
  let asOfMonth = parseInt(asOf.split('-')[1]);
  if(dest==='bs' && asOf===rm){
    client.raw.bs = {asOf, accounts};
  } else if(dest==='bs_py' && asOfMonth===fyEndMonth){
    client.raw.bs_py = {asOf, accounts};
  } else if(dest==='bs' && Object.keys(client.raw.bs.accounts||{}).length===0){
    client.raw.bs = {asOf, accounts}; // use first import if nothing yet
  }
  addImport(dest, filename, asOf);
  mark();
  safeRender('imports');
  alert(`BS imported: ${monthLabel(asOf)}\n${Object.keys(accounts).length} accounts stored in ${dest==='bs_py'?'PY':'CY'} history.`);
}

// Parse HTML table from Sage's HTML-saved-as-XLS format
function parseHTMLTable(htmlText){
  let rows=[];
  // Use DOMParser for clean extraction
  let doc=new DOMParser().parseFromString(htmlText,'text/html');
  doc.querySelectorAll('tr').forEach(tr=>{
    let cells=[];
    tr.querySelectorAll('td,th').forEach(td=>cells.push(td.textContent.trim()));
    if(cells.some(c=>c))rows.push(cells);
  });
  return rows;
}

function importFile(e,type){
  let file=e.target.files[0];if(!file)return;
  let ext=file.name.split('.').pop().toLowerCase();

  // Sage exports BS and ageing as HTML-disguised-as-XLS — detect by extension or sniff content
  if(ext==='xls'&&(type==='bs'||type==='bs_py'||type==='ar'||type==='ap')){
    // Read as text, check if HTML
    let rt=new FileReader();
    rt.onload=ev=>{
      let text=ev.target.result;
      if(text.trim().startsWith('<')||text.includes('<table')||text.includes('<TABLE')){
        // It's HTML-as-XLS
        let rows=parseHTMLTable(text);
        if(type==='bs')parseSageBSHtml(rows,file.name);
        else if(type==='bs_py')parseSageBSHtml(rows,file.name,'bs_py');
        else if(type==='ar')parseSageAgeHtml(rows,file.name,'ar');
        else if(type==='ap')parseSageAgeHtml(rows,file.name,'ap');
        mark();safeRender('imports');
        alert(`Imported: ${file.name}\nType: ${type.toUpperCase()}`);
      } else {
        // Fall back to binary XLSX reader
        processXLSX(file,type);
      }
    };
    rt.readAsText(file);
  } else {
    processXLSX(file,type);
  }
}

function processXLSX(file,type){
  let r=new FileReader();
  r.onload=ev=>{
    let wb=XLSX.read(ev.target.result,{type:'array',cellDates:true});
    let rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:null,raw:true});
    if(type==='pl')parseSagePL(rows,file.name);
    else if(type==='pl_py')parseSagePL(rows,file.name,'pl_py');
    else if(type==='bs')parseSageBS(rows,file.name);
    else if(type==='bs_py')parseSageBS(rows,file.name,'bs_py');
    else if(type==='ar')parseSageAge(rows,file.name,'ar');
    else if(type==='ap')parseSageAge(rows,file.name,'ap');
    mark();safeRender('imports');
    alert(`Imported: ${file.name}\nType: ${type.toUpperCase()}`);
  };
  r.readAsArrayBuffer(file);
}

// Parse Sage P&L: "Profit & Loss - Actual 1to12 - Actual YTD" format
// Columns: Col1=AccountName, Col2=AccCode, Col3=?, Col4=Period(1-12 marker), then Actual1..Actual12, then YTD
function parseSagePL(rows,filename,dest){
  dest=dest||'pl';
  ensureClientDefaults();

  // ── Extract header metadata ──────────────────────────────────────────────
  let yearRow=rows.find(r=>String(r[0]||'').trim()==='Year');
  let periodRow=rows.find(r=>String(r[0]||'').trim()==='Current Period');
  let fyYear=parseInt(String(yearRow?yearRow[1]:'').trim())||new Date().getFullYear();
  let fyStart=client.settings.fyStartMonth||7;

  // ── Build the 12 YYYY-MM period keys for this FY ────────────────────────
  // Sage "Year" = the calendar year the FY ends in.
  // e.g. Year=2027, fyStart=July → P1=2026-07 … P12=2027-06
  // e.g. Year=2026, fyStart=March → P1=2026-03 … P12=2027-02
  let baseYear=(fyStart>1)?fyYear-1:fyYear; // year in which P1 falls
  // Correction: if fyStart=Jan, base=fyYear; if fyStart=Jul, base=fyYear-1
  baseYear=(fyStart===1)?fyYear:(fyYear-1);
  let periods=Array.from({length:12},(_,i)=>{
    let mm=((fyStart-1+i)%12)+1;
    let yy=baseYear+Math.floor((fyStart-1+i)/12);
    return yy+'-'+String(mm).padStart(2,'0');
  });

  // ── Find the header row (row with "Actual 1" label) ──────────────────────
  let headerIdx=rows.findIndex(r=>r&&r.some(v=>String(v||'').trim()==='Actual 1'));
  if(headerIdx<0)headerIdx=11; // row 12 (0-based 11) is the standard position

  // ── Detect Sage GLActual() formula-only files ────────────────────────────
  // When Sage's add-in hasn't calculated, data cells contain GLActual() formulas
  // and the cached (data_only) value is null. Detect this and warn the user.
  let dataRows=rows.slice(headerIdx+1);
  let sampleDataRows=dataRows.filter(r=>r&&String(r[0]||'').trim()&&String(r[2]||'').match(/^IBR/i));
  let hasAnyNumericData=sampleDataRows.some(r=>r.slice(4,16).some(v=>typeof v==='number'&&v!==0));
  let hasAccounts=sampleDataRows.length>0;

  if(hasAccounts&&!hasAnyNumericData){
    // Formula-only file: register all account names (so they appear in mapping) but with zero values
    const ALWAYS_SKIP2=new Set(['Gross Profit','Total Income','Net Profit Before Tax',
      'Net Profit After Tax','Income Tax']);
    let accounts={};
    dataRows.forEach(r=>{
      let name=String(r[0]||'').trim();
      let ibrCode=String(r[2]||'').trim();
      let sectionMarker=r[3];
      if(!name||ALWAYS_SKIP2.has(name)||/^Total\b/i.test(name))return;
      if(sectionMarker!==null&&sectionMarker!==undefined&&sectionMarker!==''&&!ibrCode)return;
      accounts[name]={};
      periods.forEach(p=>{accounts[name][p]=0;});
      if(!client.mappings[name]){
        client.mappings[name]=guessMap(name,'pl');
        if(client.mappings[name])client.mappingConfirmed[name]=false;
      }
    });
    client.raw[dest]={periods,accounts};
    addImport(dest,filename,'FY'+fyYear+' — COA only (no values)');
    alert(
      '⚠️  This Sage P&L file contains live formulas (GLActual) with no calculated values.\n\n'+
      'The account names have been imported so they appear in Account Mapping, but all values are zero.\n\n'+
      'To get the actual figures:\n'+
      '  1. Open the file in Excel with the Sage Intelligence add-in active\n'+
      '  2. Wait for all cells to calculate (you should see numbers)\n'+
      '  3. Save As → Excel Workbook (.xlsx) — this saves the calculated values\n'+
      '  4. Re-import that saved file here\n\n'+
      'Alternatively, export a fresh report from Sage as a static (non-formula) Excel file.'
    );
    return;
  }

  // ── Normal parse: file has cached numeric values ─────────────────────────
  // Section headers in Sage have a numeric marker in col3 (index 3): '1','2','3'...
  // Real account rows have an IBR code in col2 (index 2) and nothing in col3.
  // We use col3 to distinguish: skip rows where col3 has a value AND no IBR code.
  const ALWAYS_SKIP=new Set(['Gross Profit','Total Income','Net Profit Before Tax',
    'Net Profit After Tax','Income Tax']);
  let accounts={};
  dataRows.forEach(r=>{
    let name=String(r[0]||'').trim();
    let ibrCode=String(r[2]||'').trim();
    let sectionMarker=r[3]; // numeric like '1','2','3','10' for section headers
    if(!name||isProbablyNonAccountName(name))return;
    // Skip rows that are section totals (have a section marker and no IBR code)
    if(sectionMarker!==null&&sectionMarker!==undefined&&sectionMarker!==''&&!ibrCode)return;
    // Skip calculated subtotals
    if(ALWAYS_SKIP.has(name)||/^Total\b/i.test(name))return;
    let vals=r.slice(4,16).map(v=>num(v));
    if(vals.every(v=>v===0))return;
    accounts[name]={};
    periods.forEach((p,i)=>{accounts[name][p]=vals[i]||0;});
    if(!client.mappings[name]){
      client.mappings[name]=guessMap(name,'pl');
      if(client.mappings[name])client.mappingConfirmed[name]=false;
    }
  });

  client.raw[dest]={periods,accounts};
  addImport(dest,filename,'FY'+fyYear+' ('+periods[0]+' to '+periods[11]+')');
}

// Parse Balance Sheet
function parseSageBS(rows,filename,dest){
  dest=dest||'bs';
  ensureClientDefaults();
  // Find the as-of date
  let asOf=client.settings.reportMonth;
  let accounts={};
  rows.forEach(r=>{
    let name=String(r[0]||'').trim();
    if(!name||isProbablyNonAccountName(name))return;
    let val=r[1];
    if(val===null||val===undefined||val==='')return;
    let n=num(val);
    if(n===0&&!String(val||'').trim())return;
    // Skip section headers
    let lower=name.toLowerCase();
    if(['assets','liabilities','equity','current assets','non-current assets','current liabilities','non-current liabilities'].includes(lower))return;
    if(/^total\b/i.test(name))return;
    accounts[name]=n;
    if(!client.mappings[name]){
      client.mappings[name]=guessMap(name,'bs');
      if(client.mappings[name])client.mappingConfirmed[name]=false;
    }
  });
  client.raw[dest]={asOf,accounts};
  addImport(dest,filename,asOf);
}

// Parse Ageing (A/R or A/P)
function parseSageAge(rows,filename,type){
  ensureClientDefaults();
  // Find header row
  let h=rows.findIndex(r=>r&&r.some(c=>/current/i.test(String(c||''))));
  if(h<0){alert('Could not find ageing header row. Expected "Current" column header.');return;}
  let asOf=client.settings.reportMonth;
  let data=[];
  rows.slice(h+1).forEach(r=>{
    let name=String(r[0]||'').trim();
    if(!name||/^total$/i.test(name))return;
    data.push({
      name,
      current:num(r[1])+num(r[2]),
      d31_60:num(r[3]),
      d61_90:num(r[4]),
      d90plus:num(r[5]),
      total:num(r[6])||num(r[1])+num(r[2])+num(r[3])+num(r[4])+num(r[5])
    });
  });
  client.raw[type]={asOf,rows:data};
  addImport(type,filename,asOf);
}

// ── Sage HTML-as-XLS Balance Sheet Parser ────────────────────────────────────
// Format: Title, Company, 'Run At Date: | dd/mm/yyyy', then 'Account | value' rows.
// Section headers ('Assets', 'Current Assets', etc.) and 'Total ...' rows have no numeric value.
function parseSageBSHtml(rows,filename,dest){
  dest=dest||'bs';
  ensureClientDefaults();
  let dateRow=rows.find(r=>String(r[0]||'').match(/run at date/i));
  let asOf=client.settings.reportMonth;
  if(dateRow&&dateRow[1]){
    let m=String(dateRow[1]).trim().match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
    if(m)asOf=m[3]+'-'+String(m[2]).padStart(2,'0');
  }
  const SKIP=new Set(['assets','equity and liabilities','equity','liabilities','owners equity',
    'non-current assets','current assets','non-current liabilities','current liabilities',
    'owners contribution','clearing accounts','balance sheet report',
    'precision moulding & moulds (pty) ltd','']);
  let accounts={};
  rows.forEach(r=>{
    let name=String(r[0]||'').trim();
    let valStr=String(r[1]||'').trim();
    if(!name||SKIP.has(name.toLowerCase()))return;
    if(/^total\b/i.test(name))return;
    if(/^run at date/i.test(name))return;
    // Must have a numeric second column
    let n=parseFloat(valStr.replace(/,/g,''));
    if(isNaN(n))return;
    accounts[name]=n;
    if(!client.mappings[name]){
      client.mappings[name]=guessMap(name,'bs');
      if(client.mappings[name])client.mappingConfirmed[name]=false;
    }
  });
  // Store into history collection (keyed by YYYY-MM)
  let histKey = dest==='bs_py'?'bs_history_py':'bs_history_cy';
  if(!client.raw[histKey])client.raw[histKey]={};
  client.raw[histKey][asOf]={asOf,accounts};
  // Also update the current-month reference (bs or bs_py) — used for the main BS report
  // For bs: always update (most recently imported is always shown as current)
  // For bs_py: update if this is the FY-end month (Feb for March FY) or if none yet
  let hasCurrent=Object.keys(client.raw[dest].accounts||{}).length>0;
  let shouldUpdateCurrent=!hasCurrent||dest==='bs';
  if(dest==='bs_py'){
    // Use as current PY if it's the FY-end (Feb) or no PY BS yet
    let fyStart=client.settings.fyStartMonth||3;
    let fyEndMonth=((fyStart-1+11)%12)+1; // month before FY start
    let asOfMonth=parseInt(asOf.split('-')[1]);
    shouldUpdateCurrent=!hasCurrent||(asOfMonth===fyEndMonth);
  }
  if(shouldUpdateCurrent){
    client.raw[dest]={asOf,accounts};
  }
  addImport(dest,filename,asOf+' → stored in BS history');
}

// ── Sage HTML-as-XLS Ageing Parser ───────────────────────────────────────────
// Columns: Customer/Supplier | 120+ Days | 90 Days | 60 Days | 30 Days | Current | Total Due
function parseSageAgeHtml(rows,filename,type){
  ensureClientDefaults();
  let h=rows.findIndex(r=>{
    let f=String(r[0]||'').toLowerCase().trim();
    return f==='customer'||f==='supplier';
  });
  if(h<0)h=rows.findIndex(r=>r&&r.some(c=>/120\+|120 days/i.test(String(c||''))));
  if(h<0){alert('Could not find ageing header row in '+filename);return;}
  // Extract as-of date from 'Date: | dd/mm/yyyy' rows
  let dateRow=rows.find(r=>String(r[0]||'').toLowerCase().trim()==='date:');
  let asOf=client.settings.reportMonth;
  if(dateRow&&dateRow[1]){
    let m=String(dateRow[1]).trim().match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
    if(m)asOf=m[3]+'-'+String(m[2]).padStart(2,'0');
  }
  let data=[];
  rows.slice(h+1).forEach(r=>{
    let name=String(r[0]||'').trim();
    if(!name||/^total/i.test(name))return;
    // Sage ageing columns: 120+ | 90 | 60 | 30 | Current | Total
    let d120=num(r[1]);
    let d90 =num(r[2]);
    let d60 =num(r[3]);
    let d30 =num(r[4]);
    let cur =num(r[5]);
    let tot =num(r[6]);
    if(!tot&&!d120&&!d90&&!d60&&!d30&&!cur)return;
    data.push({name, current:cur, d30, d60, d90, d120plus:d120,
      total:tot||(cur+d30+d60+d90+d120)});
  });
  client.raw[type]={asOf,rows:data};
  addImport(type,filename,asOf);
}

// ── Budget Excel Importer ─────────────────────────────────────────────────────
// Handles the PMM Budget_Report_June_YYYY.xlsx format.
// Layout: Row 6 = month names, Row 7 = sub-headers (Actual|BM|IM|TR|TD|Budget|Var|%Bud)
// Each month block is 8 columns wide. Budget = month_start + 5.
// Month start columns: Mar=3, Apr=11, May=19, Jun=27, Jul=35, Aug=43, Sep=51,
//                      Oct=59, Nov=67, Dec=75, Jan=83, Feb=91
async function importBudgetXL(){
  let fileInput=document.getElementById('budgetXLFile');
  let passInput=document.getElementById('budgetXLPass');
  let file=fileInput?.files?.[0];
  let pass=passInput?.value||'';
  if(!file){alert('Please select the Budget Excel file.');return;}

  let btn=document.querySelector('[onclick="importBudgetXL()"]');
  if(btn){btn.disabled=true;btn.textContent='Importing…';}

  try{
    let arrayBuf=await file.arrayBuffer();
    let wb;
    // Try to read directly first (if not encrypted)
    try{
      wb=XLSX.read(arrayBuf,{type:'array',cellDates:false,cellNF:false,cellText:false});
    }catch(e){
      if(btn){btn.disabled=false;btn.textContent='Import Budget';}
      alert('Could not read file: '+e.message+'\nIf the file is password-protected, ensure you have entered the password and that msoffcrypto is available.');
      return;
    }

    // Find the FY sheet — look for '2027', '2026' etc or use active sheet
    let sheetName=wb.SheetNames.find(n=>/^\d{4}$/.test(n.trim()))||wb.SheetNames[0];
    let ws=wb.Sheets[sheetName];
    let rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:null,raw:true});

    // Read year from row 4 (index 3)
    let fyYear=parseInt(String(rows[3]?.[1]||'').trim())||2027;
    let fyStart=client.settings.fyStartMonth||7;
    // Build YYYY-MM period keys (same logic as parseSagePL)
    let baseYear=(fyStart===1)?fyYear:(fyYear-1);
    let periodKeys=Array.from({length:12},(_,i)=>{
      let mm=((fyStart-1+i)%12)+1;
      let yy=baseYear+Math.floor((fyStart-1+i)/12);
      return yy+'-'+String(mm).padStart(2,'0');
    });

    // Find month→column mapping from row 6 (index 5)
    // Month name appears at the start column of each 8-col block
    let monthRow=rows[5]||[];
    let MONTH_NAMES={january:0,february:1,march:2,april:3,may:4,june:5,
                     july:6,august:7,september:8,october:9,november:10,december:11};
    // Build: periodIndex → startCol (0-based)
    let colMap={};  // periodIndex → startCol
    monthRow.forEach((v,colIdx)=>{
      if(!v)return;
      let mn=String(v).toLowerCase().trim();
      if(MONTH_NAMES[mn]!==undefined){
        // Which period index is this month?
        let monthNum=MONTH_NAMES[mn]+1; // 1-12
        // Find which FY period this maps to
        periodKeys.forEach((pk,pi)=>{
          if(parseInt(pk.split('-')[1])===monthNum)colMap[pi]=colIdx;
        });
      }
    });

    if(Object.keys(colMap).length===0){
      alert('Could not find month column headers in row 6.\nExpected English month names (July, August, etc.).\nCheck the sheet is "'+sheetName+'".');
      if(btn){btn.disabled=false;btn.textContent='Import Budget';}
      return;
    }

    function flt(v){if(v===null||v===undefined)return 0;if(typeof v==='string')return 0;try{return parseFloat(v)||0;}catch{return 0;}}
    function getBud(row,pi){
      let start=colMap[pi];
      if(start===undefined)return 0;
      return flt(row?.[start+5]); // Budget col = start + 5
    }
    function getName(row){return String(row?.[0]||'').trim();}

    // Scan all rows to find key rows by name
    let rowIndex={};
    rows.forEach((row,i)=>{
      let n=getName(row).toLowerCase().replace(/\s+/g,' ');
      if(n==='total sales'||n==='revenue total')         rowIndex.totalSales=i;
      if(n==='total raw material'||n==='total purchases')rowIndex.purchases=i;
      if(n==='total labour')                             rowIndex.wages=i;
      if(n==='total consumables')                        rowIndex.consumables=i;
      if(n==='total repairs & maintenance'||n==='total repairs and maintenance') rowIndex.r_and_m=i;
      // Expense rows
      if(/^accounting fee/.test(n))                      rowIndex.accounting_fees=i;
      if(/^labour net$/.test(n))                         rowIndex.salaries_wages=i;
      if(/^insurance$/.test(n))                          rowIndex.insurance_main=i;
      if(/^rent paid/.test(n))                           rowIndex.rent=i;
      if(/^solar electricity/.test(n))                   rowIndex.solar=i;
      if(/^electricity$/.test(n)&&!rowIndex.electricity2) rowIndex.electricity2=i;
      if(/^water$/.test(n))                              rowIndex.water=i;
      if(/^sanitation$/.test(n))                         rowIndex.sanitation=i;
      if(/^subscription$/.test(n))                       rowIndex.subscription=i;
      if(/^directors? remuneration/.test(n))             rowIndex.director=i;
      if(/^legal fee/.test(n))                           rowIndex.legal_fees=i;
      if(/^bank charge/.test(n))                         rowIndex.bank_charges=i;
      if(/^business partner.*admin/.test(n))             rowIndex.bank_charges2=i;
      if(/^cleaning$/.test(n))                           rowIndex.cleaning=i;
      if(/^computer expense/.test(n))                    rowIndex.computer=i;
      if(/^courier cost/.test(n))                        rowIndex.courier=i;
      if(/^entertainment$/.test(n))                      rowIndex.entertainment=i;
      if(/^donations/.test(n))                           rowIndex.donations=i;
      if(/^printing.*stationery/.test(n))                rowIndex.printing=i;
      if(/^safety.*protective/.test(n))                  rowIndex.safety=i;
      if(/^regulatory.*coida/.test(n))                   rowIndex.coida=i;
      if(/^security$/.test(n))                           rowIndex.security=i;
      if(/^staff welfare$/.test(n))                      rowIndex.staff_welfare=i;
      if(/^telephone.*internet/.test(n))                 rowIndex.telephone=i;
      if(/^interest paid$/.test(n))                      rowIndex.interest=i;
      if(/^interest on instalment/.test(n)||/^interest.*installment/.test(n)) rowIndex.interest2=i;
      if(/^interest paid.*connected/.test(n))            rowIndex.interest3=i;
      if(/^investec.*trade.*finance fee/.test(n))        rowIndex.interest4=i;
      if(/^depreciation/.test(n)&&!rowIndex.depreciation) rowIndex.depreciation=i;
    });

    // Also scan for individual insurance rows (Liberty, Discovery etc)
    let insuranceRows=[];
    rows.forEach((row,i)=>{
      let n=getName(row).toLowerCase();
      if((/liberty.*debt|discovery.*cover|discovery.*plan|brightrock|echelon|bright rock/.test(n))
         && i>90 && i<160) insuranceRows.push(i);
    });

    // Build budgets
    let newBudgets={};
    function addBud(coaId,rowIdx,negate){
      if(rowIdx===undefined||rowIdx===null)return;
      let row=rows[rowIdx];
      if(!row)return;
      if(!newBudgets[coaId])newBudgets[coaId]={};
      periodKeys.forEach((pk,pi)=>{
        let v=getBud(row,pi)*(negate?-1:1);
        if(v)newBudgets[coaId][pk]=(newBudgets[coaId][pk]||0)+Math.round(v*100)/100;
      });
    }
    addBud('income.sales',        rowIndex.totalSales);
    addBud('cogs.purchases',      rowIndex.purchases);
    addBud('cogs.wages',          rowIndex.wages);
    addBud('cogs.consumables',    rowIndex.consumables);
    addBud('cogs.r_and_m',        rowIndex.r_and_m);
    addBud('expense.accounting_fees',   rowIndex.accounting_fees);
    addBud('expense.salaries_wages',    rowIndex.salaries_wages);
    addBud('expense.insurance',         rowIndex.insurance_main);
    insuranceRows.forEach(ri=>addBud('expense.insurance',ri));
    addBud('expense.rent',              rowIndex.rent);
    addBud('expense.electricity',       rowIndex.solar);
    addBud('expense.electricity',       rowIndex.electricity2);
    addBud('expense.water',             rowIndex.water);
    addBud('expense.water',             rowIndex.sanitation);
    addBud('expense.subscription',      rowIndex.subscription);
    addBud('expense.director_remuneration', rowIndex.director);
    addBud('expense.legal_fees',        rowIndex.legal_fees);
    addBud('expense.bank_charges',      rowIndex.bank_charges);
    addBud('expense.bank_charges',      rowIndex.bank_charges2);
    addBud('expense.cleaning',          rowIndex.cleaning);
    addBud('expense.computer_expenses', rowIndex.computer);
    addBud('expense.courier',           rowIndex.courier);
    addBud('expense.entertainment',     rowIndex.entertainment);
    addBud('expense.entertainment',     rowIndex.donations);
    addBud('expense.printing_stationery', rowIndex.printing);
    addBud('expense.training',          rowIndex.safety);
    addBud('expense.training',          rowIndex.coida);
    addBud('expense.security',          rowIndex.security);
    addBud('expense.staff_welfare',     rowIndex.staff_welfare);
    addBud('expense.telephone_internet',rowIndex.telephone);
    addBud('other_expense.interest_paid', rowIndex.interest);
    addBud('other_expense.interest_paid', rowIndex.interest2);
    addBud('other_expense.interest_paid', rowIndex.interest3);
    addBud('other_expense.interest_paid', rowIndex.interest4);
    addBud('other_expense.depreciation', rowIndex.depreciation);

    // Dept sales budgets from individual dept sales rows (BM, IM, TR, TD, TDA, PMM)
    let DEPT_KEYWORDS={
      bm: ['blow moulding'], im: ['injection moulding'],
      tr: ['toolroom'],      td: ['dispensing tubes','tube department'],
      tda:['extrusion'],     pmm:['raw material','sales - pmm','other sales','sales - time','sales - buy out']
    };
    let deptSalesRows={bm:[],im:[],tr:[],td:[],tda:[],pmm:[]};
    rows.forEach((row,i)=>{
      if(i<8||i>30)return; // sales rows are in first section
      let n=getName(row).toLowerCase();
      if(!n.startsWith('sales'))return;
      Object.entries(DEPT_KEYWORDS).forEach(([dept,kws])=>{
        if(kws.some(kw=>n.includes(kw))) deptSalesRows[dept].push(i);
      });
    });

    let newDeptBudgets={};
    Object.keys(deptSalesRows).forEach(dept=>{
      newDeptBudgets[dept]={sales:{}};
      deptSalesRows[dept].forEach(ri=>{
        let row=rows[ri];
        if(!row)return;
        periodKeys.forEach((pk,pi)=>{
          let v=getBud(row,pi);
          if(v)newDeptBudgets[dept].sales[pk]=(newDeptBudgets[dept].sales[pk]||0)+Math.round(v*100)/100;
        });
      });
    });

    let budLines=Object.keys(newBudgets).length;
    let deptDepts=Object.values(newDeptBudgets).filter(d=>Object.keys(d.sales||{}).length>0).length;

    if(budLines===0){
      alert('No budget data found. Check that the sheet "'+sheetName+'" contains month headers in row 6 and row names matching the expected format.');
      if(btn){btn.disabled=false;btn.textContent='Import Budget';}
      return;
    }

    client.budgets=newBudgets;
    client.deptBudgets=newDeptBudgets;
    addImport('budget_xl',file.name,'FY'+fyYear);
    mark();
    safeRender('imports');
    alert('Budget imported successfully!\n'+budLines+' COA lines | '+deptDepts+' dept sales budgets\nFY'+fyYear+' ('+periodKeys[0]+' to '+periodKeys[11]+')\n\nVisit Budget Builder to review.');
  }catch(err){
    alert('Budget import error: '+err.message);
    console.error(err);
  }finally{
    if(btn){btn.disabled=false;btn.textContent='Import Budget';}
  }
}
function renderMapping(){
  ensureClientDefaults();
  let allAccounts={};
  // Primary source: raw imported data
  Object.keys(client.raw.pl.accounts||{}).forEach(k=>{allAccounts[k]='pl'});
  Object.keys(client.raw.pl_py.accounts||{}).forEach(k=>{if(!allAccounts[k])allAccounts[k]='pl'});
  Object.keys(client.raw.bs.accounts||{}).forEach(k=>{if(!allAccounts[k])allAccounts[k]='bs'});
  Object.keys(client.raw.bs_py.accounts||{}).forEach(k=>{if(!allAccounts[k])allAccounts[k]='bs'});
  // Fallback: any account already in mappings (e.g. loaded from saved JSON)
  // Infer type from what the mapping points to
  Object.keys(client.mappings||{}).forEach(k=>{
    if(allAccounts[k])return; // already found via raw data
    let coaId=client.mappings[k]||'';
    let coaEntry=client.reportingCOA.find(c=>c.id===coaId);
    let type=coaEntry?coaEntry.type:'';
    let isPL=['income','cogs','other_income','expense','other_expense'].includes(type);
    let isBS=['asset_current','asset_noncurrent','liability_current','liability_noncurrent','equity'].includes(type);
    if(isPL)allAccounts[k]='pl';
    else if(isBS)allAccounts[k]='bs';
    else allAccounts[k]='pl'; // default to pl for unknown
  });

  let unmapped=Object.keys(allAccounts).filter(k=>!client.mappings[k]);
  let unconfirmed=Object.keys(allAccounts).filter(k=>client.mappings[k]&&!client.mappingConfirmed[k]);
  let total=Object.keys(allAccounts).length;

  // Build COA options grouped by section - for both PL and BS separately
  function coaOptGroups(kind){
    let plSections=['income','cogs','other_income','expense','other_expense'];
    let bsSections=['asset_current','asset_noncurrent','liability_current','liability_noncurrent','equity'];
    let relevant=kind==='pl'?plSections:bsSections;
    let html='<option value="">— Unmapped (exclude from reports) —</option>';
    relevant.forEach(sec=>{
      let lines=client.reportingCOA.filter(c=>c.type===sec&&!c.hidden);
      if(!lines.length)return;
      html+=`<optgroup label="${COA_SECTIONS[sec]||sec}">`;
      lines.forEach(c=>{html+=`<option value="${c.id}">${c.name}</option>`;});
      html+='</optgroup>';
    });
    return html;
  }

  // Cache option HTML (expensive to regenerate per row)
  let plOpts=coaOptGroups('pl');
  let bsOpts=coaOptGroups('bs');

  let filterVal=window._mappingFilter||'all';
  let searchVal=window._mappingSearch||'';

  let entries=Object.entries(allAccounts);
  // Apply filter
  if(filterVal==='unmapped')entries=entries.filter(([k])=>!client.mappings[k]);
  if(filterVal==='unconfirmed')entries=entries.filter(([k])=>client.mappings[k]&&!client.mappingConfirmed[k]);
  if(filterVal==='pl')entries=entries.filter(([,v])=>v==='pl');
  if(filterVal==='bs')entries=entries.filter(([,v])=>v==='bs');
  // Apply search
  if(searchVal)entries=entries.filter(([k])=>k.toLowerCase().includes(searchVal.toLowerCase()));

  let rows=entries.map(([name,kind])=>{
    let mapped=client.mappings[name]||'';
    let confirmed=client.mappingConfirmed[name];
    let deptInfo=SAGE_DEPT_MAP[name];
    let deptBadge=deptInfo?`<span class="pill" style="background:#eef2ff;color:#3730a3;font-size:10px">${DEPARTMENTS.find(d=>d.id===deptInfo.dept)?.label||deptInfo.dept}</span>`:'<span class="muted" style="font-size:10px">—</span>';
    let opts=(kind==='pl'?plOpts:bsOpts).replace(mapped?`value="${mapped}"`:'__NOMATCH__',mapped?`value="${mapped}" selected`:'');
    let statusBtn=mapped
      ?(confirmed
        ?`<button class="btn sm" style="background:#ecfdf5;color:#047857;white-space:nowrap" onclick="toggleConfirm('${esc(name)}')">✓ OK</button>`
        :`<button class="btn sm" style="background:#fffbeb;color:#b45309;white-space:nowrap" onclick="toggleConfirm('${esc(name)}')">⚠ Confirm</button>`)
      :`<span class="muted" style="font-size:11px">Unmapped</span>`;
    return `<tr>
      <td style="font-size:12px">${esc(name)}</td>
      <td style="font-size:11px;white-space:nowrap"><span class="muted">${kind.toUpperCase()}</span></td>
      <td style="font-size:11px">${deptBadge}</td>
      <td><select style="font-size:12px;padding:4px;width:100%;min-width:200px" onchange="setMapping('${esc(name)}','${kind}',this.value)">${opts}</select></td>
      <td>${statusBtn}</td>
    </tr>`;
  }).join('');

  document.getElementById('mapping').innerHTML=`
  <div class="panel">
    <h2>Account Mapping</h2>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;align-items:center">
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        ${[['all','All ('+total+')'],['unmapped','Unmapped ('+unmapped.length+')'],['unconfirmed','Pending ('+unconfirmed.length+')'],['pl','P&L only'],['bs','BS only']].map(([v,l])=>`<button class="btn sm${filterVal===v?' primary':''}" onclick="window._mappingFilter='${v}';renderMapping()">${l}</button>`).join('')}
      </div>
      <input placeholder="🔍 Search account name…" style="flex:1;min-width:180px;padding:6px 10px;font-size:12px" value="${esc(searchVal)}" oninput="window._mappingSearch=this.value;renderMapping()">
    </div>
    <p class="muted" style="margin-bottom:10px;font-size:12px">💡 Department assignments are automatic from Sage account names. Only the <b>Reporting COA</b> column needs your attention. New accounts from an import that don't match any COA line appear as "Unmapped" — either map them or leave unmapped to exclude from reports. To add a new COA line, go to <b>Reporting COA</b>.</p>
    <div style="overflow:auto;max-height:calc(100vh - 360px);border:1px solid var(--line);border-radius:10px">
    <table id="mappingTable">
      <thead><tr>
        <th style="min-width:220px">Sage Account Name</th>
        <th style="width:50px">Source</th>
        <th style="width:120px">Dept (Auto)</th>
        <th style="min-width:220px">→ Reporting COA Line</th>
        <th style="width:100px">Status</th>
      </tr></thead>
      <tbody>${rows||'<tr><td colspan="5" class="muted" style="padding:16px">Import P&L or Balance Sheet first, or no accounts match current filter.</td></tr>'}</tbody>
    </table>
    </div>
    <div class="btns" style="margin-top:10px">
      <button class="btn" onclick="autoMapAll()">🤖 Auto-map Unmapped</button>
      <button class="btn" onclick="confirmAllMapped()">✓ Confirm All</button>
      <span class="muted" style="font-size:11px;align-self:center">${total-unmapped.length}/${total} mapped · ${total-unmapped.length-unconfirmed.length} confirmed</span>
    </div>
  </div>`;
}
function setMapping(name,kind,coaId){client.mappings[name]=coaId;client.mappingConfirmed[name]=false;}
function toggleConfirm(name){client.mappingConfirmed[name]=!client.mappingConfirmed[name];safeRender('mapping');}
function autoMapAll(){
  ensureClientDefaults();
  let count=0;
  let allAccounts={...Object.fromEntries(Object.keys(client.raw.pl.accounts||{}).map(k=>[k,'pl'])),...Object.fromEntries(Object.keys(client.raw.bs.accounts||{}).map(k=>[k,'bs']))};
  Object.entries(allAccounts).forEach(([name,kind])=>{if(!client.mappings[name]){let g=guessMap(name,kind);if(g){client.mappings[name]=g;client.mappingConfirmed[name]=false;count++;}}});
  safeRender('mapping');
  alert(`Auto-mapped ${count} accounts.`);
}
function confirmAllMapped(){
  Object.keys(client.mappings).forEach(k=>{if(client.mappings[k])client.mappingConfirmed[k]=true;});
  safeRender('mapping');
}

function showAddCOALine(){document.getElementById('addCOAForm').style.display='block';document.getElementById('newCOAName').focus();}

function addCOALine(){
  ensureClientDefaults();
  let name=document.getElementById('newCOAName').value.trim();
  let type=document.getElementById('newCOAType').value;
  let suffix=document.getElementById('newCOAIdSuffix').value.trim()||name.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'');
  if(!name){alert('Please enter a name.');return;}
  let id=type+'.'+suffix;
  // Ensure unique id
  if(client.reportingCOA.find(c=>c.id===id)){
    id=id+'_'+Date.now().toString(36);
  }
  client.reportingCOA.push({id,name,type});
  renderCOA();
}

function renameCOALine(idx,newName){
  if(!newName.trim())return;
  client.reportingCOA[idx].name=newName.trim();
}

function deleteCOALine(idx){
  let c=client.reportingCOA[idx];
  let mapped=Object.entries(client.mappings).filter(([k,v])=>v===c.id);
  if(mapped.length>0){alert('Cannot delete: '+mapped.length+' Sage account(s) mapped to this line. Remap them first.');return;}
  if(!confirm('Delete "'+c.name+'"? This cannot be undone.'))return;
  client.reportingCOA.splice(idx,1);
  renderCOA();
}

function toggleHideCOA(idx){
  client.reportingCOA[idx].hidden=!client.reportingCOA[idx].hidden;
  renderCOA();
}

function moveCOALine(idx,dir){
  let arr=client.reportingCOA;
  let targetIdx=idx+dir;
  if(targetIdx<0||targetIdx>=arr.length)return;
  // Only swap within same section
  if(arr[idx].type!==arr[targetIdx].type)return;
  [arr[idx],arr[targetIdx]]=[arr[targetIdx],arr[idx]];
  renderCOA();
}

function resetCOAToDefault(){
  if(!confirm('Reset COA to the built-in default? This will remove any custom lines you added, but will not change your account mappings.'))return;
  client.reportingCOA=JSON.parse(JSON.stringify(REPORTING_COA));
  renderCOA();
}

// Convert a current-year YYYY-MM key to the prior-year equivalent
function toPYPeriod(periodKey){
  if(!periodKey)return periodKey;
  let[y,m]=periodKey.split('-').map(Number);
  return (y-1)+'-'+String(m).padStart(2,'0');
}

function getCoaValue(coaId,period,rawData){
  rawData=rawData||client.raw.pl;
  let mapped=Object.entries(client.mappings).filter(([k,v])=>v===coaId).map(([k])=>k);
  let total=0;
  // If rawData is the PY dataset, translate the period key to the prior year
  let lookupPeriod=period;
  if(rawData===client.raw.pl_py||rawData===client.raw.bs_py){
    lookupPeriod=toPYPeriod(period);
  }
  mapped.forEach(acctName=>{
    let acctData=rawData.accounts[acctName];
    if(!acctData)return;
    let v=acctData[lookupPeriod];
    total+=num(v);
  });
  return total;
}

function getBudget(coaId,period){
  if(!client.budgets[coaId])return 0;
  return num(client.budgets[coaId][period])||0;
}

function getBudgetYTD(coaId,months){
  return months.reduce((s,m)=>s+getBudget(coaId,m),0);
}

function getActualYTD(coaId,months,rawData){
  return months.reduce((s,m)=>s+getCoaValue(coaId,m,rawData),0);
}

// Get a dept-level value from raw P&L
function getDeptValue(deptId,role,period,rawData){
  rawData=rawData||client.raw.pl;
  let total=0;
  Object.entries(SAGE_DEPT_MAP).forEach(([acctName,info])=>{
    if(info.dept===deptId&&info.role===role){
      let v=rawData.accounts[acctName]?rawData.accounts[acctName][period]:0;
      total+=num(v);
    }
  });
  return total;
}

function getDeptBudget(deptId,role,period){
  let db=client.deptBudgets[deptId];
  if(!db||!db[role])return 0;
  return num(db[role][period])||0;
}

// Compute dept GP for one period
function computeDeptGP(deptId,period,rawData){
  let sales=getDeptValue(deptId,'sales',period,rawData);
  let openingStock=getDeptValue(deptId,'opening_stock',period,rawData);
  let purchases=getDeptValue(deptId,'purchases',period,rawData);
  let closingStock=getDeptValue(deptId,'closing_stock',period,rawData);
  let wages=getDeptValue(deptId,'wages',period,rawData);
  let consumables=getDeptValue(deptId,'consumables',period,rawData);
  let r_and_m=getDeptValue(deptId,'r_and_m',period,rawData);
  let cosDirect=getDeptValue(deptId,'cos_direct',period,rawData);
  // Closing stock is already negative in Sage data — just add it
  let cos=openingStock+purchases+closingStock+wages+consumables+r_and_m+cosDirect;
  return {sales,openingStock,purchases,closingStock,wages,consumables,r_and_m,cosDirect,cos,gp:sales-cos};
}

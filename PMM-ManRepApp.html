function renderBudget(){
  ensureClientDefaults();
  if(!client.budgetPctMode)client.budgetPctMode={};
  let months=fyMonths();
  let coaLines=client.reportingCOA.filter(c=>['income','cogs','other_income','expense','other_expense'].includes(c.type)&&!c.hidden);
  let sections={};
  coaLines.forEach(c=>{if(!sections[c.type])sections[c.type]=[];sections[c.type].push(c);});
  const sectionOrder=['income','cogs','other_income','expense','other_expense'];

  function budSum(type,m){return(sections[type]||[]).reduce((s,c)=>s+num((client.budgets[c.id]||{})[m]),0);}
  function gpBud(m){return budSum('income',m)-budSum('cogs',m);}
  function npBud(m){return budSum('income',m)-budSum('cogs',m)+budSum('other_income',m)-budSum('expense',m)-budSum('other_expense',m);}

  let thead=`<thead><tr>
    <th class="col-account" style="min-width:220px">Account</th>
    ${months.map((m,i)=>`<th style="min-width:110px;text-align:right">${monthLabel(m)}<br><span style="font-size:9px;font-weight:normal;opacity:.6">${m}</span></th>`).join('')}
    <th class="budget-total-cell" style="min-width:100px;padding:6px 8px">Annual</th>
  </tr></thead>`;

  let tbody='<tbody>';
  sectionOrder.forEach(sec=>{
    if(!sections[sec])return;
    tbody+=`<tr class="section-row"><td class="col-account" colspan="${months.length+2}">${COA_SECTIONS[sec]||sec}</td></tr>`;
    sections[sec].forEach(coa=>{
      if(!client.budgets[coa.id])client.budgets[coa.id]={};
      let isPct=!!(client.budgetPctMode[coa.id]);
      let annual=months.reduce((s,m)=>s+num((client.budgets[coa.id]||{})[m]),0);
      let pctBtn=`<button class="pct-mode-btn${isPct?' active':''}" title="${isPct?'% of Income mode — click to switch to amount':'Click to set as % of Income'}" onclick="toggleBudgetPct('${coa.id}')">${isPct?client.budgetPctMode[coa.id]+'%':'%'}</button>`;
      tbody+=`<tr>
        <td class="col-account" style="font-size:12px">
          <span style="display:flex;align-items:center;gap:4px">${esc(coa.name)} ${pctBtn}</span>
        </td>
        ${months.map(m=>{
          let val=num((client.budgets[coa.id]||{})[m]);
          let display=val?String(Math.round(val)):'';
          if(isPct){
            return `<td><span class="budget-input" data-acc="${coa.id}" data-mo="${m}" style="display:inline-block;width:90px;text-align:right;color:var(--muted);font-style:italic;font-size:12px;padding:5px 6px">${display||'0'}</span></td>`;
          }
          return `<td><div class="budget-cell">
            <input class="budget-input" data-acc="${coa.id}" data-mo="${m}" type="number" value="${display}" placeholder="0"
              oninput="setBudget('${coa.id}','${m}',this.value);applyPctRows();updateBudgetTotals();">
            <button class="copy-fwd" title="Copy to remaining months" onclick="copyBudgetForward('${coa.id}','${m}')">→</button>
          </div></td>`;
        }).join('')}
        <td class="budget-total-cell right" data-rowtotal="${coa.id}">${money(annual)}</td>
      </tr>`;
    });
    // Section subtotal
    let secTotals=months.map(m=>budSum(sec,m));
    let secAnnual=secTotals.reduce((a,b)=>a+b,0);
    tbody+=`<tr class="subtotal-row">

  // GP and NP rows
  let gpVals=months.map(m=>gpBud(m));
  let npVals=months.map(m=>npBud(m));
  let incVals=months.map(m=>budSum('income',m));
  tbody+=`<tr class="total-row">

    ${gpVals.map((v,i)=>`<td class="right" style="font-style:italic">${incVals[i]?pct(v/incVals[i]):''}</td>`).join('')}
    <td class="budget-total-cell right" style="font-style:italic">${incVals.reduce((a,b)=>a+b,0)?pct(gpVals.reduce((a,b)=>a+b,0)/incVals.reduce((a,b)=>a+b,0)):''}</td>
  </tr>
  <tr class="total-row">
    <td class="col-account"><b>Net Profit</b></td>
    ${npVals.map((v,i)=>`<td class="right" data-grandtotal="np-${months[i]}"><b>${money(v)}</b></td>`).join('')}
    <td class="budget-total-cell right"><b>${money(npVals.reduce((a,b)=>a+b,0))}</b></td>
  </tr>
  <tr class="muted"><td class="col-account" style="font-style:italic;padding-left:18px">NP %</td>
    ${npVals.map((v,i)=>`<td class="right" style="font-style:italic">${incVals[i]?pct(v/incVals[i]):''}</td>`).join('')}
    <td class="budget-total-cell right" style="font-style:italic">${incVals.reduce((a,b)=>a+b,0)?pct(npVals.reduce((a,b)=>a+b,0)/incVals.reduce((a,b)=>a+b,0)):''}</td>
  </tr>`;
  tbody+='</tbody>';

  document.getElementById('budget').innerHTML=`

    <div class="btns no-print" style="margin-bottom:10px">
      <button class="btn sm" onclick="fillBudgetFromAnnual()" title="Enter one annual total and divide equally across 12 months">📅 Enter Annual → Divide by 12</button>
      <button class="btn sm" onclick="clearBudget()">🗑 Clear All</button>
      <button class="btn sm" onclick="window.print()">🖨 Print</button>

    </p>

      <table class="budget-tbl">${thead}${tbody}</table>
    </div>
  </div>`;
}

function updateBudgetTotals(){
  ensureClientDefaults();
  let months=fyMonths();
  let coaLines=client.reportingCOA.filter(c=>['income','cogs','other_income','expense','other_expense'].includes(c.type)&&!c.hidden);
  let sections={};
  coaLines.forEach(c=>{if(!sections[c.type])sections[c.type]=[];sections[c.type].push(c);});
  function budSum(type,m){return(sections[type]||[]).reduce((s,c)=>s+num((client.budgets[c.id]||{})[m]),0);}
  function gpBud(m){return budSum('income',m)-budSum('cogs',m);}
  function npBud(m){return budSum('income',m)-budSum('cogs',m)+budSum('other_income',m)-budSum('expense',m)-budSum('other_expense',m);}
  function txt(sel,val){let el=document.querySelector(sel);if(el)el.textContent=val;}
  // Row annual totals
  coaLines.forEach(coa=>{
    let total=months.reduce((s,m)=>s+num((client.budgets[coa.id]||{})[m]),0);
    txt(`[data-rowtotal="${coa.id}"]`,money(total));
    // Update % mode display cells (not inputs)
    if(client.budgetPctMode&&client.budgetPctMode[coa.id]){
      months.forEach(m=>{
        let el=document.querySelector(`[data-acc="${coa.id}"][data-mo="${m}"]`);
        if(el&&el.tagName!=='INPUT'){let v=num((client.budgets[coa.id]||{})[m]);el.textContent=v?String(Math.round(v)):'0';}
      });
    }
  });
  // Section subtotals
  const sectionOrder=['income','cogs','other_income','expense','other_expense'];
  sectionOrder.forEach(sec=>{
    months.forEach((m,i)=>{
      txt(`[data-sectotal="${sec}-${m}"]`,money(budSum(sec,m)));
    });
  });
  // GP and NP grand totals
  months.forEach(m=>{
    txt(`[data-grandtotal="gp-${m}"]`,money(gpBud(m)));
    txt(`[data-grandtotal="np-${m}"]`,money(npBud(m)));
  });
}

function copyBudgetForward(coaId,fromMonth){
  ensureClientDefaults();
  let months=fyMonths();
  let start=months.indexOf(fromMonth);
  if(start<0)return;
  let val=num((client.budgets[coaId]||{})[fromMonth]);
  if(!val){alert('Enter an amount in '+monthLabel(fromMonth)+' first, then copy forward.');return;}
  if(!confirm('Copy '+money(val)+' to all months after '+monthLabel(fromMonth)+'?'))return;
  months.slice(start+1).forEach(m=>setBudget(coaId,m,val));
  updateBudgetTotals();
}

function toggleBudgetPct(coaId){
  ensureClientDefaults();
  if(!client.budgetPctMode)client.budgetPctMode={};
  if(client.budgetPctMode[coaId]){
    delete client.budgetPctMode[coaId];
  } else {
    let v=prompt('Set "'+coaId.split('.').pop()+'" as % of Income budget (e.g. 25 for 25%):');
    if(v===null)return;
    let pv=parseFloat(v);
    if(isNaN(pv)||pv<=0){alert('Enter a valid positive number.');return;}
    client.budgetPctMode[coaId]=pv;
    applyPctRows();
  }
  updateBudgetTotals();
}

function applyPctRows(){
  ensureClientDefaults();
  if(!client.budgetPctMode)return;
  let months=fyMonths();
  let coaLines=client.reportingCOA.filter(c=>['income','cogs','other_income','expense','other_expense'].includes(c.type)&&!c.hidden);
  let sections={};
  coaLines.forEach(c=>{if(!sections[c.type])sections[c.type]=[];sections[c.type].push(c);});
  function incBud(m){return(sections['income']||[]).reduce((s,c)=>s+num((client.budgets[c.id]||{})[m]),0);}
  Object.entries(client.budgetPctMode).forEach(([coaId,pctVal])=>{
    if(!pctVal)return;
    months.forEach(m=>{
      let inc=incBud(m);
      setBudget(coaId,m,inc*(pctVal/100));
    });
  });
}

function fillBudgetFromAnnual(){
  let coaSelect=client.reportingCOA.filter(c=>['income','cogs','other_income','expense','other_expense'].includes(c.type)&&!c.hidden);
  let opts=coaSelect.map(c=>`${c.id}|${c.name}`);
  let choice=prompt('Enter: AccountName | Annual Amount\nExample: Income.sales | 36000000\n\nAvailable lines:\n'+coaSelect.map(c=>c.name).join('\n'));
  if(!choice)return;
  let parts=choice.split('|');
  if(parts.length<2){alert('Format: Line Name | Annual Amount');return;}
  let namePart=parts[0].trim().toLowerCase();
  let amtPart=parts[1].trim();
  let coa=coaSelect.find(c=>c.name.toLowerCase().includes(namePart)||c.id.toLowerCase().includes(namePart));
  if(!coa){alert('Could not find COA line matching "'+namePart+'".');return;}
  let annual=parseFloat(amtPart.replace(/[^0-9.-]/g,''));
  if(isNaN(annual)){alert('Invalid amount.');return;}
  let monthly=Math.round(annual/12);
  let months=fyMonths();
  if(!confirm(`Set ${coa.name} to ${money(monthly)}/month (${money(annual)} annual)?`))return;
  months.forEach(m=>setBudget(coa.id,m,monthly));
  updateBudgetTotals();
}
function setBudget(coaId,period,val){
  ensureClientDefaults();
  if(!client.budgets[coaId])client.budgets[coaId]={};
  client.budgets[coaId][period]=num(val);
}

function clearBudget(){
  if(!confirm('Clear all budget figures?'))return;
  client.budgets={};
  safeRender('budget');
}

}

//  DRAG SCROLL
// ═══════════════════════════════════════════════════════
function startDrag(e,el){
  e.preventDefault();
  let startX=e.pageX,startY=e.pageY,sl=el.scrollLeft,st=el.scrollTop;
  function onMove(ev){el.scrollLeft=sl-(ev.pageX-startX);el.scrollTop=st-(ev.pageY-startY);}
  function onUp(){document.removeEventListener('mousemove',onMove);document.removeEventListener('mouseup',onUp);}
  document.addEventListener('mousemove',onMove);
  document.addEventListener('mouseup',onUp);
}

// ── Open / close a column dropdown ──────────────────────────────────────────
function toggleAgeDropdown(event,type,col,rightAlign){
  event.stopPropagation();
  let panel=document.getElementById('age_drop_'+type+'_'+col);
  if(!panel)return;
  let isOpen=panel.style.display==='block';

  // Close any other open panel first
  if(_ageDropOpen){
    _ageDropOpen.el.querySelector('.age-drop-panel').style.display='none';
    _ageDropOpen=null;
  }
  if(isOpen)return;

  // Populate the checklist
  _buildAgeDropList(type,col,panel);
  panel.style.display='block';
  _ageDropOpen={type,col,el:panel.parentElement};
}

// Build checklist items for a column
function _buildAgeDropList(type,col,panel){
  let body=document.getElementById('age_body_'+type);
  if(!body)return;
  let listEl=panel.querySelector('.age-drop-list');
  if(!listEl)return;

  // Collect all unique raw values from data-col-* attributes (from ALL rows, not just visible)
  let allRows=Array.from(body.querySelectorAll('tr'));
  let valSet=new Map(); // rawVal → displayLabel (for numeric cols, format nicely)
  let isNumeric=!['name','terms','note'].includes(col);
  let cur=client.settings.currency||'R';

  allRows.forEach(tr=>{
    let raw=tr.dataset['col'+_camelCol(col)]||'';
    let display=isNumeric?money(parseFloat(raw)||0,cur):raw;
    valSet.set(raw,display);
  });

  // Sort: numeric cols numerically, text cols alphabetically
  let entries=[...valSet.entries()];
  if(isNumeric){
    entries.sort((a,b)=>parseFloat(b[0])-parseFloat(a[0]));
  } else {
    entries.sort((a,b)=>a[0].localeCompare(b[0]));
  }

  // Current active filter for this column (null = all selected)
  let activeFilter=(_ageFilters[type]||{})[col]||null;

  listEl.innerHTML=entries.map(([raw,display])=>{
    let checked=!activeFilter||activeFilter.has(raw);
    // For text cols show empty value meaningfully
    let lbl=raw===''?'<em style="color:#9ca3af">(blank)</em>':esc(display);
    return `<label class="age-drop-item">
      <input type="checkbox" value="${esc(raw)}" ${checked?'checked':''}>
      <span>${lbl}</span>
    </label>`;
  }).join('');

  // Clear the search box
  let search=panel.querySelector('.age-drop-search');
  if(search)search.value='';
}

// Rebuild just the list (after a terms/note value changes in a row)
function rebuildAgeDropList(type,col){
  let panel=document.getElementById('age_drop_'+type+'_'+col);
  if(panel&&panel.style.display==='block') _buildAgeDropList(type,col,panel);
}

// Convert col key to dataset attribute name (data-col-d120plus → colD120plus)
function _camelCol(col){
  // dataset access: data-col-name → colName, data-col-d120plus → colD120plus
  return col.replace(/-([a-z])/g,(_,c)=>c.toUpperCase())
            .replace(/^([a-z])/,(_,c)=>c.toUpperCase());
}

// Search within an open dropdown
function ageDropSearch(input){
  let q=input.value.toLowerCase();
  let list=input.closest('.age-drop-panel').querySelector('.age-drop-list');
  list.querySelectorAll('.age-drop-item').forEach(item=>{
    let txt=item.textContent.toLowerCase();
    item.style.display=txt.includes(q)?'':'none';
  });
}

function ageDropSelAll(btn){
  btn.closest('.age-drop-panel').querySelectorAll('.age-drop-list input[type=checkbox]').forEach(cb=>{if(cb.closest('.age-drop-item').style.display!=='none')cb.checked=true;});
}
function ageDropSelNone(btn){
  btn.closest('.age-drop-panel').querySelectorAll('.age-drop-list input[type=checkbox]').forEach(cb=>{if(cb.closest('.age-drop-item').style.display!=='none')cb.checked=false;});
}

// Apply the checked selections as the active filter for this column
function applyAgeColFilter(event,type,col){
  event.stopPropagation();
  let panel=document.getElementById('age_drop_'+type+'_'+col);
  let checkboxes=panel.querySelectorAll('.age-drop-list input[type=checkbox]');
  let allVals=[...checkboxes].map(cb=>cb.value);
  let checked=[...checkboxes].filter(cb=>cb.checked).map(cb=>cb.value);

  if(!_ageFilters[type])_ageFilters[type]={};

  if(checked.length===allVals.length){
    // All selected → no filter on this column
    delete _ageFilters[type][col];
  } else {
    _ageFilters[type][col]=new Set(checked);
  }

  panel.style.display='none';
  _ageDropOpen=null;
  applyAgeFilter(type);
}

// Apply all active column filters to the table rows
function applyAgeFilter(type){
  let body=document.getElementById('age_body_'+type);
  if(!body)return;
  let filters=_ageFilters[type]||{};
  let hasAny=Object.keys(filters).length>0;
  let cur=client.settings.currency||'R';

  let rows=Array.from(body.querySelectorAll('tr'));
  let visCount=0;
  // Running totals for the filtered footer (Sage 5-bucket)
  let ftCur=0,ftD30=0,ftD60=0,ftD90=0,ftD120=0,ftTot=0;

  rows.forEach(tr=>{
    let show=true;
    Object.entries(filters).forEach(([col,allowed])=>{
      if(!show)return;
      let raw=tr.dataset['col'+_camelCol(col)]||'';
      if(!allowed.has(raw))show=false;
    });
    tr.style.display=show?'':'none';
    if(show){
      visCount++;
      ftCur+=parseFloat(tr.dataset.colCurrent||0)||0;
      ftD30+=parseFloat(tr.dataset.colD30||tr.dataset.colD31_60||0)||0;
      ftD60+=parseFloat(tr.dataset.colD60||tr.dataset.colD61_90||0)||0;
      ftD90+=parseFloat(tr.dataset.colD90||tr.dataset.colD90plus||0)||0;
      ftD120+=parseFloat(tr.dataset.colD120plus||0)||0;
      ftTot+=parseFloat(tr.dataset.colTotal||0)||0;
    }
  });

  // Update footer totals
  let set=(id,v)=>{let el=document.getElementById(id);if(el)el.textContent=money(v,cur);};
  set('age_ft_cur_'+type,ftCur);
  set('age_ft_d30_'+type,ftD30);
  set('age_ft_d60_'+type,ftD60);
  set('age_ft_d90_'+type,ftD90);
  set('age_ft_d120_'+type,ftD120);
  set('age_ft_tot_'+type,ftTot);

  // Count display
  let countEl=document.getElementById('age_count_'+type);
  if(countEl)countEl.textContent=visCount===rows.length?`${rows.length} records`:`${visCount} of ${rows.length} shown`;

  // Active filter indicator buttons (▾ highlighted, tags bar, Clear All)
  Object.keys({name:1,terms:1,current:1,d30:1,d60:1,d90:1,d120plus:1,d31_60:1,d61_90:1,d90plus:1,total:1,note:1}).forEach(col=>{
    let btn=document.getElementById('age_btn_'+type+'_'+col);
    if(!btn)return;
    btn.classList.toggle('active',!!filters[col]);
  });

  // Tags
  let tagsEl=document.getElementById('age_tags_'+type);
  if(tagsEl){
    let COL_LABELS={name:'Name',terms:'Terms',current:'Current',d30:'30 Days',d60:'60 Days',d90:'90 Days',d120plus:'120+ Days',d31_60:'31-60',d61_90:'61-90',d90plus:'90+',total:'Total',note:'Note'};
    tagsEl.innerHTML=Object.keys(filters).map(col=>
      `<span class="age-active-tag" onclick="clearAgeColFilter('${type}','${col}')" title="Remove filter">
        ${COL_LABELS[col]||col} ✕
      </span>`
    ).join('');
  }

  let clearBtn=document.getElementById('age_clearall_'+type);
  if(clearBtn)clearBtn.style.display=hasAny?'':'none';
}

function clearAgeColFilter(type,col){
  if(_ageFilters[type])delete _ageFilters[type][col];
  applyAgeFilter(type);
}

function clearAllAgeFilters(type){
  _ageFilters[type]={};
  applyAgeFilter(type);
}

function setAgeingNote(type,name,val){
  let key=type+'_notes';
  if(!client[key])client[key]={};
  client[key][name]=val;
}
function setAgeingTerms(type,name,val){
  let key=type+'_terms';
  if(!client[key])client[key]={};
  client[key][name]=val;
}

// ═══════════════════════════════════════════════════════
//  MANAGEMENT REPORT (Overall)
// ═══════════════════════════════════════════════════════
function renderReport(){
  ensureClientDefaults();
  let rm=client.settings.reportMonth;
  let ytd=ytdMonths();
  let cur=client.settings.currency||'R';
  let s=client.settings;
  let pl=client.raw.pl;
  let pl_py=client.raw.pl_py;
  let kb=client.kpiBenchmarks;

  // Get current month P&L values
  function getAct(id){return getCoaValue(id,rm);}
  function getActYTD(id){return getActualYTD(id,ytd);}
  function getBud(id){return getBudget(id,rm);}
  function getBudYTD(id){return getBudgetYTD(id,ytd);}
  function getPY(id){return getCoaValue(id,rm,pl_py);}
  function getPYYTD(id){return getActualYTD(id,ytd,pl_py);}

  // Key P&L lines
  let incCm=getAct('income.sales')+getAct('income.other');
  let incYtd=getActYTD('income.sales')+getActYTD('income.other');
  let incBudCm=getBud('income.sales')+getBud('income.other');
  let incBudYtd=getBudYTD('income.sales')+getBudYTD('income.other');
  let incPyCm=getPY('income.sales')+getPY('income.other');
  let incPyYtd=getPYYTD('income.sales')+getPYYTD('income.other');

  // NOTE: Closing stock is stored as a NEGATIVE value in Sage (it reduces COS).
  // We simply ADD it — do NOT subtract — the negative sign handles the direction.
  let cosCm=getAct('cogs.opening_stock')+getAct('cogs.purchases')+getAct('cogs.closing_stock')+getAct('cogs.wages')+getAct('cogs.consumables')+getAct('cogs.r_and_m')+getAct('cogs.cos_direct');
  let cosYtd=getActYTD('cogs.opening_stock')+getActYTD('cogs.purchases')+getActYTD('cogs.closing_stock')+getActYTD('cogs.wages')+getActYTD('cogs.consumables')+getActYTD('cogs.r_and_m')+getActYTD('cogs.cos_direct');

  let gpCm=incCm-cosCm;
  let gpYtd=incYtd-cosYtd;
  let gpPctCm=incCm?gpCm/incCm:0;
  let gpPctYtd=incYtd?gpYtd/incYtd:0;

  let gpBudCm=incBudCm-(['opening_stock','purchases','closing_stock','wages','consumables','r_and_m','cos_direct'].reduce((s,r)=>s+getBud('cogs.'+r),0));
  let gpBudYtd=incBudYtd-(['opening_stock','purchases','closing_stock','wages','consumables','r_and_m','cos_direct'].reduce((s,r)=>s+getBudYTD('cogs.'+r),0));
  // NP budget = GP budget + other income budget - opex budget - other expense budget
  let expBudCm=['accounting_fees','advertising','bank_charges','cleaning','computer_expenses','courier','director_remuneration','electricity','entertainment','fuel','insurance','legal_fees','motor_vehicle','printing_stationery','rent','salaries_wages','security','staff_welfare','subscription','telephone_internet','training','travel','water'].reduce((s,id)=>s+getBud('expense.'+id),0);
  let expBudYtd=['accounting_fees','advertising','bank_charges','cleaning','computer_expenses','courier','director_remuneration','electricity','entertainment','fuel','insurance','legal_fees','motor_vehicle','printing_stationery','rent','salaries_wages','security','staff_welfare','subscription','telephone_internet','training','travel','water'].reduce((s,id)=>s+getBudYTD('expense.'+id),0);
  let oiBudCm=['interest_received','discounts_received','etd_deduction','recoveries'].reduce((s,id)=>s+getBud('other_income.'+id),0);
  let oiBudYtd=['interest_received','discounts_received','etd_deduction','recoveries'].reduce((s,id)=>s+getBudYTD('other_income.'+id),0);
  let oeBudCm=['interest_paid','depreciation','bad_debts','forex','fines','income_tax'].reduce((s,id)=>s+getBud('other_expense.'+id),0);
  let oeBudYtd=['interest_paid','depreciation','bad_debts','forex','fines','income_tax'].reduce((s,id)=>s+getBudYTD('other_expense.'+id),0);
  let npBudCm=gpBudCm+oiBudCm-expBudCm-oeBudCm;
  let npBudYtd=gpBudYtd+oiBudYtd-expBudYtd-oeBudYtd;
  let gpVarCm=gpBudCm?((gpCm-gpBudCm)/Math.abs(gpBudCm)):0;
  let gpVarYtd=gpBudYtd?((gpYtd-gpBudYtd)/Math.abs(gpBudYtd)):0;

  let expIds=['accounting_fees','advertising','bank_charges','cleaning','computer_expenses','courier','director_remuneration','electricity','entertainment','fuel','insurance','legal_fees','motor_vehicle','printing_stationery','rent','salaries_wages','security','staff_welfare','subscription','telephone_internet','training','travel','water'];
  let expCm=expIds.reduce((s,id)=>s+getAct('expense.'+id),0);
  let expYtd=expIds.reduce((s,id)=>s+getActYTD('expense.'+id),0);

  let oeIds=['interest_paid','depreciation','bad_debts','forex','fines','income_tax'];
  let oiIds=['interest_received','discounts_received','etd_deduction','recoveries'];
  let oiCm=oiIds.reduce((s,id)=>s+getAct('other_income.'+id),0);
  let oiYtd=oiIds.reduce((s,id)=>s+getActYTD('other_income.'+id),0);
  let oeCm=oeIds.reduce((s,id)=>s+getAct('other_expense.'+id),0);
  let oeYtd=oeIds.reduce((s,id)=>s+getActYTD('other_expense.'+id),0);
  // PPE depreciation accounts (mapped to ppe_dep.*) must also hit NP
  let ppeDepCm=Object.entries(client.mappings).filter(([,v])=>v&&v.startsWith('ppe_dep.')).reduce((s,[k])=>s+getCoaValue(v='ignore',v=k,v=client.raw.pl)||0,0);
  // Simpler: sum all ppe_dep.* via getCoaValue for each unique ppe_dep id
  let ppeDepIdsCm=[...new Set(Object.values(client.mappings).filter(v=>v&&v.startsWith('ppe_dep.')))].reduce((s,id)=>s+getCoaValue(id,rm),0);
  let ppeDepIdsYtd=[...new Set(Object.values(client.mappings).filter(v=>v&&v.startsWith('ppe_dep.')))].reduce((s,id)=>s+getActualYTD(id,ytd),0);
  oeCm+=ppeDepIdsCm;
  oeYtd+=ppeDepIdsYtd;

  let npCm=gpCm+oiCm-expCm-oeCm;
  let npYtd=gpYtd+oiYtd-expYtd-oeYtd;
  let npPctCm=incCm?npCm/incCm:0;
  let npPctYtd=incYtd?npYtd/incYtd:0;
  let incVarCm=incBudCm?((incCm-incBudCm)/Math.abs(incBudCm)):0;
  let incVarYtd=incBudYtd?((incYtd-incBudYtd)/Math.abs(incBudYtd)):0;
  let incVsPyCm=incPyCm?((incCm-incPyCm)/Math.abs(incPyCm)):0;
  let incVsPyYtd=incPyYtd?((incYtd-incPyYtd)/Math.abs(incPyYtd)):0;

  // KPI traffic lights
  function trafficKPI(actual,target,favHigh){let ok=favHigh?(actual>=target):(actual<=target);let close=favHigh?(actual>=target*0.9):(actual<=target*1.1);return ok?'dot-ok':close?'dot-warn':'dot-bad';}

  // Build P&L statement rows
  // favPositive: true=income/profit (higher=good), false=cost/expense (lower=good)
  function stmtRow(label,cCm,bCm,pyCm,cYtd,bYtd,pyYtd,cls,indent,favPositive,coaId){
    favPositive=(favPositive===undefined)?true:favPositive;
    // Variance is n/m (not meaningful) when base is negative, near-zero, or sign changes
    function safeVar(actual,base){
      if(!base)return null;
      if(Math.abs(base)<50)return null;               // near-zero base → meaningless %
      if(base<0&&actual>0)return null;                 // sign change loss→profit
      if(base>0&&actual<0)return null;                 // sign change profit→loss
      return(actual-base)/Math.abs(base);
    }
    let varCm=safeVar(cCm,bCm);
    let varYtd=safeVar(cYtd,bYtd);
    let varPyCm=safeVar(cCm,pyCm);
    let noteNum=coaId&&client.reportNoteRefs&&client.reportNoteRefs[coaId]?client.reportNoteRefs[coaId]:null;
    let noteCell=noteNum?`<td style="width:28px;text-align:center;padding:3px"><a href="#note${noteNum}" onclick="jumpToNote(${noteNum});return false;" style="font-size:10px;font-weight:bold;color:var(--brand);border:1px solid var(--brand);border-radius:3px;padding:1px 4px" title="Note ${noteNum}">${noteNum}</a></td>`:'<td style="width:28px"></td>';
    return `<tr class="${cls||''}">
      <td class="${indent?'indent':''}">${label}</td>${noteCell}
      <td class="right">${money(cCm,cur)}</td>
      <td class="right">${bCm?money(bCm,cur):'—'}</td>
      <td class="right">${varCm!==null?varBadge(varCm,favPositive):'—'}</td>
      <td class="right">${pyCm?money(pyCm,cur):'—'}</td>
      <td class="right">${pyCm?varBadge(varPyCm,favPositive):'—'}</td>
      <td class="right">${money(cYtd,cur)}</td>
      <td class="right">${bYtd?money(bYtd,cur):'—'}</td>
      <td class="right">${varYtd!==null?varBadge(varYtd,favPositive):'—'}</td>
    </tr>`;
  }
  // pctRow: label | cmActual% | cmBudget% | varPP | pyActual% | pyVarPP | ytdActual% | ytdBudget% | ytdVarPP
  // Variance shown as percentage-point difference (pp), not a % of %
  function pctRow(label,val,val2,val3,pyVal,ytdBudVal){
    let st='font-style:italic;color:var(--muted)';
    let pp=val2?(val-val2):null;          // cm pp vs budget
    let pyPp=pyVal!=null?(val-pyVal):null; // cm pp vs PY
    let ytdPp=ytdBudVal!=null?(val3-ytdBudVal):null; // ytd pp vs ytd budget
    function ppBadge(v,fav){
      if(v===null||v===undefined||isNaN(v))return '<span style="color:var(--muted)">—</span>';
      let good=fav===false?(v<=0):(v>=0);
      let col=good?'var(--ok)':'var(--bad)';
      return '<span style="color:'+col+';font-size:11px;font-weight:bold">'+(v>=0?'+':'')+v.toFixed(1)+'pp</span>';
    }
    return '<tr style="background:#fafafa"><td class="indent" style="'+st+'">'+label+'</td><td></td>'
      +'<td class="right" style="'+st+'">'+(val||val===0?pct(val,1):'—')+'</td>'
      +'<td class="right" style="'+st+'">'+(val2||val2===0?pct(val2,1):'—')+'</td>'
      +'<td class="right">'+ppBadge(pp,true)+'</td>'
      +'<td class="right" style="'+st+'">'+(pyVal!=null?pct(pyVal,1):'—')+'</td>'
      +'<td class="right">'+ppBadge(pyPp,true)+'</td>'
      +'<td class="right" style="'+st+'">'+(val3||val3===0?pct(val3,1):'—')+'</td>'
      +'<td class="right" style="'+st+'">'+(ytdBudVal!=null?pct(ytdBudVal,1):'—')+'</td>'
      +'<td class="right">'+ppBadge(ytdPp,true)+'</td>'
      +'</tr>';
  }

  let plRows='';
  plRows+=`<tr class="section-row"><td colspan="10">Income</td></tr>`;
  plRows+=stmtRow('Sales & Revenue',incCm,incBudCm||null,incPyCm||null,incYtd,incBudYtd||null,incPyYtd||null,'','',true);

  plRows+=`<tr class="section-row"><td colspan="10">Cost of Sales</td></tr>`;
  let cosLineIds=['opening_stock','purchases','wages','consumables','r_and_m','cos_direct','closing_stock'];
  cosLineIds.forEach(id=>{
    let act=getAct('cogs.'+id),bud=getBud('cogs.'+id),py=getPY('cogs.'+id);
    let actY=getActYTD('cogs.'+id),budY=getBudYTD('cogs.'+id);
    let py2=getPYYTD('cogs.'+id);
    let label=client.reportingCOA.find(c=>c.id==='cogs.'+id)?.name||id;
    if(act!==0||bud!==0||py!==0)plRows+=stmtRow(label,act,bud,py,actY,budY,py2,'',true,false);
  });
  // Total COS line
  let cosPyCm=cosLineIds.reduce((s,id)=>s+getPY('cogs.'+id),0);
  let cosPyYtd=cosLineIds.reduce((s,id)=>s+getPYYTD('cogs.'+id),0);
  plRows+=stmtRow('Total Cost of Sales',cosCm,gpBudCm?incBudCm-gpBudCm:null,cosPyCm,cosYtd,gpBudYtd?incBudYtd-gpBudYtd:null,cosPyYtd,'subtotal-row',false,false);
  // Gross Profit
  let gpPyCm=incPyCm-cosPyCm;
  let gpPyYtd=getPYYTD('income.sales')+getPYYTD('income.other')-cosPyYtd;
  plRows+=stmtRow('Gross Profit',gpCm,gpBudCm||null,gpPyCm||null,gpYtd,gpBudYtd||null,gpPyYtd||null,'total-row');
  // PY net profit (gpPyCm now available)
  let oiPyCm=['interest_received','discounts_received','etd_deduction','recoveries'].reduce((s,id)=>s+getPY('other_income.'+id),0);
  let expPyCm=expIds.reduce((s,id)=>s+getPY('expense.'+id),0);
  let oePyCm=['interest_paid','depreciation','bad_debts','forex','fines','income_tax'].reduce((s,id)=>s+getPY('other_expense.'+id),0);
  let npPyCm=gpPyCm+oiPyCm-expPyCm-oePyCm;
  let gpPyPctCm=incPyCm?gpPyCm/incPyCm:null;
  let gpBudPctYtd=incBudYtd?gpBudYtd/incBudYtd:null;
  plRows+=pctRow('GP %',gpPctCm,gpBudCm?gpBudCm/incBudCm:null,gpPctYtd,gpPyPctCm,gpBudPctYtd);

  plRows+=`<tr class="section-row"><td colspan="10">Operating Expenses</td></tr>`;
  expIds.forEach(id=>{
    let act=getAct('expense.'+id),bud=getBud('expense.'+id),py=getPY('expense.'+id);
    let actY=getActYTD('expense.'+id),budY=getBudYTD('expense.'+id),pyY=getPYYTD('expense.'+id);
    if(act!==0||bud!==0||py!==0){
      let label=client.reportingCOA.find(c=>c.id==='expense.'+id)?.name||id;
      plRows+=stmtRow(label,act,bud,py,actY,budY,pyY,'',true,false);
    }
  });

  plRows+=`<tr class="section-row"><td colspan="10">Other Income</td></tr>`;
  oiIds.forEach(id=>{
    let act=getAct('other_income.'+id),py=getPY('other_income.'+id);
    let actY=getActYTD('other_income.'+id),pyY=getPYYTD('other_income.'+id);
    if(act!==0||py!==0){let label=client.reportingCOA.find(c=>c.id==='other_income.'+id)?.name||id;plRows+=stmtRow(label,act,0,py,actY,0,pyY,'',true,true);}
  });

  plRows+=`<tr class="section-row"><td colspan="10">Other Expenses</td></tr>`;
  oeIds.forEach(id=>{
    let act=getAct('other_expense.'+id),py=getPY('other_expense.'+id);
    let actY=getActYTD('other_expense.'+id),pyY=getPYYTD('other_expense.'+id);
    if(act!==0||py!==0){let label=client.reportingCOA.find(c=>c.id==='other_expense.'+id)?.name||id;plRows+=stmtRow(label,act,0,py,actY,0,pyY,'',true,false);}
  });

  plRows+=stmtRow('Net Profit Before Tax',npCm,npBudCm||null,npPyCm||null,npYtd,npBudYtd||null,null,'grand-row');
  let npPyPctCm=incPyCm?npPyCm/incPyCm:null;
  let npBudPctCm=incBudCm?npBudCm/incBudCm:null;
  let npBudPctYtd=incBudYtd?npBudYtd/incBudYtd:null;
  plRows+=pctRow('NP %',npPctCm,npBudPctCm,npPctYtd,npPyPctCm,npBudPctYtd);

  let html=`
  <div class="report-wrap">
    <div class="panel printable">
      ${ytd.length===1?`<div class="warning no-print" style="margin-bottom:12px">⚠ <b>Report month is ${monthLabel(rm)} — YTD covers 1 month only.</b> If you are reporting on a later month, update the Report Month in <a href="#" onclick="show('settings');return false">Settings</a> and click Apply Settings.</div>`:''}
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;border-bottom:3px solid var(--brand);padding-bottom:12px">
        <div>
          <div style="font-size:24px;font-weight:bold">${esc(s.clientName||'PMM')}</div>
          <div class="muted" style="margin-top:4px">Management Report — ${monthLabel(rm)} &nbsp;|&nbsp; YTD ${ytd.length>1?'Jul '+rm.slice(0,4)+' to ':''} ${monthLabel(rm)} (${ytd.length} month${ytd.length!==1?'s':''})</div>
        </div>
        <div style="text-align:right">
          <span class="pill ${(s.status||'').toLowerCase()}">${s.status||'Draft'}</span>
          <div class="muted" style="font-size:11px;margin-top:4px">Prepared by: ${esc(s.preparedBy||'—')}</div>
        </div>
      </div>

      <!-- KPI Summary -->
      <h3>Key Performance Indicators — ${monthLabel(rm)}</h3>
      <div class="kpi-grid" style="margin-bottom:20px">
        <div class="kpi-card"><div class="kl">Revenue (Month)</div><div class="kv">${money(incCm,cur)}</div><div style="font-size:11px;margin-top:4px">${varBadge(incVarCm,true)} vs Budget &nbsp; ${varBadge(incVsPyCm,true)} vs PY</div></div>
        <div class="kpi-card"><div class="kl">Gross Profit (Month)</div><div class="kv">${money(gpCm,cur)}</div><div style="font-size:11px;margin-top:4px">${pct(gpPctCm)} GP% <span class="dot ${trafficKPI(gpPctCm,kb.gp_pct,true)}"></span> ${varBadge(gpVarCm,true)} vs Budget</div></div>
        <div class="kpi-card"><div class="kl">Net Profit (Month)</div><div class="kv">${money(npCm,cur)}</div><div style="font-size:11px;margin-top:4px">${pct(npPctCm)} NP% <span class="dot ${trafficKPI(npPctCm,kb.np_pct,true)}"></span></div></div>
        <div class="kpi-card"><div class="kl">Revenue YTD</div><div class="kv">${money(incYtd,cur)}</div><div style="font-size:11px;margin-top:4px">${varBadge(incVarYtd,true)} vs Budget YTD</div></div>
      </div>

      ${client.narrative?`<div style="background:#f9fafb;border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:16px"><b>Monthly Commentary</b><br><div style="margin-top:6px;white-space:pre-wrap">${esc(client.narrative)}</div></div>`:''}

      <!-- P&L Statement -->
      <h3>Profit & Loss Statement</h3>
      <div class="report-scroll">
      <table class="stmt">
        <thead>
          <tr>
            <th style="min-width:200px">Account</th>
            <th style="width:28px;text-align:center;font-size:10px">Note</th>
            <th class="right" style="min-width:100px">${monthLabel(rm)} Actual</th>
            <th class="right" style="min-width:100px">${monthLabel(rm)} Budget</th>
            <th class="right">Var %</th>
            <th class="right" style="min-width:100px">PY ${monthLabel(rm)}</th>
            <th class="right">PY Var %</th>
            <th class="right" style="min-width:100px">YTD Actual</th>
            <th class="right" style="min-width:100px">YTD Budget</th>
            <th class="right">YTD Var %</th>
          </tr>
        </thead>
        <tbody>${plRows}</tbody>
      </table>
      </div>
    </div>
  </div>`;

  document.getElementById('report').innerHTML=html;
}

function renderDeptReport(){
  ensureClientDefaults();
  let rm=client.settings.reportMonth;
  let ytd=ytdMonths();
  let cur=client.settings.currency||'R';
  let selectedView=window._deptReportView||'cards';
  let selectedMonth=window._deptReportMonth||rm;

  let viewBtns=['cards','consolidated','trend'].map(v=>`<button class="btn${selectedView===v?' primary':''} sm" onclick="window._deptReportView='${v}';safeRender('dept_report')">${v==='cards'?'Dept Cards':v==='consolidated'?'Consolidated Table':'GP Trend'}</button>`).join('');
  let monthSelect=`<select onchange="window._deptReportMonth=this.value;safeRender('dept_report')" style="font-size:12px;padding:5px">
    ${fyMonths().map(m=>`<option value="${m}"${m===selectedMonth?' selected':''}>${monthLabel(m)}</option>`).join('')}
  </select>`;

  let html=`<div class="panel"><h2>Department P&L Report</h2>
  <div class="btns no-print" style="margin-bottom:14px">
    ${viewBtns}
    <span style="font-size:12px;color:var(--muted);margin:auto 0">Month: </span>${monthSelect}
    <button class="btn sm no-print" onclick="window.print()">🖨 Print / PDF</button>
  </div>`;

  if(selectedView==='cards'){html+=renderDeptCards(selectedMonth,ytd,cur);}
  else if(selectedView==='consolidated'){html+=renderDeptConsolidated(selectedMonth,ytd,cur);}
  else{html+=renderDeptTrend(cur);}

  html+='</div>';
  document.getElementById('dept_report').innerHTML=html;
}

function deptGPTable(deptId,period,ytdMonths,cur){
  let gp=computeDeptGP(deptId,period);
  let gpYtd=ytdMonths.reduce((acc,m)=>{let g=computeDeptGP(deptId,m);acc.sales+=g.sales;acc.cos+=g.cos;acc.gp+=g.gp;return acc;},{sales:0,cos:0,gp:0});
  let bud={
    sales:getDeptBudget(deptId,'sales',period),
    wages:getDeptBudget(deptId,'wages',period),
    purchases:getDeptBudget(deptId,'purchases',period),
    consumables:getDeptBudget(deptId,'consumables',period),
    r_and_m:getDeptBudget(deptId,'r_and_m',period),
  };
  let budCos=bud.wages+bud.purchases+bud.consumables+bud.r_and_m;
  let budGP=bud.sales-budCos;
  let gpVarPct=budGP?((gp.gp-budGP)/Math.abs(budGP)):null;
  let gpPct=gp.sales?gp.gp/gp.sales:0;
  let gpPctYtd=gpYtd.sales?gpYtd.gp/gpYtd.sales:0;
  let budGpPct=bud.sales?budGP/bud.sales:0;

  let rows=[
    ['Sales',gp.sales,bud.sales,gpYtd.sales],
    ['Opening Stock',gp.openingStock,0,0],
    ['Purchases / COS',gp.purchases,bud.purchases,0],
    ['Closing Stock',-gp.closingStock,0,0],
    ['Wages & Labour',gp.wages,bud.wages,0],
    ['Consumables',gp.consumables,bud.consumables,0],
    ['Repairs & Maint.',gp.r_and_m,bud.r_and_m,0],
    ['Other COS',gp.cosDirect,0,0],
  ];

  let tableHtml=`<table><thead><tr><th>Line</th><th class="right">Actual</th><th class="right">Budget</th><th class="right">Var</th><th class="right">YTD</th></tr></thead><tbody>`;
  rows.forEach(([lbl,act,bud2,ytd2])=>{
    let var2=bud2?(act-bud2)/Math.abs(bud2):null;
    tableHtml+=`<tr><td>${lbl}</td><td class="right">${money(act,cur)}</td><td class="right">${bud2?money(bud2,cur):'—'}</td><td class="right">${var2!==null?varBadge(var2,lbl==='Sales'?true:false):'—'}</td><td class="right">${ytd2?money(ytd2,cur):'—'}</td></tr>`;
  });
  let varBadgeHtml=gpVarPct!==null?varBadge(gpVarPct,true):'—';
  tableHtml+=`<tr class="total-row"><td><b>Gross Profit</b></td><td class="right"><b>${money(gp.gp,cur)}</b></td><td class="right"><b>${budGP?money(budGP,cur):'—'}</b></td><td class="right">${varBadgeHtml}</td><td class="right"><b>${money(gpYtd.gp,cur)}</b></td></tr>`;
  tableHtml+=`<tr class="muted"><td style="font-style:italic">GP %</td><td class="right" style="font-style:italic">${pct(gpPct)}</td><td class="right" style="font-style:italic">${pct(budGpPct)}</td><td></td><td class="right" style="font-style:italic">${pct(gpPctYtd)}</td></tr>`;
  tableHtml+='</tbody></table>';
  return {tableHtml,gp,gpYtd,bud,budGP,gpVarPct,gpPct,gpPctYtd};
}

function renderDeptCards(period,ytd,cur){
  let html='<div class="dept-cards">';
  DEPARTMENTS.forEach(dept=>{
    let {tableHtml,gp,gpPct}=deptGPTable(dept.id,period,ytd,cur);
    html+=`<div class="dept-card">
      <div class="dept-card-hdr ${dept.hdrClass}">${dept.label}
        <span style="float:right;font-size:13px;font-weight:normal">GP: ${money(gp.gp,cur)} (${pct(gpPct)})</span>
      </div>
      <div class="dept-card-body">${tableHtml}</div>
    </div>`;
  });
  html+='</div>';

  // Totals row
  let totalSalesCm=DEPARTMENTS.reduce((s,d)=>s+computeDeptGP(d.id,period).sales,0);
  let totalGPCm=DEPARTMENTS.reduce((s,d)=>s+computeDeptGP(d.id,period).gp,0);
  let totalGPPct=totalSalesCm?totalGPCm/totalSalesCm:0;
  html+=`<div style="background:var(--brand);color:#fff;border-radius:10px;padding:14px;display:flex;gap:24px;flex-wrap:wrap">
    <div><div style="font-size:11px;opacity:.8">Total Revenue — ${monthLabel(period)}</div><div style="font-size:20px;font-weight:bold">${money(totalSalesCm,cur)}</div></div>
    <div><div style="font-size:11px;opacity:.8">Total Gross Profit</div><div style="font-size:20px;font-weight:bold">${money(totalGPCm,cur)} (${pct(totalGPPct)})</div></div>
  </div>`;
  return html;
}

function renderDeptConsolidated(period,ytd,cur){
  let html=`<div style="overflow:auto"><table class="stmt">
    <thead>
      <tr>
        <th>Line Item</th>
        ${DEPARTMENTS.map(d=>`<th class="right" style="background:${d.color};color:#fff;min-width:110px">${d.label}</th>`).join('')}
        <th class="right" style="background:#374151;color:#fff;min-width:110px">TOTAL</th>
      </tr>
    </thead><tbody>`;

  const ROLES=[
    ['sales','Sales'],['opening_stock','Opening Stock'],['purchases','Purchases / COS'],
    ['closing_stock','Closing Stock'],['wages','Wages'],['consumables','Consumables'],
    ['r_and_m','Repairs & Maint.'],['cos_direct','Other COS']
  ];

  ROLES.forEach(([roleId,roleLabel])=>{
    let vals=DEPARTMENTS.map(d=>getDeptValue(d.id,roleId,period));
    let total=vals.reduce((a,b)=>a+b,0);
    if(total===0&&vals.every(v=>v===0))return;
    html+=`<tr><td class="indent">${roleLabel}</td>${vals.map(v=>`<td class="right">${money(v,cur)}</td>`).join('')}<td class="right bold">${money(total,cur)}</td></tr>`;
  });

  let gpVals=DEPARTMENTS.map(d=>computeDeptGP(d.id,period).gp);
  let salesVals=DEPARTMENTS.map(d=>computeDeptGP(d.id,period).sales);
  let totalGP=gpVals.reduce((a,b)=>a+b,0);
  let totalSales=salesVals.reduce((a,b)=>a+b,0);
  html+=`<tr class="total-row"><td><b>Gross Profit</b></td>${gpVals.map(v=>`<td class="right"><b>${money(v,cur)}</b></td>`).join('')}<td class="right bold">${money(totalGP,cur)}</td></tr>`;
  html+=`<tr class="muted"><td style="font-style:italic">GP %</td>${gpVals.map((v,i)=>`<td class="right" style="font-style:italic">${pct(salesVals[i]?v/salesVals[i]:0)}</td>`).join('')}<td class="right" style="font-style:italic">${pct(totalSales?totalGP/totalSales:0)}</td></tr>`;

  html+='</tbody></table></div>';
  return html;
}

function renderDeptTrend(cur){
  let months=fyMonths();
  let html=`<div style="overflow:auto"><table class="stmt">
    <thead><tr><th>Month</th>${DEPARTMENTS.map(d=>`<th class="right" style="min-width:80px">${d.label} GP</th><th class="right">GP%</th>`).join('')}<th class="right">Total GP</th><th class="right">Total GP%</th></tr></thead>
    <tbody>`;
  months.forEach(m=>{
    let vals=DEPARTMENTS.map(d=>computeDeptGP(d.id,m));
    let totalGP=vals.reduce((s,v)=>s+v.gp,0);
    let totalSales=vals.reduce((s,v)=>s+v.sales,0);
    html+=`<tr><td>${monthLabel(m)}</td>`;
    vals.forEach(v=>{html+=`<td class="right">${money(v.gp,cur)}</td><td class="right" style="color:${v.sales&&v.gp/v.sales>0.35?'var(--ok)':'var(--muted)'}">${pct(v.sales?v.gp/v.sales:0)}</td>`;});
    html+=`<td class="right bold">${money(totalGP,cur)}</td><td class="right bold">${pct(totalSales?totalGP/totalSales:0)}</td></tr>`;
  });
  html+='</tbody></table></div>';
  return html;
}

// Returns PPE classes defined in the client's reporting COA
// NOTE: does NOT call ensureClientDefaults to avoid recursion
function getPPEClasses(){
  let seen={};
  let classes=[];
  (client.reportingCOA||[]).forEach(c=>{
    if(c.ppeClass&&c.ppeRole==='cost'&&!seen[c.ppeClass]){
      seen[c.ppeClass]=true;
      // Label = name without " — Cost"
      let label=(c.name||'').replace(/\s*[—–-]+\s*Cost\s*$/i,'').trim()||c.ppeClass;
      classes.push({key:c.ppeClass,label,costId:'ppe_cost.'+c.ppeClass,accDepId:'ppe_acc_dep.'+c.ppeClass,depId:'ppe_dep.'+c.ppeClass});
    }
  });
  return classes;
}

function getBSValue(coaId,useCurrentYear){
  useCurrentYear=useCurrentYear!==false;
  let raw=useCurrentYear?client.raw.bs:client.raw.bs_py;
  let accounts=raw.accounts||{};
  return Object.entries(client.mappings)
    .filter(([,v])=>v===coaId)
    .reduce((s,[k])=>s+num(accounts[k]),0);
}

function getPLYTDValue(coaId){
  // Sum all periods up to and including reportMonth within FY
  let ytd=ytdMonths();
  return ytd.reduce((s,m)=>s+getCoaValue(coaId,m),0);
}

function hasPPE(){
  return getPPEClasses().some(p=>getBSValue(p.costId)||getBSValue(p.accDepId));
}

function ensurePPENote(){
  ensureNoteDefaults();
  // PPE note is always kept as a special 'ppe' type
  let existing=client.notes.find(n=>n.type==='ppe');
  if(!existing){
    // Shift all existing note numbers up by 1 to make room for Note 1
    client.notes.forEach(n=>{if(n.number>=1)n.number+=1;});
    Object.keys(client.reportNoteRefs).forEach(k=>{
      if(num(client.reportNoteRefs[k])>=1)client.reportNoteRefs[k]=num(client.reportNoteRefs[k])+1;
    });
    client.notes.unshift({number:1,heading:'Property, Plant and Equipment',comment:'',type:'ppe'});
    client.reportNoteRefs['__ppe']=1;
  }
  return client.notes.find(n=>n.type==='ppe');
}

function renderPPENoteContent(cur){
  let ppeClasses=getPPEClasses();
  if(!ppeClasses.length)return '<p class="muted">No PPE classes found in Reporting COA. Add PPE cost/acc_dep/dep lines in the COA editor.</p>';
  let hasPY=Object.keys(client.raw.bs_py.accounts||{}).length>0;
  let html='';

  ppeClasses.forEach(p=>{
    let costCY=getBSValue(p.costId,true);
    let accDepCY=getBSValue(p.accDepId,true);
    let nbvCY=costCY-Math.abs(accDepCY);
    let costPY=hasPY?getBSValue(p.costId,false):null;
    let accDepPY=hasPY?getBSValue(p.accDepId,false):null;
    let nbvPY=hasPY?(costPY-Math.abs(accDepPY)):null;
    let depYTD=getPLYTDValue(p.depId);
    if(!costCY&&!accDepCY&&(!hasPY||(!costPY&&!accDepPY)))return;
    let noteKey='ppe_'+p.key;
    if(!client.ppeNotes[noteKey])client.ppeNotes[noteKey]={additions:0,disposals:0,note:''};
    let pn=client.ppeNotes[noteKey];
    let additions=num(pn.additions);
    let disposals=num(pn.disposals);
    // Reconciliation: PY NBV + Additions - Disposals - Dep = CY NBV
    let reconClosing=nbvPY!==null?(nbvPY+additions-disposals-Math.abs(depYTD)):null;
    let reconDiff=reconClosing!==null?(nbvCY-reconClosing):null;
    let reconFlag=reconDiff!==null&&Math.abs(reconDiff)>5
      ?`<span style="color:var(--bad);font-weight:bold;font-size:11px"> ⚠ Recon diff: ${money(reconDiff,cur)}</span>`:'';

    html+=`<div style="margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--line)">
      <b style="font-size:13px">${esc(p.label)}</b>${reconFlag}
      <table class="stmt" style="margin-top:8px">
        <thead><tr><th></th><th class="right" style="min-width:100px">Cost</th><th class="right" style="min-width:100px">Acc. Dep</th><th class="right" style="min-width:100px">NBV</th></tr></thead>
        <tbody>`;
    if(hasPY&&nbvPY!==null){
      html+=`<tr><td>Opening balance (prior year BS)</td><td class="right">${money(costPY,cur)}</td><td class="right">(${money(Math.abs(accDepPY),cur)})</td><td class="right">${money(nbvPY,cur)}</td></tr>`;
    }
    html+=`<tr><td>Additions <input type="number" value="${additions}" style="width:110px;padding:3px 6px;font-size:12px;margin-left:8px;border:1px solid #d1d5db;border-radius:4px" onchange="if(!client.ppeNotes['${noteKey}'])client.ppeNotes['${noteKey}']={};client.ppeNotes['${noteKey}'].additions=+this.value;renderNotes()"></td><td class="right">${money(additions,cur)}</td><td class="right">—</td><td class="right">${money(additions,cur)}</td></tr>`;
    html+=`<tr><td>Disposals (at NBV) <input type="number" value="${disposals}" style="width:110px;padding:3px 6px;font-size:12px;margin-left:8px;border:1px solid #d1d5db;border-radius:4px" onchange="if(!client.ppeNotes['${noteKey}'])client.ppeNotes['${noteKey}']={};client.ppeNotes['${noteKey}'].disposals=+this.value;renderNotes()"></td><td class="right">—</td><td class="right">—</td><td class="right">(${money(disposals,cur)})</td></tr>`;
    html+=`<tr><td>Depreciation (P&L YTD)</td><td class="right">—</td><td class="right">(${money(Math.abs(depYTD),cur)})</td><td class="right">(${money(Math.abs(depYTD),cur)})</td></tr>`;
    html+=`<tr class="total-row"><td><b>Closing balance (current BS)</b></td><td class="right"><b>${money(costCY,cur)}</b></td><td class="right"><b>(${money(Math.abs(accDepCY),cur)})</b></td><td class="right"><b>${money(nbvCY,cur)}</b></td></tr>`;
    html+=`</tbody></table>
      <div style="margin-top:6px"><label style="font-size:11px">Note comment</label>
      <textarea rows="2" style="width:100%;font-size:12px;padding:5px;border:1px solid var(--line);border-radius:6px" onchange="client.ppeNotes['${noteKey}'].note=this.value">${esc(pn.note||'')}</textarea>
      </div>
    </div>`;
  });
  return html||'<p class="muted">No PPE balances found. Import the Balance Sheet to populate.</p>';
}

  if(!client.notes)client.notes=[];
  if(!client.reportNoteRefs)client.reportNoteRefs={};
}

function addNote(){
  ensureNoteDefaults();
  let max=Math.max(0,...client.notes.map(n=>+n.number||0));
  client.notes.push({number:max+1,heading:'New Note',comment:'',type:'manual'});
  renderNotes();
}

function deleteNote(i){
  if(!confirm('Delete this note?'))return;
  let n=client.notes[i];
  // Remove any reportNoteRefs pointing to this number
  Object.keys(client.reportNoteRefs).forEach(k=>{if(client.reportNoteRefs[k]===n.number)delete client.reportNoteRefs[k];});
  client.notes.splice(i,1);
  renderNotes();
}

function renumberNotes(){
  client.notes.sort((a,b)=>a.number-b.number);
  client.notes.forEach((n,i)=>{n.number=i+1;});
  renderNotes();
}

function generateBreakdownNotes(){
  ensureClientDefaults();ensureNoteDefaults();
  let bsAccounts=Object.entries(client.raw.bs.accounts||{});
  let groupedByCoaId={};
  bsAccounts.forEach(([name,val])=>{
    let coaId=client.mappings[name];
    if(!coaId)return;
    if(!groupedByCoaId[coaId])groupedByCoaId[coaId]=[];
    groupedByCoaId[coaId].push({name,val:num(val)});
  });
  let added=0,updated=0;
  Object.entries(groupedByCoaId).forEach(([coaId,items])=>{
    if(items.length<2)return;
    let coaEntry=client.reportingCOA.find(c=>c.id===coaId);
    if(!coaEntry)return;
    let existingNum=client.reportNoteRefs[coaId];
    let existingNote=existingNum?client.notes.find(n=>n.number===existingNum&&n.type==='breakdown'):null;
    if(existingNote){existingNote.breakdown=items;updated++;}
    else{
      let max=Math.max(0,...client.notes.map(n=>+n.number||0));
      let newNote={number:max+1,heading:coaEntry.name+' — Detail',comment:'',type:'breakdown',breakdown:items};
      client.notes.push(newNote);
      client.reportNoteRefs[coaId]=newNote.number;
      added++;
    }
  });
  client.notes.sort((a,b)=>a.number-b.number);
  renderNotes();
  alert(`Notes generated: ${added} new, ${updated} updated.`);
}

// Staff Savings Reconciliation helper
// Notice Deposit + Money Market = Staff Savings Payable (within tolerance)
function staffSavingsRecon(){
  ensureClientDefaults();
  let bs = client.raw.bs.accounts||{};
  let tol = client.kpiBenchmarks.staff_savings_tolerance||50;
  // Find accounts by mapping
  let noticeDeposit=0, moneyMarket=0, staffPayable=0;
  Object.entries(client.mappings).forEach(([name,coaId])=>{
    let val = num(bs[name]);
    if(!val) return;
    let n = name.toLowerCase();
    if(/notice deposit/.test(n)) noticeDeposit += val;
    else if(/money market/.test(n)) moneyMarket += val;
    else if(/staff.*saving.*payable|staff.*saving/i.test(n)&&/payable|liabilit/i.test(n)) staffPayable += Math.abs(val);
  });
  let bankTotal = noticeDeposit + moneyMarket;
  let diff = bankTotal - staffPayable;
  let pass = Math.abs(diff) <= tol;
  return {noticeDeposit, moneyMarket, bankTotal, staffPayable, diff, pass, tol,
    hasData: noticeDeposit>0||moneyMarket>0||staffPayable>0};
}

    let sW=Math.max(2,Math.round((trendSales[i]/maxBar)*100));
    let gW=Math.max(0,Math.round((Math.max(0,trendGP[i])/maxBar)*100));
    let gpPct=trendSales[i]?trendGP[i]/trendSales[i]:0;
    return `<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
      <div style="width:48px;font-size:11px;color:var(--muted);text-align:right">${monthLabel(m)}</div>
      <div style="flex:1;position:relative;height:20px;background:#f3f4f6;border-radius:4px;overflow:hidden">
        <div style="position:absolute;left:0;top:0;height:100%;width:${sW}%;background:#cbd5e1;border-radius:4px"></div>
        <div style="position:absolute;left:0;top:0;height:100%;width:${gW}%;background:${trendGP[i]>=0?'var(--ok)':'var(--bad)'};border-radius:4px;opacity:0.85"></div>
      </div>
      <div style="width:90px;font-size:11px;text-align:right">${money(trendSales[i],cur)}</div>
      <div style="width:75px;font-size:11px;text-align:right;color:${trendGP[i]>=0?'var(--ok)':'var(--bad)'}">${pct(gpPct)}</div>
    </div>`;
  }).join('');

  // QC quick status
  let qcAll=qcChecks();
  let qcFails=qcAll.filter(c=>!c.pass);
  let qcBar=qcFails.length===0
    ?'<div style="background:#ecfdf5;border:1px solid #a7f3d0;color:#065f46;padding:8px 12px;border-radius:8px;font-size:12px">✓ All QC checks passed</div>'
    :`<div style="background:#fffbeb;border:1px solid #fde68a;color:#92400e;padding:8px 12px;border-radius:8px;font-size:12px">⚠ ${qcFails.length} QC check${qcFails.length>1?'s':''} outstanding — <a href="#" onclick="show('qc');return false">view QC panel</a></div>`;

  // Safe variance badge: returns '' (not a badge) when base is 0, near-zero, or sign changes
  function svb(actual,base,fav){
    if(!base||Math.abs(base)<50)return '';
    if(base<0&&actual>=0)return '';
    if(base>=0&&actual<0)return '';
    return varBadge((actual-base)/Math.abs(base),fav);
  }
  function kpi(label,val,sub,py){return `<div style="background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px">
    <div style="font-size:11px;color:var(--muted)">${label}</div>
    <div style="font-size:22px;font-weight:bold;margin:4px 0;color:${typeof val==='string'&&val.includes('(')?'var(--bad)':'inherit'}">${val}</div>
    ${sub?`<div style="font-size:11px">${sub}</div>`:''}
    ${py?`<div style="font-size:11px;margin-top:2px">${py}</div>`:''}
  </div>`;}

  document.getElementById('dashboard').innerHTML=`
  <div style="max-width:1300px">
    <!-- Header -->
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;padding-bottom:12px;border-bottom:3px solid var(--brand)">
      <div>
        <div style="font-size:22px;font-weight:bold">${esc(s.clientName||'PMM')}</div>
        <div style="color:var(--muted);margin-top:2px">Management Dashboard — ${monthLabel(rm)} &nbsp;|&nbsp; FY${s.fyStartMonth?allFY[0].slice(0,4):'?'}</div>
      </div>
      <div style="text-align:right">
        <span class="pill ${(s.status||'draft').toLowerCase().replace(' ','-')}">${s.status||'Draft'}</span>
        ${s.preparedBy?`<div style="font-size:11px;color:var(--muted);margin-top:4px">Prepared: ${esc(s.preparedBy)}</div>`:''}
      </div>
    </div>

    ${qcBar}

    ${!hasPL?`<div class="warning" style="margin-top:12px">No P&L data imported yet. Go to <b>Import Data</b> to get started.</div>`:''}

    <!-- KPI row -->
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0">
      ${kpi('Revenue — '+monthLabel(rm), money(incCm,cur),
        `${svb(incCm,incBudCm,true)} vs Budget`,
        `${svb(incCm,incPyCm,true)} vs PY`)}
      ${kpi('Gross Profit — '+monthLabel(rm), money(gpCm,cur),
        `<b>${pct(gpPctCm)}</b> GP%  ${svb(gpCm,gpBudCm,true)} vs Budget`,
        `${svb(gpCm,gpPyCm,true)} vs PY`)}
      ${kpi('Net Profit — '+monthLabel(rm), money(npCm,cur),
        `<b>${pct(npPctCm)}</b> NP%  ${svb(npCm,npBudCm,true)} vs Budget`,
        `${svb(npCm,npPyCm,true)} vs PY`)}
      ${kpi('Revenue YTD', money(incYtd,cur),
        `${svb(incYtd,incBudYtd,true)} vs Budget YTD`,
        `${svb(incYtd,incPyYtd,true)} vs PY YTD`)}
    </div>

    <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:16px">
      ${kpi('GP YTD', money(gpYtd,cur),
        `${svb(gpYtd,gpBudYtd,true)} vs Budget YTD`,
        `${svb(gpYtd,gpPyYtd,true)} vs PY YTD`)}
      ${kpi('NP YTD', money(npYtd,cur),
        `${svb(npYtd,npBudYtd,true)} vs Budget YTD`,
        `${svb(npYtd,npPyYtd,true)} vs PY YTD`)}
      ${kpi('Debtors', money(client.raw.ar.rows.reduce((s,r)=>s+r.total,0),cur),
        client.raw.ar.asOf?'As at '+client.raw.ar.asOf:'Not imported')}
      ${kpi('Creditors', money(client.raw.ap.rows.reduce((s,r)=>s+r.total,0),cur),
        client.raw.ap.asOf?'As at '+client.raw.ap.asOf:'Not imported')}
      ${(()=>{
        let ss=staffSavingsRecon();
        if(!ss.hasData) return kpi('Staff Savings','No BS data','Import Balance Sheet');
        let col=ss.pass?'var(--ok)':'var(--bad)';
        let icon=ss.pass?'✓':'✗';
        return `<div style="background:#fff;border:2px solid ${col};border-radius:10px;padding:14px">
          <div style="font-size:11px;color:var(--muted)">Staff Savings Recon</div>
          <div style="font-size:18px;font-weight:bold;margin:4px 0;color:${col}">${icon} ${money(ss.diff>=0?ss.diff:-ss.diff,cur)}</div>
          <div style="font-size:10px;color:var(--muted)">Bank: ${money(ss.bankTotal,cur)} | Payable: ${money(ss.staffPayable,cur)}</div>
          <div style="font-size:10px;color:${col}">${ss.pass?'Within tolerance':'DIFFERENCE — investigate'}</div>
        </div>`;
      })()}
    </div>

    <!-- Conversion Rates + GPLR -->
    ${hasPL?(function(){
      // Conversion rates: Sales / Purchases per dept (BM, IM, TD only)
      let convDepts=[
        {id:'bm',label:'Blow Moulding',targetKey:'conv_rate_bm',color:'#1e40af'},
        {id:'im',label:'Injection Moulding',targetKey:'conv_rate_im',color:'#065f46'},
        {id:'td',label:'Dispensing Tubes',targetKey:'conv_rate_td',color:'#7c3aed'},
      ];
      let convRows=convDepts.map(function(d){
        let sales=getDeptValue(d.id,'sales',rm);
        let purch=getDeptValue(d.id,'purchases',rm);
        let ratio=purch?sales/purch:null;
        let target=client.kpiBenchmarks[d.targetKey]||2.0;
        let salesPY=getDeptValue(d.id,'sales',rm,client.raw.pl_py);
        let purchPY=getDeptValue(d.id,'purchases',rm,client.raw.pl_py);
        let ratioPY=purchPY?salesPY/purchPY:null;
        let ok=ratio!==null&&ratio>=target;
        let maxScale=Math.max(target*1.5,ratio?ratio*1.1:target*1.5);
        let bar=ratio!==null?Math.min(100,Math.round((ratio/maxScale)*100)):0;
        let targetBar=Math.min(98,Math.round((target/maxScale)*100));
        return '<div style="margin-bottom:12px">'
          +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">'
          +'<span style="font-size:12px;font-weight:bold;color:'+d.color+'">'+d.label+'</span>'
          +'<span style="font-size:14px;font-weight:bold;color:'+(ok?'var(--ok)':'var(--bad)')+'">'+
            (ratio!==null?ratio.toFixed(2)+'x':'No data')+
            (ratioPY!==null?' <span style="font-size:11px;color:var(--muted)">(PY: '+ratioPY.toFixed(2)+'x)</span>':'')+
          '</span></div>'
          +'<div style="position:relative;height:14px;background:#f3f4f6;border-radius:4px;overflow:hidden">'
          +(ratio!==null?'<div style="position:absolute;left:0;top:0;height:100%;width:'+bar+'%;background:'+d.color+';border-radius:4px;opacity:0.75"></div>':'')
          +'</div>'
          +'<div style="display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:2px">'
          +'<span>'+(ok?'✓ Above target':'⚠ Below target')+' ('+target.toFixed(1)+'x)</span>'
          +'<span>│ target at '+targetBar+'%</span>'
          +'</div>'
          +'</div>';
      }).join('');

      // GPLR: GP / Total Labour
      let gpCm2=incCm-cosCm;
      let labour=getCoaValue('cogs.wages',rm)+getCoaValue('expense.director_remuneration',rm)+getCoaValue('expense.salaries_wages',rm);
      let gplr=labour?gpCm2/labour:null;
      let gplrTarget=client.kpiBenchmarks.gplr_target||2.0;
      let labourPY=getCoaValue('cogs.wages',rm,client.raw.pl_py)+getCoaValue('expense.director_remuneration',rm,client.raw.pl_py)+getCoaValue('expense.salaries_wages',rm,client.raw.pl_py);
      let gpCmPY=incPyCm-((['opening_stock','purchases','closing_stock','wages','consumables','r_and_m','cos_direct'].reduce(function(s,id){return s+getCoaValue('cogs.'+id,rm,client.raw.pl_py);},0)));
      let gplrPY=labourPY?gpCmPY/labourPY:null;
      let gpYtd2=incYtd-ytd.reduce(function(s,m){return s+['opening_stock','purchases','closing_stock','wages','consumables','r_and_m','cos_direct'].reduce(function(ss,id){return ss+getCoaValue('cogs.'+id,m);},0);},0);
      let labourYtd=ytd.reduce(function(s,m){return s+getCoaValue('cogs.wages',m)+getCoaValue('expense.director_remuneration',m)+getCoaValue('expense.salaries_wages',m);},0);
      let gplrYtd=labourYtd?gpYtd2/labourYtd:null;
      let gplrOk=gplr!==null&&gplr>=gplrTarget;
      let gplrMaxScale=Math.max(gplrTarget*1.5,gplr?gplr*1.1:gplrTarget*1.5);
      let gplrBar=gplr!==null?Math.min(100,Math.round((gplr/gplrMaxScale)*100)):0;
      let gplrTargetBar=Math.min(98,Math.round((gplrTarget/gplrMaxScale)*100));

      return '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px">'
        // Conversion Rate panel
        +'<div style="background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px">'
        +'<h3 style="margin:0 0 12px;font-size:14px">Conversion Rate — '+monthLabel(rm)+'</h3>'
        +'<p style="font-size:11px;color:var(--muted);margin-bottom:10px">Sales ÷ Raw Material Purchases | BM, IM &amp; Tubes only</p>'
        +convRows
        +'</div>'
        // GPLR panel
        +'<div style="background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px">'
        +'<h3 style="margin:0 0 12px;font-size:14px">GP per Labour Rand — '+monthLabel(rm)+'</h3>'
        +'<div style="text-align:center;padding:8px 0 16px">'
        +'<div style="font-size:42px;font-weight:bold;color:'+(gplrOk?'var(--ok)':'var(--bad)')+'">'+
          (gplr!==null?gplr.toFixed(2)+'x':'No data')+
        '</div>'
        +'<div style="font-size:12px;color:var(--muted);margin-top:4px">Target: '+gplrTarget.toFixed(1)+'x'
          +(gplrPY!==null?' &nbsp;|&nbsp; PY: '+gplrPY.toFixed(2)+'x':'')
          +(gplrYtd!==null?' &nbsp;|&nbsp; YTD: '+gplrYtd.toFixed(2)+'x':'')+
        '</div></div>'
        +(gplr!==null?
          '<div style="position:relative;height:20px;background:#f3f4f6;border-radius:8px;overflow:hidden;margin-bottom:12px">'
          +'<div style="position:absolute;left:0;top:0;height:100%;width:'+gplrBar+'%;background:'+(gplrOk?'var(--ok)':'var(--bad)')+';border-radius:8px;opacity:0.75"></div>'
          +'<div style="position:absolute;top:0;height:100%;width:2px;background:#374151;left:'+gplrTargetBar+'%"></div>'
          +'</div>':'')
        +'<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font-size:11px;text-align:center">'
        +'<div><div style="color:var(--muted)">GP (Month)</div><div style="font-weight:bold">'+money(gpCm2,cur)+'</div></div>'
        +'<div><div style="color:var(--muted)">Labour (Month)</div><div style="font-weight:bold">'+money(labour,cur)+'</div></div>'
        +'<div><div style="color:var(--muted)">GP per R Labour</div><div style="font-weight:bold;color:'+(gplrOk?'var(--ok)':'var(--bad)')+'">'+
          (gplr!==null?'R '+gplr.toFixed(2):'—')+
        '</div></div>'
        +'</div>'
        +'</div>'
        +'</div>';
    })():''}

    <!-- Two columns: trend + dept -->
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px">
      <div style="background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px">
        <h3 style="margin:0 0 12px;font-size:14px">Revenue & GP Trend</h3>
        <div style="display:flex;gap:16px;margin-bottom:10px;font-size:11px">
          <span><span style="display:inline-block;width:12px;height:12px;background:#cbd5e1;border-radius:2px;vertical-align:middle;margin-right:4px"></span>Revenue</span>
          <span><span style="display:inline-block;width:12px;height:12px;background:var(--ok);border-radius:2px;vertical-align:middle;margin-right:4px"></span>Gross Profit</span>
        </div>
        ${barRows||'<p class="muted" style="font-size:12px">Import P&L to see trend</p>'}
      </div>
      <div style="background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px">
        <h3 style="margin:0 0 12px;font-size:14px">Department GP — ${monthLabel(rm)}</h3>
        ${hasPL?`<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">${deptCards}</div>`:'<p class="muted" style="font-size:12px">Import P&L to see department results</p>'}
      </div>
    </div>

    <!-- Commentary -->
    ${client.narrative?`<div style="background:#f9fafb;border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px">
      <b style="font-size:13px">Monthly Commentary</b>
      <div style="margin-top:6px;font-size:13px;white-space:pre-wrap">${esc(client.narrative)}</div>
    </div>`:''}
  </div>`;
}

// ═══════════════════════════════════════════════════════
//  QC & VALIDATION
// ═══════════════════════════════════════════════════════
function qcChecks(){
  ensureClientDefaults();
  let checks=[];
  let rm=client.settings.reportMonth;
  let ytd=ytdMonths();

  // 1. All accounts mapped
  let allAcctNames=[
    ...Object.keys(client.raw.pl.accounts||{}),
    ...Object.keys(client.raw.bs.accounts||{})
  ];
  let validIds=new Set(client.reportingCOA.map(c=>c.id));
  let unmapped=allAcctNames.filter(a=>!client.mappings[a]||!validIds.has(client.mappings[a]));
  checks.push({id:'mappings',label:'All accounts mapped to a COA line',
    pass:unmapped.length===0,
    detail:unmapped.length?`${unmapped.length} unmapped: ${unmapped.slice(0,4).map(n=>`"${n}"`).join(', ')}${unmapped.length>4?` +${unmapped.length-4} more`:''}`:''});

  // 2. NP matches BS current year earnings (if BS imported)
  let hasBSData=Object.keys(client.raw.bs.accounts||{}).length>0;
  if(hasBSData){
    let bsNP=getCoaValue('equity.current_year',rm,client.raw.bs)||0;
    // YTD net profit from P&L
    let incYtd=ytd.reduce((s,m)=>s+getCoaValue('income.sales',m)+getCoaValue('income.other',m),0);
    let cosYtd=ytd.reduce((s,m)=>s+['opening_stock','purchases','closing_stock','wages','consumables','r_and_m','cos_direct'].reduce((ss,id)=>ss+getCoaValue('cogs.'+id,m),0),0);
    let expIds=['accounting_fees','advertising','bank_charges','cleaning','computer_expenses','courier','director_remuneration','electricity','entertainment','fuel','insurance','legal_fees','motor_vehicle','printing_stationery','rent','salaries_wages','security','staff_welfare','subscription','telephone_internet','training','travel','water'];
    let expYtd=ytd.reduce((s,m)=>s+expIds.reduce((ss,id)=>ss+getCoaValue('expense.'+id,m),0),0);
    let oiYtd=ytd.reduce((s,m)=>s+['interest_received','discounts_received','etd_deduction','recoveries'].reduce((ss,id)=>ss+getCoaValue('other_income.'+id,m),0),0);
    let oeYtd=ytd.reduce((s,m)=>s+['interest_paid','depreciation','bad_debts','forex','fines','income_tax'].reduce((ss,id)=>ss+getCoaValue('other_expense.'+id,m),0),0);
    let plNP=incYtd-cosYtd+oiYtd-expYtd-oeYtd;
    let diff=Math.abs(bsNP-plNP);
    let pctDiff=Math.abs(plNP)>100?diff/Math.abs(plNP):0;
    checks.push({id:'np_bs',label:'P&L Net Profit YTD agrees to BS Current Year Earnings',
      pass:diff<100||pctDiff<0.001,
      detail:diff>=100?`P&L NP: ${money(plNP)} | BS Current Year: ${money(bsNP)} | Diff: ${money(diff)} — check unmapped accounts or COA line assignments`:''});
  }

  // 3. BS balances (Assets = Liabilities + Equity)
  if(hasBSData){
    let assetTypes=['asset_current','asset_noncurrent'];
    let liabTypes=['liability_current','liability_noncurrent','equity'];
    let totalAssets=client.reportingCOA.filter(c=>assetTypes.includes(c.type)).reduce((s,c)=>s+getBSValue(c.id,true),0);
    // Add PPE net book value
    getPPEClasses().forEach(p=>{
      totalAssets+=getBSValue(p.costId,true)+getBSValue(p.accDepId,true); // accDep is negative
    });
    let totalLiabEquity=client.reportingCOA.filter(c=>liabTypes.includes(c.type)).reduce((s,c)=>s+getBSValue(c.id,true),0);
    let bsDiff=Math.abs(totalAssets-totalLiabEquity);
    checks.push({id:'bs_balance',label:'Balance Sheet balances (Assets = Liabilities + Equity)',
      pass:bsDiff<10,
      detail:bsDiff>=10?`Total Assets: ${money(totalAssets)} | Total Liab+Equity: ${money(totalLiabEquity)} | Out by: ${money(bsDiff)}`:''});
  }

  // 4. Overdue debtors (60+ days) have notes
  let arRows=client.raw.ar.rows||[];
  let arIssues=arRows.filter(r=>{
    let over60=(r.d60||0)+(r.d90||0)+(r.d120plus||0);
    return over60>0&&!(client.debtors_notes||{})[r.name];
  });
  checks.push({id:'ar',label:'All overdue debtors (60+ days) have a comment',
    pass:arIssues.length===0,
    detail:arIssues.length?`${arIssues.length} customer${arIssues.length>1?'s':''} need comments: ${arIssues.slice(0,3).map(r=>r.name).join(', ')}${arIssues.length>3?'…':''}`:''});

  // 5. Overdue creditors (60+ days) have notes
  let apRows=client.raw.ap.rows||[];
  let apIssues=apRows.filter(r=>{
    let over60=(r.d60||0)+(r.d90||0)+(r.d120plus||0);
    return over60>0&&!(client.creditors_notes||{})[r.name];
  });
  checks.push({id:'ap',label:'All overdue creditors (60+ days) have a comment',
    pass:apIssues.length===0,
    detail:apIssues.length?`${apIssues.length} supplier${apIssues.length>1?'s':''} need comments: ${apIssues.slice(0,3).map(r=>r.name).join(', ')}${apIssues.length>3?'…':''}`:''});

  // 6. Budget imported for report month
  let budgetLines=['income.sales','cogs.purchases','cogs.wages','expense.director_remuneration','expense.rent','expense.electricity'];
  let hasBudget=budgetLines.some(id=>getBudget(id,rm)!==0);
  checks.push({id:'budget',label:'Budget data imported for report month',
    pass:hasBudget,detail:hasBudget?'':'No budget figures found for '+monthLabel(rm)+' — enter in Budget Builder'});

  // 7. P&L imported
  let hasPL=Object.keys(client.raw.pl.accounts||{}).length>0&&
    (client.raw.pl.periods||[]).includes(rm);
  checks.push({id:'pl',label:'P&L data includes the report month',
    pass:hasPL,detail:hasPL?'':'P&L not imported or does not cover '+monthLabel(rm)});

  // 8. No unallocated / suspense balances
  let suspense=['Suspense Account','Transfer Clearing Account','SARS Tax Debt Recovery Control Account'];
  let suspBal=suspense.reduce((s,n)=>{
    let v=client.raw.bs.accounts?.[n];
    return s+Math.abs(num(v));
  },0);
  checks.push({id:'suspense',label:'Suspense / clearing accounts are zero or explained',
    pass:suspBal<10,
    detail:suspBal>=10?`${money(suspBal)} in suspense/clearing accounts — add a note`:''});

  // 9. PPE reconciles (if PY BS available)
  let hasPYBS=Object.keys(client.raw.bs_py.accounts||{}).length>0;
  if(hasPYBS){
    let ppeFailClasses=[];
    getPPEClasses().forEach(p=>{
      let costCY=getBSValue(p.costId,true),accDepCY=getBSValue(p.accDepId,true);
      let nbvCY=costCY-Math.abs(accDepCY);
      let costPY=getBSValue(p.costId,false),accDepPY=getBSValue(p.accDepId,false);
      let nbvPY=costPY-Math.abs(accDepPY);
      if(!costCY&&!accDepCY&&!costPY&&!accDepPY)return;
      let depYTD=getActualYTD(p.depId,ytd);
      let pn=client.ppeNotes?.['ppe_'+p.key]||{additions:0,disposals:0};
      let reconClose=nbvPY+num(pn.additions)-num(pn.disposals)-Math.abs(depYTD);
      let diff=Math.abs(nbvCY-reconClose);
      if(diff>50)ppeFailClasses.push(`${p.label} (diff ${money(diff)})`);
    });
    checks.push({id:'ppe',label:'PPE schedule reconciles for all asset classes',
      pass:ppeFailClasses.length===0,
      detail:ppeFailClasses.length?`Recon difference in: ${ppeFailClasses.join(', ')}`:''});
  }

  // 9b. Debt Schedule reconciled
  let dsQC=dsQCCheck();
  if(dsQC!==null){
    checks.push({id:'debt_recon',label:'Debt Schedule reconciled — all facility balances agree to Balance Sheet',
      pass:dsQC.pass,
      detail:dsQC.pass?'':dsQC.count+' facilit'+(dsQC.count===1?'y':'ies')+' unreconciled: '+dsQC.names.slice(0,3).join(', ')+(dsQC.names.length>3?'…':'')});
  }

  // 10. Staff savings reconciliation
  let ss=staffSavingsRecon();
  if(ss.hasData){
    checks.push({id:'staff_savings',label:'Staff Savings reconciles (Notice Deposit + Money Market = Staff Savings Payable)',
      pass:ss.pass,
      detail:ss.pass?'':`Difference: ${money(Math.abs(ss.diff))} — Bank total: ${money(ss.bankTotal)} vs Payable: ${money(ss.staffPayable)} (tolerance: R ${ss.tol})`});
  }

  // 11. BS history completeness — all months from FY start to report month must be imported
  let fyMs=fyMonths();
  let rmIdx=fyMs.indexOf(rm);
  let requiredMonths=rmIdx>=0?fyMs.slice(0,rmIdx+1):[];
  let bsHistCY=client.raw.bs_history_cy||{};
  let missingBS=requiredMonths.filter(m=>!bsHistCY[m]||!Object.keys(bsHistCY[m].accounts||{}).length);
  checks.push({id:'bs_history',label:'Balance Sheet imported for all months up to report date',
    pass:missingBS.length===0,
    detail:missingBS.length?`Missing: ${missingBS.map(m=>monthLabel(m)).join(', ')}`:''});

  return checks;
}

function renderBalanceSheet(){
  ensureClientDefaults();
  let cur=client.settings.currency||'R';
  let bs=client.raw.bs.accounts||{};
  let bsPY=client.raw.bs_py.accounts||{};
  let hasBSData=Object.keys(bs).length>0;
  let hasPY=Object.keys(bsPY).length>0;
  let asOf=client.raw.bs.asOf||client.settings.reportMonth;

  function getBSVal(coaId,isPY){
    let raw=isPY?bsPY:bs;
    return Object.entries(client.mappings)
      .filter(([,v])=>v===coaId)
      .reduce((s,[k])=>s+num(raw[k]),0);
  }

  function bsSection(title,coaTypes,sign){
    sign=sign||1;
    let lines=client.reportingCOA.filter(c=>coaTypes.includes(c.type)&&!c.hidden&&!c.ppeRole);
    let sectionTotal=0,pyTotal=0;
    let rows=lines.map(c=>{
      let noteNum=client.reportNoteRefs&&client.reportNoteRefs[c.id]?client.reportNoteRefs[c.id]:null;
      let v=getBSVal(c.id,false)*sign;
      let py=hasPY?getBSVal(c.id,true)*sign:null;
      sectionTotal+=v;
      if(py!==null)pyTotal+=py;
      if(!v&&!py)return '';
      let noteLnk=noteNum?`<a href="#note${noteNum}" onclick="jumpToNote(${noteNum});return false;" style="font-size:10px;color:var(--brand);font-weight:bold;border:1px solid var(--brand);border-radius:3px;padding:1px 4px;margin-left:4px">${noteNum}</a>`:'';
      return `<tr>
        <td class="indent">${esc(c.name)}${noteLnk}</td>
        <td class="right">${money(v,cur)}</td>
        <td class="right" style="color:var(--muted)">${py!==null?money(py,cur):'—'}</td>
      </tr>`;
    }).join('');
    // PPE section
    let ppeRows='';
    let ppeTotal=0,ppePYTotal=0;
    getPPEClasses().forEach(p=>{
      let cost=getBSVal(p.costId,false);
      let accDep=getBSVal(p.accDepId,false);
      let nbv=cost+accDep; // accDep is negative
      let costPY=hasPY?getBSVal(p.costId,true):null;
      let accDepPY=hasPY?getBSVal(p.accDepId,true):null;
      let nbvPY=costPY!==null?costPY+accDepPY:null;
      if(!nbv&&!nbvPY)return;
      ppeTotal+=nbv;
      if(nbvPY!==null)ppePYTotal+=nbvPY;
      let noteNum=client.reportNoteRefs&&client.reportNoteRefs['__ppe']?client.reportNoteRefs['__ppe']:1;
      ppeRows+=`<tr><td class="indent">${esc(p.label)} (NBV)<a href="#note1" onclick="jumpToNote(1);return false;" style="font-size:10px;color:var(--brand);font-weight:bold;border:1px solid var(--brand);border-radius:3px;padding:1px 4px;margin-left:4px">1</a></td><td class="right">${money(nbv,cur)}</td><td class="right" style="color:var(--muted)">${nbvPY!==null?money(nbvPY,cur):'—'}</td></tr>`;
    });
    if(coaTypes.includes('asset_noncurrent')){
      rows=ppeRows+rows;
      sectionTotal+=ppeTotal;
      pyTotal+=ppePYTotal;
    }
    return `<tr class="section-row"><td colspan="3">${title}</td></tr>
      ${rows}
      <tr class="subtotal-row"><td><b>Total ${title}</b></td><td class="right"><b>${money(sectionTotal,cur)}</b></td><td class="right" style="color:var(--muted)"><b>${hasPY?money(pyTotal,cur):'—'}</b></td></tr>`;
  }

  let html=`<div class="panel"><h2>Balance Sheet</h2>`;
  if(!hasBSData){html+=`<div class="warning">No Balance Sheet data imported. Go to Import Data.</div></div>`;document.getElementById('balance_sheet').innerHTML=html;return;}
  html+=`<p class="muted" style="margin-bottom:14px">As at: ${asOf}${hasPY?' | Prior year figures shown in grey':''}</p>
  <div style="max-width:800px;overflow:auto">
  <table class="stmt">
    <thead><tr>
      <th style="min-width:260px">Description</th>
      <th class="right" style="min-width:120px">${asOf}</th>
      <th class="right" style="min-width:120px;color:var(--muted)">${hasPY?client.raw.bs_py.asOf||'Prior Year':'Prior Year'}</th>
    </tr></thead>
    <tbody>
      ${bsSection('Non-Current Assets',['asset_noncurrent'])}
      ${bsSection('Current Assets',['asset_current'])}
      ${bsSection('Equity',['equity'])}
      ${bsSection('Non-Current Liabilities',['liability_noncurrent'])}
      ${bsSection('Current Liabilities',['liability_current'])}
    </tbody>
  </table>
  </div></div>`;
  document.getElementById('balance_sheet').innerHTML=html;
}

// ── Helpers ──────────────────────────────────────────────────────────────────
function dsFacilities(){return client.facilities||[];}
function dsReconKey(){return client.settings.reportMonth||'';}
function dsRecon(){
  let k=dsReconKey();
  if(!client.debtRecon)client.debtRecon={};
  if(!client.debtRecon[k])client.debtRecon[k]={};
  return client.debtRecon[k];
}
function dsEntry(facId){
  let r=dsRecon();
  if(!r[facId])r[facId]={stmtCapital:null,stmtInterest:null,stmtAdminFee:null,instalment:null,remainingInstalments:null};
  return r[facId];
}
function bsBalForFacility(fac){
  // Return combined NCP+CP balance from latest imported BS
  let bs=client.raw.bs.accounts||{};
  let ncp=num(bs[fac.sageNCP]);
  let cp=num(bs[fac.sageCP]);
  return ncp+cp;
}
function dsTypeClass(t){
  return {amort:'ds-type-amort',revolving:'ds-type-revolving',overdraft:'ds-type-overdraft',director:'ds-type-director',other:'ds-type-other'}[t]||'ds-type-other';
}
function dsTypeLabel(t){
  return {amort:'Amortising',revolving:'Revolving',overdraft:'Overdraft',director:'Director Loan',other:'Other'}[t]||t;
}

// ── Active tab state ──────────────────────────────────────────────────────────
let _dsTab='facilities';
function dsShowTab(t){_dsTab=t;renderDebtSchedule();}

// ── Main render ───────────────────────────────────────────────────────────────
function renderDebtSchedule(){
  ensureClientDefaults();
  let cur=client.settings.currency||'R';
  let rm=client.settings.reportMonth;
  let el=document.getElementById('debt_schedule');

  let tabs=['facilities','recon','journal','snapshot'].map(t=>{
    let labels={facilities:'⚙ Facilities',recon:'🔍 Monthly Recon',journal:'📄 Journal',snapshot:'📊 Snapshot'};
    return '<button class="ds-tab'+((_dsTab===t)?' active':'')+'" onclick="dsShowTab(\''+t+'\')">'+labels[t]+'</button>';
  }).join('');

  let inner='';
  if(_dsTab==='facilities') inner=dsBuildFacilities(cur);
  else if(_dsTab==='recon')  inner=dsBuildRecon(cur,rm);
  else if(_dsTab==='journal')inner=dsBuildJournal(cur,rm);
  else if(_dsTab==='snapshot')inner=dsBuildSnapshot(cur,rm);

  el.innerHTML=
    '<div class="panel" style="padding-bottom:8px">'+
      '<h2 style="margin-bottom:10px">Debt Schedule</h2>'+
      '<div class="ds-tabs">'+tabs+'</div>'+
      inner+
    '</div>';
}

// ── TAB 1: Facilities setup ───────────────────────────────────────────────────
function dsBuildFacilities(cur){

    return '<tr>'+
      '<td style="width:28px"><button class="btn sm danger" onclick="dsFacilityDelete('+i+')">✕</button></td>'+
      '<td><input class="ds-input" value="'+esc(f.financer||'')+'" onchange="dsFacilitySet('+i+',\'financer\',this.value)"></td>'+
      '<td><input class="ds-input" value="'+esc(f.accountNo||'')+'" onchange="dsFacilitySet('+i+',\'accountNo\',this.value)"></td>'+
      '<td><input class="ds-input" value="'+esc(f.description||'')+'" onchange="dsFacilitySet('+i+',\'description\',this.value)"></td>'+

      '<td><input class="ds-input" value="'+esc(f.sageNCP||'')+'" onchange="dsFacilitySet('+i+',\'sageNCP\',this.value)" placeholder="Exact Sage account name"></td>'+
      '<td><input class="ds-input" value="'+esc(f.sageCP||'')+'" onchange="dsFacilitySet('+i+',\'sageCP\',this.value)" placeholder="Exact Sage account name"></td>'+
      '<td><input class="ds-input" value="'+esc(f.sageInterest||'')+'" onchange="dsFacilitySet('+i+',\'sageInterest\',this.value)" placeholder="Exact Sage account name"></td>'+
    '</tr>';
  }).join(''):'<tr><td colspan="9" style="padding:14px;text-align:center;color:var(--muted)">No facilities set up yet. Click + Add Facility.</td></tr>';

        '<thead><tr>'+

          '<th style="min-width:200px">Sage CP Account</th>'+
          '<th style="min-width:200px">Sage Interest Account</th>'+
        '</tr></thead>'+
        '<tbody>'+rows+'</tbody>'+

    '</div>'+
  '</div>';
